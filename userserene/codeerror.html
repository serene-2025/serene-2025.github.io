<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบขัดข้องชั่วคราว</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: #ffffff;
            padding: 40px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 380px; /* ขนาดที่พอดีกับหน้าจอมือถือ */
            text-align: center;
        }

        .alert-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
            fill: #ff5252; /* สีแดงแจ้งเตือน */
        }

        h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin: 0 0 12px 0;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            color: #7f8c8d;
            line-height: 1.6;
            margin: 0 0 24px 0;
        }

        .btn-reload {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-reload:hover {
            background-color: #2980b9;
        }
        
        .btn-reload:active {
            transform: scale(0.98);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg class="alert-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
        </svg>

        <h1>ระบบขัดข้องชั่วคราว</h1>
        <p>ขณะนี้ Server ไม่สามารถให้บริการได้ตามปกติ<br>ทีมงานกำลังเร่งดำเนินการแก้ไขอย่างเร่งด่วน<br>กรุณาลองใหม่อีกครั้งในภายหลัง</p>

        <button class="btn-reload" onclick="window.location.reload();">
            ลองใหม่อีกครั้ง
        </button>

        <div class="footer-note">
            ขออภัยในความไม่สะดวกมา ณ ที่นี้
        </div>
    </div>

</body>
</html>
