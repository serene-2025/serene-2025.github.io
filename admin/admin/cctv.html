<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ขอดูกล้องวงจรปิด</title>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Prompt', sans-serif; background: #F8F9FB; }
    @keyframes slideUp { from { opacity:0; transform: translateY(15px); } to { opacity:1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.35s ease-out; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_v6Srw8MV1VE-K3A8alvqHQ_T_O26qVQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const EDGE_FUNCTION_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co/functions/v1/line-webhook';

    // 📍 รายชื่อจุดกล้อง — ดึงจากการตั้งค่าฝั่ง Admin แบบสด (ไม่ hardcode แล้ว)
    // เพื่อให้แอดมินแก้ไข/เพิ่มจุดกล้องได้จากหน้า Admin โดยไม่ต้อง deploy โค้ดใหม่
    async function fetchCameraZones() {
        try {
            const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/cctv_camera_zones_list');
            const d = await res.json();
            return (d.zones && d.zones.length) ? d.zones : ['อื่นๆ (ระบุในเหตุผล)'];
        } catch (e) {
            console.warn('fetchCameraZones failed, ใช้ค่า fallback', e);
            return ['อื่นๆ (ระบุในเหตุผล)'];
        }
    }

    const STATUS_LABELS = {
        pending:  { icon: '⏳', label: 'รอตรวจสอบ', color: 'amber' },
        approved: { icon: '✅', label: 'อนุมัติแล้ว', color: 'emerald' },
        rejected: { icon: '❌', label: 'ไม่อนุมัติ', color: 'rose' },
    };

    function buildCctvConfirmFlex(payload) {
        function infoRow(label, value) {
            return {
                type: 'box', layout: 'baseline', spacing: 'sm',
                contents: [
                    { type: 'text', text: label, color: '#aaaaaa', size: 'sm', flex: 2 },
                    { type: 'text', text: String(value || '-'), wrap: true, color: '#666666', size: 'sm', flex: 4 }
                ]
            };
        }
        const bubble = {
            type: 'bubble',
            body: {
                type: 'box', layout: 'vertical', spacing: 'md',
                contents: [
                    { type: 'text', text: '📹 ส่งคำขอดูกล้องแล้ว', weight: 'bold', size: 'lg' },
                    { type: 'text', text: '⏳ รอตรวจสอบ', size: 'sm', color: '#F59E0B', weight: 'bold' },
                    { type: 'separator', margin: 'lg' },
                    {
                        type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm',
                        contents: [
                            infoRow('บ้านเลขที่', payload.houseNumber),
                            infoRow('จุดที่ขอดู', payload.cameraZone),
                            infoRow('วันที่', payload.requestDate),
                            infoRow('ช่วงเวลา', payload.timeRange),
                        ]
                    },
                    { type: 'separator', margin: 'lg' },
                    { type: 'text', size: 'xs', color: '#999999', wrap: true, margin: 'lg', text: 'นิติบุคคลจะตรวจสอบและแนบลิงก์คลิปให้ทาง LINE นี้ค่ะ' }
                ]
            }
        };
        return { type: 'flex', altText: 'ส่งคำขอดูกล้องแล้ว - ' + payload.cameraZone, contents: bubble };
    }

    let _liffId = null;
    async function getLiffId() {
        if (_liffId !== null) return _liffId;
        const res = await supabaseClient.from('system_settings').select('value').eq('key', 'cctv_liff_id').maybeSingle();
        const cfg = res.data;
        _liffId = (cfg && cfg.value && cfg.value !== 'YOUR_CCTV_LIFF_ID_HERE') ? cfg.value : '';
        return _liffId;
    }

    const App = () => {
        const [activeTab, setActiveTab] = useState('submit');
        const [currentUid, setCurrentUid] = useState(null);
        const [currentProfile, setCurrentProfile] = useState(null);
        const [liffStatus, setLiffStatus] = useState('⏳ กำลังเชื่อมต่อ LINE...');
        const [isInClient, setIsInClient] = useState(false);

        const [house, setHouse] = useState('');
        const [phone, setPhone] = useState('');
        const [cameraZones, setCameraZones] = useState([]);
        const [zone, setZone] = useState('');
        const [reqDate, setReqDate] = useState('');
        const [timeRange, setTimeRange] = useState('');
        const [reason, setReason] = useState('');
        const [submitting, setSubmitting] = useState(false);
        const [toast, setToast] = useState(null);

        const [myRequests, setMyRequests] = useState([]);
        const [historyLoading, setHistoryLoading] = useState(false);

        useEffect(() => {
            (async () => {
                try {
                    const liffId = await getLiffId();
                    if (!liffId) { setLiffStatus('⚠️ ยังไม่ได้ตั้งค่า LIFF — กรอกข้อมูลได้ปกติแต่จะไม่เชื่อมกับ LINE'); return; }

                    await liff.init({ liffId: liffId });
                    if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }

                    const profile = await liff.getProfile();
                    setCurrentUid(profile.userId);
                    setCurrentProfile(profile);
                    setIsInClient(liff.isInClient());
                    setLiffStatus('✅ เชื่อมต่อ LINE: ' + (profile.displayName || ''));
                } catch (e) {
                    console.error('LIFF init error', e);
                    setLiffStatus('⚠️ เชื่อมต่อ LINE ไม่สำเร็จ — กรอกข้อมูลได้ปกติ');
                }
            })();
        }, []);

        // 📍 โหลดรายชื่อจุดกล้องจาก settings ฝั่ง Admin ตอนเปิดหน้า
        useEffect(() => {
            (async () => {
                const zones = await fetchCameraZones();
                setCameraZones(zones);
                if (zones.length) setZone(zones[0]);
            })();
        }, []);

        const loadHistory = async (uid) => {
            if (!uid) return;
            setHistoryLoading(true);
            try {
                const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/cctv_request_list_mine?uid=' + uid);
                const d = await res.json();
                if (!res.ok) throw new Error(d.error);
                setMyRequests(d.items || []);
            } catch (e) {
                console.error('loadHistory', e);
            } finally {
                setHistoryLoading(false);
            }
        };

        useEffect(() => { if (activeTab === 'history' && currentUid) loadHistory(currentUid); }, [activeTab, currentUid]);

        const showToast = (msg, type) => { setToast({ msg: msg, type: type || 'success' }); setTimeout(() => setToast(null), 2500); };

        const submitForm = async (e) => {
            e.preventDefault();
            if (!house.trim() || !reqDate || !reason.trim()) return showToast('กรอกบ้านเลขที่ วันที่ และเหตุผลให้ครบค่ะ', 'error');

            setSubmitting(true);
            try {
                const payload = {
                    uid: currentUid || null,
                    lineDisplayName: currentProfile ? currentProfile.displayName : null,
                    linePictureUrl: currentProfile ? currentProfile.pictureUrl : null,
                    houseNumber: house.trim(), phoneNumber: phone.trim() || null,
                    cameraZone: zone, requestDate: reqDate, timeRange: timeRange.trim() || null,
                    reason: reason.trim(),
                };

                const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/cctv_request_submit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const rawText = await res.text();
                let result;
                try { result = JSON.parse(rawText); }
                catch (_) {
                    throw new Error(res.status === 404
                        ? 'ระบบยังไม่พร้อมใช้งาน กรุณาแจ้งแอดมินให้ deploy ระบบล่าสุดก่อน'
                        : 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ' + res.status + ')');
                }
                if (!res.ok) throw new Error(result.error || 'ส่งข้อมูลไม่สำเร็จ');

                if (isInClient) {
                    try { await liff.sendMessages([buildCctvConfirmFlex(payload)]); }
                    catch (flexErr) { console.warn('sendMessages ไม่สำเร็จ (ไม่กระทบคำขอ):', flexErr); }
                }

                showToast('🎉 ส่งคำขอดูกล้องเรียบร้อยแล้ว');
                setHouse(''); setPhone(''); setReqDate(''); setTimeRange(''); setReason('');
                setActiveTab('history');
                if (currentUid) loadHistory(currentUid);
            } catch (err) {
                showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
                <header className="px-5 py-5 shadow-md flex items-center justify-between rounded-b-2xl mb-1 bg-gradient-to-r from-slate-700 to-slate-900">
                    <div className="flex items-center text-white">
                        <span className="text-3xl mr-3">📹</span>
                        <div>
                            <h1 className="text-lg font-extrabold tracking-wide">ขอดูกล้องวงจรปิด</h1>
                            <p className="text-xs text-white/80 font-medium mt-0.5">แจ้งจุด+วันเวลาที่ต้องการตรวจสอบ</p>
                        </div>
                    </div>
                </header>
                <p className="text-[11px] text-slate-400 text-center mb-3">{liffStatus}</p>

                <div className="flex gap-2 px-5 mb-4">
                    <button onClick={() => setActiveTab('submit')}
                        className={'flex-1 py-2.5 rounded-2xl font-bold text-sm transition-all ' + (activeTab === 'submit' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500')}>
                        📝 ส่งคำขอ
                    </button>
                    <button onClick={() => setActiveTab('history')}
                        className={'flex-1 py-2.5 rounded-2xl font-bold text-sm transition-all ' + (activeTab === 'history' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500')}>
                        📋 คำขอของฉัน
                    </button>
                </div>

                <div className="px-5 pb-8 flex-1">
                    {activeTab === 'submit' && (
                        <form onSubmit={submitForm} className="bg-white rounded-3xl shadow-lg p-6 border border-gray-100/50 space-y-5 animate-slide-up">
                            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-700">
                                📌 เพื่อความเป็นส่วนตัวของทุกคน นิติบุคคลจะพิจารณาคำขอตามความเหมาะสมของเหตุผลที่แจ้งมาค่ะ
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">บ้านเลขที่ *</label>
                                    <input value={house} onChange={e => setHouse(e.target.value)} required placeholder="เช่น 998/27"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-slate-500 outline-none text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">เบอร์โทร</label>
                                    <input value={phone} onChange={e => setPhone(e.target.value)} type="tel" placeholder="08x-xxx-xxxx"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-slate-500 outline-none text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">จุดที่ต้องการดู *</label>
                                <select value={zone} onChange={e => setZone(e.target.value)}
                                    className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-slate-500 outline-none text-sm font-medium">
                                    {cameraZones.map(z => <option key={z} value={z}>📍 {z}</option>)}
                                </select>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">วันที่ *</label>
                                    <input value={reqDate} onChange={e => setReqDate(e.target.value)} type="date" required
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-slate-500 outline-none text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">ช่วงเวลา</label>
                                    <input value={timeRange} onChange={e => setTimeRange(e.target.value)} placeholder="เช่น 14:00-15:00"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-slate-500 outline-none text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">เหตุผลที่ขอดู *</label>
                                <textarea value={reason} onChange={e => setReason(e.target.value)} required rows={3}
                                    placeholder="เช่น ของหายบริเวณนี้ ต้องการตรวจสอบเหตุการณ์..."
                                    className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-slate-500 outline-none text-sm resize-none" />
                            </div>

                            <button type="submit" disabled={submitting}
                                className="w-full py-3.5 bg-gradient-to-r from-slate-700 to-slate-900 text-white rounded-2xl font-bold shadow-lg disabled:opacity-50">
                                {submitting ? '⏳ กำลังส่งคำขอ...' : '📤 ส่งคำขอดูกล้อง'}
                            </button>
                        </form>
                    )}

                    {activeTab === 'history' && (
                        <div className="animate-slide-up space-y-3">
                            {!currentUid && (
                                <div className="text-center text-slate-400 text-sm py-10 bg-white rounded-3xl border border-slate-100/50">
                                    ต้องเชื่อมต่อ LINE ก่อนถึงจะดูคำขอได้
                                </div>
                            )}
                            {historyLoading && <div className="text-center py-10 text-slate-400">⏳ กำลังโหลด...</div>}
                            {!historyLoading && currentUid && myRequests.length === 0 && (
                                <div className="text-center text-slate-400 text-sm py-10 bg-white rounded-3xl border border-slate-100/50">
                                    ยังไม่เคยส่งคำขอผ่าน LINE นี้
                                </div>
                            )}
                            {myRequests.map(r => {
                                const st = STATUS_LABELS[r.status] || STATUS_LABELS.pending;
                                return (
                                    <div key={r.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-sm font-extrabold text-gray-800">{r.camera_zone}</span>
                                            <span className={'text-[10px] font-bold px-2 py-1 rounded-full bg-' + st.color + '-100 text-' + st.color + '-700'}>{st.icon} {st.label}</span>
                                        </div>
                                        <p className="text-xs text-gray-500 mb-2">📅 {r.request_date} {r.time_range ? '· ' + r.time_range : ''}</p>
                                        <p className="text-sm text-gray-600 bg-gray-50 rounded-xl p-3 mb-2">{r.reason}</p>
                                        {r.status === 'approved' && r.response_link && (
                                            <a href={r.response_link} target="_blank" rel="noreferrer"
                                                className="block text-center text-xs font-bold text-white bg-emerald-500 rounded-xl py-2.5 mb-2">
                                                🔗 เปิดดูคลิป
                                            </a>
                                        )}
                                        {r.admin_remark && (
                                            <div className="text-xs text-indigo-600 bg-indigo-50 rounded-xl p-2.5 mb-2">
                                                <b>หมายเหตุจากนิติบุคคล:</b> {r.admin_remark}
                                            </div>
                                        )}
                                        <p className="text-[11px] text-gray-400">🏠 {r.house_number} · ส่งเมื่อ {new Date(r.created_at).toLocaleDateString('th-TH')}</p>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>

                {toast && (
                    <div className={'fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl shadow-lg text-white text-sm font-bold z-50 ' + (toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500')}>
                        {toast.msg}
                    </div>
                )}
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
