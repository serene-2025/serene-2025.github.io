<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>การเงินส่วนกลาง · Golden Land Serene</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/2769/2769339.png">
    <script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/lazywasabi/thai-web-fonts@7/fonts/LINESeedSansTH/LINESeedSansTH.css" rel="stylesheet" />

    <style>
        /* ───────── Design tokens (สีชุดกราฟผ่านการตรวจ CVD แล้ว: ฟ้า=รายรับ · ส้ม=รายจ่าย · เขียวน้ำทะเล=เงินคงเหลือ) ───────── */
        :root {
            color-scheme: light;
            --bg: #f3f6f5;
            --surface: #fcfcfb;
            --surface-2: #f0efec;
            --ink: #0b0b0b;
            --ink-2: #52514e;
            --ink-3: #85847f;
            --line: #e7e5e0;
            --brand: #0f8f7e;
            --brand-2: #14b58f;
            --income: #2a78d6;
            --income-2: #9ec5f4;      /* รายรับอื่น (โทนอ่อนของสีรายรับ) */
            --expense: #eb6834;
            --expense-2: #f6b79f;     /* รายจ่ายไม่ประจำ (โทนอ่อนของสีรายจ่าย) */
            --balance: #1baf7a;
            --prior: #a5a49e;
            --good: #0ca30c;
            --warn: #fab219;
            --crit: #d03b3b;
            --shadow: 0 1px 2px rgba(11, 11, 11, .04), 0 6px 20px rgba(11, 11, 11, .05);
        }
        @media (prefers-color-scheme: dark) {
            :root:where(:not([data-theme="light"])) {
                color-scheme: dark;
                --bg: #111413;
                --surface: #1a1a19;
                --surface-2: #272726;
                --ink: #ffffff;
                --ink-2: #c3c2b7;
                --ink-3: #8f8e86;
                --line: #2f2f2d;
                --brand: #0f8f7e;
                --brand-2: #14b58f;
                --income: #3987e5;
                --income-2: #1c5cab;
                --expense: #d95926;
                --expense-2: #8a3a1c;
                --balance: #199e70;
                --prior: #6f6e68;
                --shadow: 0 1px 2px rgba(0, 0, 0, .3);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #111413; --surface: #1a1a19; --surface-2: #272726; --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #8f8e86; --line: #2f2f2d;
            --income: #3987e5; --income-2: #1c5cab; --expense: #d95926; --expense-2: #8a3a1c; --balance: #199e70; --prior: #6f6e68;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'LINE Seed Sans TH', 'Prompt', system-ui, sans-serif;
            font-size: 14px; line-height: 1.45;
        }
        [v-cloak] { display: none !important; }
        button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
        button:focus-visible, [tabindex]:focus-visible, summary:focus-visible { outline: 2px solid var(--income); outline-offset: 2px; border-radius: 8px; }
        .num { font-variant-numeric: tabular-nums; }

        .wrap { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }

        /* ───────── Header ───────── */
        .top {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            color: #fff; padding: 18px 16px 52px; position: relative;
        }
        .top .row { display: flex; align-items: center; gap: 12px; }
        .logo { width: 40px; height: 40px; border-radius: 14px; background: rgba(255, 255, 255, .2); display: grid; place-items: center; flex: none; }
        .top h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .2px; }
        .top p { margin: 1px 0 0; font-size: 12px; opacity: .9; }
        .icon-btn { margin-left: auto; width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, .18); display: grid; place-items: center; flex: none; }
        .icon-btn svg { width: 18px; height: 18px; }
        .spin { animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ───────── Filters (แถวเดียว อยู่เหนือเนื้อหา) ───────── */
        .filters {
            position: sticky; top: 0; z-index: 20; margin-top: -34px; padding: 0 12px;
        }
        .filters-in {
            background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 10px 8px;
            border: 1px solid var(--line);
        }
        .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .years { display: flex; gap: 6px; }
        .pill {
            padding: 6px 13px; border-radius: 999px; font-weight: 700; font-size: 13px; background: var(--surface-2); color: var(--ink-2);
            transition: background .15s, color .15s; white-space: nowrap;
        }
        .pill.on { background: var(--ink); color: var(--surface); }
        .switch { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
        .switch i { width: 34px; height: 20px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .2s; flex: none; }
        .switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-3); transition: transform .2s, background .2s; }
        .switch.on i { background: var(--income); border-color: var(--income); }
        .switch.on i::after { transform: translateX(14px); background: #fff; }
        .months { display: flex; gap: 6px; overflow-x: auto; margin: 9px -10px 0; padding: 2px 10px 4px; scroll-snap-type: x proximity; scrollbar-width: none; }
        .months::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; scroll-snap-align: center; position: relative; padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 700;
            color: var(--ink-2); background: transparent; border: 1px solid var(--line);
        }
        .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
        .chip.dim { opacity: .45; }
        .chip .dot { position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--brand); }
        .chip.on .dot { background: #fff; }

        /* ───────── Cards ───────── */
        main { padding: 14px 12px 0; display: flex; flex-direction: column; gap: 12px; transition: opacity .2s; }
        main.dim { opacity: .55; pointer-events: none; }
        .card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
        .card h2 { margin: 0; font-size: 15px; font-weight: 800; }
        .card .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
        .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }

        /* Hero */
        .hero { padding: 18px 16px 16px; }
        .hero .label { font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .hero .value { font-size: 48px; line-height: 1.1; font-weight: 800; letter-spacing: -.5px; margin: 6px 0 2px; display: flex; align-items: baseline; gap: 4px; word-break: break-all; }
        .hero .value small { font-size: 20px; font-weight: 700; color: var(--ink-2); letter-spacing: 0; }
        .hero .value.long { font-size: 38px; }
        .hero .note { font-size: 13px; color: var(--ink-2); }
        .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
        .tag.crit { background: color-mix(in srgb, var(--crit) 14%, var(--surface)); color: var(--crit); }
        .tag.good { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: #0a7a0a; }
        @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .tag.good { color: #4fd24f; } }

        .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .tile { background: var(--surface-2); border-radius: 16px; padding: 12px; min-width: 0; }
        .tile .k { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
        .key { width: 14px; height: 4px; border-radius: 2px; flex: none; }
        .key.sq { width: 10px; height: 10px; border-radius: 3px; }
        .tile .v { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -.2px; overflow-wrap: anywhere; }
        .delta { margin-top: 5px; font-size: 11px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
        .delta b { font-weight: 800; }
        .delta .up { color: var(--good); } .delta .down { color: var(--crit); }

        /* Meter */
        .meter { margin-top: 14px; }
        .meter .t { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
        .track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
        .fill { height: 100%; border-radius: 5px; transition: width .4s cubic-bezier(.2, .8, .2, 1); }

        /* Split bars */
        .split { display: flex; gap: 2px; height: 14px; margin: 10px 0 8px; }
        .split > div { min-width: 4px; transition: flex-grow .4s; }
        .split > div:first-child { border-radius: 7px 3px 3px 7px; }
        .split > div:last-child { border-radius: 3px 7px 7px 3px; }
        .split > div:only-child { border-radius: 7px; }
        .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
        .legend-row .grow { flex: 1; min-width: 0; color: var(--ink-2); }
        .legend-row b { font-weight: 800; }
        .legend-row .pc { width: 38px; text-align: right; color: var(--ink-3); font-size: 12px; }
        .sec-title { font-size: 12px; font-weight: 800; color: var(--ink-2); margin-top: 14px; }
        .sec-title:first-of-type { margin-top: 0; }
        hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0 0; }

        /* Tabs (segmented) */
        .seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; flex: none; }
        .seg button { padding: 5px 11px; border-radius: 9px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
        .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

        /* Chart */
        .readout { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
        .readout .m { font-size: 12px; font-weight: 800; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .readout .m button { font-size: 11px; font-weight: 700; color: var(--income); }
        .readout .g { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
        .readout .g.two { grid-template-columns: repeat(2, 1fr); }
        .readout .g div { min-width: 0; }
        .readout .g span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-3); font-weight: 700; }
        .readout .g strong { display: block; font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
        .chartbox { width: 100%; position: relative; touch-action: pan-y; }
        .chartbox svg { display: block; overflow: visible; }
        .chartbox text { font-family: inherit; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .hint { font-size: 11px; color: var(--ink-3); margin-top: 6px; }

        /* Categories */
        .cat { padding: 9px 0; border-top: 1px solid var(--line); }
        .head + .cat { border-top: 0; padding-top: 0; }
        .cat .r { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
        .cat .n { font-weight: 700; font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
        .cat .a { font-weight: 800; flex: none; }
        .cat .m { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .cat .bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
        .cat .bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; transition: width .4s; }
        .cat .p { width: 40px; text-align: right; font-size: 12px; color: var(--ink-3); flex: none; }
        .badge { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 10px; font-weight: 800; vertical-align: 1px; background: var(--surface-2); color: var(--ink-2); }
        .more { display: block; width: 100%; margin-top: 8px; padding: 10px; border-radius: 12px; background: var(--surface-2); font-size: 13px; font-weight: 700; color: var(--ink-2); text-align: center; }

        /* Transactions */
        .search { position: relative; margin: 0 0 10px; }
        .search input { width: 100%; padding: 10px 12px 10px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 14px; outline: none; }
        .search input:focus { border-color: var(--income); }
        .search svg { position: absolute; left: 11px; top: 50%; margin-top: -8px; width: 16px; height: 16px; color: var(--ink-3); }
        .grp { display: flex; justify-content: space-between; align-items: center; padding: 8px 0 6px; margin-top: 6px; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 800; color: var(--ink-2); }
        .grp span { font-weight: 600; color: var(--ink-3); }
        .tx { display: block; width: 100%; text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); }
        .tx .r { display: flex; align-items: center; gap: 11px; }
        .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; }
        .ic svg { width: 16px; height: 16px; }
        .ic.in { background: color-mix(in srgb, var(--income) 15%, var(--surface)); color: var(--income); }
        .ic.out { background: color-mix(in srgb, var(--expense) 15%, var(--surface)); color: var(--expense); }
        .tx .mid { flex: 1; min-width: 0; }
        .tx .c { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tx .d { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tx .amt { font-weight: 800; flex: none; font-size: 14.5px; }
        .detail { margin: 10px 0 2px 47px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; color: var(--ink-2); display: grid; gap: 6px; }
        .detail a { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; color: var(--income); text-decoration: none; }
        .empty { text-align: center; color: var(--ink-3); padding: 28px 8px; font-size: 14px; }
        .empty big { display: block; font-size: 32px; margin-bottom: 4px; }

        /* Table */
        details.tbl summary { list-style: none; cursor: pointer; font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        details.tbl summary::-webkit-details-marker { display: none; }
        details.tbl summary::after { content: "▾"; color: var(--ink-3); transition: transform .2s; }
        details.tbl[open] summary::after { transform: rotate(180deg); }
        .tscroll { overflow-x: auto; margin: 10px -4px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 300px; }
        th, td { padding: 8px 6px; text-align: right; border-bottom: 1px solid var(--line); }
        th:first-child, td:first-child { text-align: left; }
        th { font-size: 11px; color: var(--ink-3); font-weight: 800; }
        tfoot td { font-weight: 800; border-bottom: 0; }
        tr.cur td { background: var(--surface-2); }

        .err { border-color: color-mix(in srgb, var(--crit) 40%, var(--line)); text-align: center; }
        .err button { margin-top: 10px; padding: 9px 18px; border-radius: 12px; background: var(--ink); color: var(--surface); font-weight: 800; }

        /* Skeleton */
        .sk { position: relative; overflow: hidden; background: var(--surface-2); border-radius: 12px; }
        .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .35), transparent); animation: sh 1.2s infinite; }
        @keyframes sh { to { transform: translateX(100%); } }

        .foot { text-align: center; font-size: 11px; color: var(--ink-3); padding: 18px 20px 0; line-height: 1.7; }
        .foot b { color: var(--ink-2); }
        .rise { animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>

<body>
    <div id="app" v-cloak class="wrap">

        <!-- ═════════ Header ═════════ -->
        <header class="top">
            <div class="row">
                <div class="logo" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9"/><path d="M9 19v-5h6v5"/></svg>
                </div>
                <div>
                    <h1>การเงินส่วนกลาง</h1>
                    <p>Golden Land Serene · เปิดเผยแก่ลูกบ้าน</p>
                </div>
                <button class="icon-btn" @click="reload" aria-label="รีเฟรชข้อมูล" :disabled="loading">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" :class="{spin: loading}"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
                </button>
            </div>
        </header>

        <!-- ═════════ Filters ═════════ -->
        <nav class="filters" aria-label="เลือกช่วงเวลา">
            <div class="filters-in">
                <div class="row-between">
                    <div class="years" role="group" aria-label="ปี พ.ศ.">
                        <button v-for="y in availableYears" :key="y" class="pill" :class="{on: year === y}" @click="selectYear(y)">{{ y }}</button>
                    </div>
                    <button class="switch" :class="{on: compare}" @click="toggleCompare" role="switch" :aria-checked="compare">
                        เทียบปีก่อน <i></i>
                    </button>
                </div>
                <div class="months" ref="chipRow" role="group" aria-label="เดือน">
                    <button class="chip" :class="{on: month === ''}" @click="selectMonth('')">ทั้งปี</button>
                    <button v-for="(m, i) in months" :key="m.m" class="chip" :class="{on: month === m.m, dim: !m.has}" @click="selectMonth(m.m)" :aria-label="'เดือน' + monthFull[i]">
                        {{ m.label }}<span v-if="m.has" class="dot"></span>
                    </button>
                </div>
            </div>
        </nav>

        <main :class="{dim: loading && ready}">

            <!-- Error -->
            <div v-if="error" class="card err" role="alert">
                <div style="font-size:28px">⚠️</div>
                <div style="font-weight:800;margin-top:4px">โหลดข้อมูลไม่สำเร็จ</div>
                <div class="sub">{{ error }}</div>
                <button @click="reload">ลองอีกครั้ง</button>
            </div>

            <!-- Skeleton (โหลดครั้งแรก) -->
            <template v-if="!ready && !error">
                <div class="card"><div class="sk" style="height:18px;width:40%"></div><div class="sk" style="height:52px;width:75%;margin-top:14px"></div>
                    <div class="tiles"><div class="sk" style="height:84px"></div><div class="sk" style="height:84px"></div></div></div>
                <div class="card"><div class="sk" style="height:200px"></div></div>
                <div class="card"><div class="sk" style="height:160px"></div></div>
            </template>

            <template v-if="ready">

                <!-- ═════════ ภาพรวม ═════════ -->
                <section class="card hero rise" aria-labelledby="h-hero">
                    <div class="label" id="h-hero">
                        เงินคงเหลือ · {{ periodLabel }}
                        <span v-if="totals.balance < 0" class="tag crit">▼ ติดลบ</span>
                        <span v-else-if="totals.income > 0 || totals.expense > 0" class="tag good">▲ เกินดุล</span>
                    </div>
                    <div class="value num" :class="{long: heroText.length > 9}"><small>฿</small>{{ heroText }}</div>
                    <div class="note">{{ summarySentence }}</div>

                    <div class="tiles">
                        <div class="tile">
                            <div class="k"><span class="key" style="background:var(--income)"></span>รายรับ</div>
                            <div class="v num">{{ fmt(totals.income) }}</div>
                            <div v-if="deltaIncome" class="delta">
                                <b :class="deltaIncome.pct >= 0 ? 'up' : 'down'">{{ deltaIncome.pct >= 0 ? '▲' : '▼' }} {{ Math.abs(deltaIncome.pct) }}%</b>
                                <span>จาก {{ deltaIncome.label }}</span>
                            </div>
                        </div>
                        <div class="tile">
                            <div class="k"><span class="key" style="background:var(--expense)"></span>รายจ่าย</div>
                            <div class="v num">{{ fmt(totals.expense) }}</div>
                            <div v-if="deltaExpense" class="delta">
                                <b :class="deltaExpense.pct <= 0 ? 'up' : 'down'">{{ deltaExpense.pct >= 0 ? '▲' : '▼' }} {{ Math.abs(deltaExpense.pct) }}%</b>
                                <span>จาก {{ deltaExpense.label }}</span>
                            </div>
                        </div>
                    </div>

                                    </tr>

                                <tfoot><tr><td>รวมปี</td><td class="num">{{ fmt(yearTotals.income) }}</td><td class="num">{{ fmt(yearTotals.expense) }}</td><td class="num">{{ signed(yearTotals.balance) }}</td></tr></tfoot>
                            </table>

                <p class="foot">
                    <b>ที่มาของตัวเลข</b><br>
                    รายรับค่าส่วนกลาง = จำนวนบ้านที่ชำระแล้ว (รวมชำระล่วงหน้า) × อัตราค่าส่วนกลาง<br>
                    รายรับอื่นและรายจ่ายมาจากบัญชีที่นิติบุคคลบันทึก<br>
                    Golden Land Serene · นิติบุคคลหมู่บ้านจัดสรร
                </p>
            </template>
        </main>
    </div>

    <script>
        const EDGE_FUNCTION_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co/functions/v1/line-webhook';
        const MONTH_KEYS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
        const MONTH_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const MONTH_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : 0; };

        const { createApp } = Vue;
        createApp({
            data() {
                const curYearTH = new Date().getFullYear() + 543;
                return {
                    year: curYearTH,
                    availableYears: [curYearTH, curYearTH - 1, curYearTH - 2],
                    month: '',
                    compare: false,
                    loading: false,
                    error: '',
                    data: null,
                    cache: {},
                    reqId: 0,
                    monthFull: MONTH_FULL,
                    chartMode: 'bars',
                    focusIdx: null,
                    W: 340, H: 210, padL: 46, padR: 6, padT: 10, padB: 26,
                    catAll: false,
                    txType: 'all', txQuery: '', txLimit: 20, expanded: '',
                };
            },
            computed: {
                ready() { return !!this.data; },
                prevOk() { return !!(this.data && this.data.comparison && Array.isArray(this.data.comparison.prevMonthlyTrend)); },
                slotW() { return (this.W - this.padL - this.padR) / 12; },
                bw() { return Math.max(4, Math.min(11, this.slotW * 0.34)); },

                /* 12 เดือน — คำนวณฝั่งเครื่อง จาก monthlyTrend + รายการรับ/จ่าย (เปลี่ยนเดือนได้ทันที ไม่ต้องเรียก API ซ้ำ) */
                months() {
                    const d = this.data || {};
                    const trend = d.monthlyTrend || [];
                    const other = {};
                    (d.otherIncomeList || []).forEach(o => { other[o.month_col] = (other[o.month_col] || 0) + num(o.amount); });
                    const prev = (d.comparison && d.comparison.prevMonthlyTrend) || [];
                    let cum = 0;
                    return MONTH_KEYS.map((k, i) => {
                        const t = trend.find(x => x.month === k) || {};
                        const income = num(t.income), expense = num(t.expense), oth = other[k] || 0;
                        cum += income - expense;
                        return {
                            m: k, label: MONTH_SHORT[i], income, expense, other: Math.min(oth, income), fee: Math.max(0, income - oth),
                            recurring: num(t.recurring), oneTime: num(t.oneTime), balance: income - expense, cum,
                            has: income > 0 || expense > 0,
                            prevIncome: num(prev[i] && prev[i].income), prevExpense: num(prev[i] && prev[i].expense),
                        };
                    });
                },
                lastActive() { let l = -1; this.months.forEach((m, i) => { if (m.has) l = i; }); return l; },
                selIdx() { return this.month ? MONTH_KEYS.indexOf(this.month) : -1; },
                totals() {
                    const src = this.selIdx >= 0 ? [this.months[this.selIdx]] : this.months;
                    const t = { income: 0, fee: 0, other: 0, expense: 0, recurring: 0, oneTime: 0 };
                    src.forEach(m => { t.income += m.income; t.fee += m.fee; t.other += m.other; t.expense += m.expense; t.recurring += m.recurring; t.oneTime += m.oneTime; });
                    t.balance = t.income - t.expense;
                    // รายจ่ายที่ไม่ระบุประเภท → นับเป็นไม่ประจำ เพื่อให้ยอดแยกประเภทรวมเท่ากับยอดรวมเสมอ
                    const rest = t.expense - t.recurring - t.oneTime;
                    if (rest > 0.5) t.oneTime += rest;
                    return t;
                },
                yearTotals() {
                    const t = { income: 0, expense: 0 };
                    this.months.forEach(m => { t.income += m.income; t.expense += m.expense; });
                    t.balance = t.income - t.expense;
                    return t;
                },
                periodLabel() { return this.selIdx >= 0 ? MONTH_FULL[this.selIdx] + ' ' + this.year : 'ทั้งปี ' + this.year; },
                heroText() { return (this.totals.balance < 0 ? '−' : '') + this.fmt(Math.abs(this.totals.balance)); },
                topCat() { return this.cats[0] || null; },
                summarySentence() {
                    const t = this.totals;
                    if (!t.income && !t.expense) return 'ยังไม่มีรายการในช่วงนี้';
                    let s = 'รับ ' + this.fmt(t.income) + ' บาท · จ่าย ' + this.fmt(t.expense) + ' บาท';
                    if (this.topCat && t.expense > 0) s += ' · จ่ายมากสุดหมวด “' + this.topCat.category + '” ' + this.topCat.pct + '% ของรายจ่าย';
                    return s;
                },
                meter() {
                    const { income, expense } = this.totals;
                    if (income <= 0) return { pct: expense > 0 ? 100 : 0, pctText: '', text: expense > 0 ? 'มีรายจ่าย แต่ยังไม่มีรายรับในช่วงนี้' : '', color: 'var(--crit)' };
                    const pct = Math.round((expense / income) * 100);
                    let color = 'var(--balance)', text = 'ใช้ไปแล้ว ' + pct + '% ของรายรับ';
                    if (pct > 100) { color = 'var(--crit)'; text = '⚠️ จ่ายเกินรายรับ'; }
                    else if (pct >= 85) { color = 'var(--warn)'; text = '⚠️ ใกล้เต็มรายรับ'; }
                    return { pct, pctText: pct + '%', text, color };
                },
                prevPeriod() {
                    if (!this.compare || !this.prevOk) return null;
                    const src = this.selIdx >= 0 ? [this.months[this.selIdx]] : this.months;
                    return { income: src.reduce((s, m) => s + m.prevIncome, 0), expense: src.reduce((s, m) => s + m.prevExpense, 0) };
                },
                deltaIncome() { return this.delta(this.totals.income, this.prevPeriod && this.prevPeriod.income); },
                deltaExpense() { return this.delta(this.totals.expense, this.prevPeriod && this.prevPeriod.expense); },

                /* รายจ่ายแยกหมวด */
                cats() {
                    const list = (this.data && this.data.expenses) || [];
                    const map = {};
                    list.forEach(e => {
                        if (this.month && e.month_col !== this.month) return;
                        const type = e.expense_type === 'recurring' ? 'recurring' : 'one_time';
                        const key = (e.category || 'อื่นๆ') + '|' + type;
                        if (!map[key]) map[key] = { key, category: e.category || 'อื่นๆ', type, amount: 0 };
                        map[key].amount += num(e.amount);
                    });
                    const arr = Object.values(map).sort((a, b) => b.amount - a.amount);
                    const total = arr.reduce((s, c) => s + c.amount, 0) || 1, max = (arr[0] && arr[0].amount) || 1;
                    return arr.map(c => ({ ...c, pct: Math.round((c.amount / total) * 100), rel: Math.max(2, Math.round((c.amount / max) * 100)) }));
                },
                catsShown() { return this.catAll ? this.cats : this.cats.slice(0, 6); },

                /* รายการ */
                allTx() {
                    const d = this.data || {};
                    const mk = (r, type) => {
                        const date = String((type === 'income' ? r.income_date : r.expense_date) || '').slice(0, 10);
                        const [y, mo, da] = date.split('-').map(Number);
                        const mi = (mo || 1) - 1;
                        const url = String(r.receipt_url || '');
                        return {
                            ...r, uid: type + ':' + r.id, type, amount: num(r.amount), date, mi,
                            month_col: r.month_col || MONTH_KEYS[mi],
                            dateShort: da ? da + ' ' + MONTH_SHORT[mi] : '',
                            dateLong: da ? da + ' ' + MONTH_FULL[mi] + ' ' + ((y || 0) + 543) : '',
                            receipt: /^https?:\/\//i.test(url) ? url : '',
                        };
                    };
                    return [...(d.otherIncomeList || []).map(r => mk(r, 'income')), ...(d.expenses || []).map(r => mk(r, 'expense'))]
                        .sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0));
                },
                txFiltered() {
                    const q = this.txQuery.toLowerCase();
                    return this.allTx.filter(t => (!this.month || t.month_col === this.month) && (this.txType === 'all' || t.type === this.txType) &&
                        (!q || (t.category || '').toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q)));
                },
                txGroups() {
                    const groups = [], idx = {};
                    this.txFiltered.slice(0, this.txLimit).forEach(t => {
                        if (!(t.month_col in idx)) { idx[t.month_col] = groups.length; groups.push({ m: t.month_col, title: MONTH_FULL[MONTH_KEYS.indexOf(t.month_col)] + ' ' + this.year, items: [], income: 0, expense: 0 }); }
                        const g = groups[idx[t.month_col]];
                        g.items.push(t);
                    });
                    // ยอดรวมต่อเดือนนับจากรายการทั้งหมดที่ผ่านตัวกรอง (ไม่ใช่เฉพาะที่แสดง)
                    groups.forEach(g => this.txFiltered.forEach(t => { if (t.month_col === g.m) { if (t.type === 'income') g.income += t.amount; else g.expense += t.amount; } }));
                    return groups;
                },

                /* กราฟ */
                focus() { return this.focusIdx === null ? null : this.months[this.focusIdx]; },
                chartAria() {
                    return (this.chartMode === 'bars' ? 'กราฟแท่งรายรับและรายจ่ายรายเดือน ปี ' : 'กราฟเส้นเงินคงเหลือสะสม ปี ') + this.year +
                        ' · รวมรับ ' + this.fmt(this.yearTotals.income) + ' จ่าย ' + this.fmt(this.yearTotals.expense) + ' บาท (ดูตัวเลขครบในตารางด้านล่าง)';
                },
                barScale() {
                    let max = 0;
                    this.months.forEach(m => { max = Math.max(max, m.income, m.expense, this.compare && this.prevOk ? m.prevExpense : 0); });
                    return this.makeScale(0, max);
                },
                cumScale() {
                    let lo = 0, hi = 0;
                    this.months.forEach((m, i) => { if (i <= this.lastActive) { lo = Math.min(lo, m.cum); hi = Math.max(hi, m.cum); } });
                    if (this.compare && this.prevOk) { let c = 0; this.months.forEach(m => { c += m.prevIncome - m.prevExpense; lo = Math.min(lo, c); hi = Math.max(hi, c); }); }
                    return this.makeScale(lo, hi);
                },
                prevDots() { return this.months.map((m, i) => ({ x: this.slotX(i) + this.slotW / 2, y: this.barScale.y(m.prevExpense) })).filter((p, i) => this.months[i].prevExpense > 0); },
                prevLinePts() { return this.months.map((m, i) => (this.slotX(i) + this.slotW / 2) + ',' + this.barScale.y(m.prevExpense)).join(' '); },
                cumPts() {
                    if (this.lastActive < 0) return '';
                    return this.months.slice(0, this.lastActive + 1).map((m, i) => (this.slotX(i) + this.slotW / 2) + ',' + this.cumScale.y(m.cum)).join(' ');
                },
                cumArea() {
                    if (this.lastActive < 0) return '';
                    const z = this.cumScale.y(0), pts = this.months.slice(0, this.lastActive + 1).map((m, i) => [this.slotX(i) + this.slotW / 2, this.cumScale.y(m.cum)]);
                    return 'M' + pts[0][0] + ',' + z + ' ' + pts.map(p => 'L' + p[0] + ',' + p[1]).join(' ') + ' L' + pts[pts.length - 1][0] + ',' + z + ' Z';
                },
                cumPrevPts() {
                    let c = 0;
                    return this.months.map((m, i) => { c += m.prevIncome - m.prevExpense; return (this.slotX(i) + this.slotW / 2) + ',' + this.cumScale.y(c); }).join(' ');
                },
                cumEnd() {
                    if (this.lastActive < 0) return null;
                    const m = this.months[this.lastActive], x = this.slotX(this.lastActive) + this.slotW / 2, y = this.cumScale.y(m.cum);
                    const nearRight = x > this.W - 70;
                    return { v: m.cum, tx: nearRight ? x - 8 : x + 8, ty: y - 9 < this.padT + 8 ? y + 16 : y - 9, anchor: nearRight ? 'end' : 'start' };
                },
            },
            watch: {
                month() { this.txLimit = 20; this.expanded = ''; this.catAll = false; this.setDefaultFocus(); this.$nextTick(this.centerChip); },
                txType() { this.txLimit = 20; },
                txQuery() { this.txLimit = 20; },
                data() { this.setDefaultFocus(); this.$nextTick(this.measure); },
                chartMode() { this.$nextTick(this.measure); },
            },
            mounted() {
                this.load();
                window.addEventListener('resize', this.measure);
                if (window.ResizeObserver && this.$refs.chartBox) { /* chartBox สร้างหลังโหลดข้อมูล — วัดใน watcher data แทน */ }
            },
            methods: {
                fmt(n, dec) {
                    const v = num(n);
                    const d = dec && Math.abs(v % 1) > 0.004 ? 2 : 0;
                    return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
                },
                signed(n) { const v = Math.round(num(n)); return (v > 0 ? '+' : v < 0 ? '−' : '') + this.fmt(Math.abs(v)); },
                pctOf(a, b) { return b > 0 ? Math.round((a / b) * 100) : 0; },
                delta(cur, prev) {
                    if (!this.prevPeriod || !(prev > 0)) return null;
                    return { pct: Math.round(((cur - prev) / prev) * 100), label: (this.selIdx >= 0 ? MONTH_SHORT[this.selIdx] + ' ' : '') + 'ปี ' + (this.year - 1) };
                },
                fmtAxis(v) {
                    const a = Math.abs(v), s = v < 0 ? '−' : '';
                    const t = (x, u) => s + (+x.toFixed(1)) + ' ' + u;
                    if (a >= 1e6) return t(a / 1e6, 'ล้าน');
                    if (a >= 1e5) return t(a / 1e5, 'แสน');
                    if (a >= 1e4) return t(a / 1e4, 'หมื่น');
                    if (a >= 1e3) return t(a / 1e3, 'พัน');
                    return s + a;
                },
                slotX(i) { return this.padL + i * this.slotW; },
                makeScale(min, max) {
                    const span = (max - min) || 1, raw = span / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
                    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
                    const lo = Math.floor(min / step + 1e-9) * step, hi = Math.max(Math.ceil(max / step - 1e-9) * step, lo + step);
                    const ticks = []; for (let t = lo; t <= hi + step / 2; t += step) ticks.push(+t.toFixed(6));
                    const top = this.padT, bottom = this.H - this.padB;
                    return { ticks, y: (v) => +(bottom - ((v - lo) / (hi - lo)) * (bottom - top)).toFixed(2) };
                },
                barPath(x, y, w, h) {
                    h = Math.max(h, 2); const r = Math.min(4, w / 2, h);
                    return 'M' + x + ',' + (y + h) + ' V' + (y + r) + ' Q' + x + ',' + y + ' ' + (x + r) + ',' + y + ' H' + (x + w - r) + ' Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + ' V' + (y + h) + ' Z';
                },
                measure() {
                    const el = this.$refs.chartBox;
                    if (el && el.clientWidth) this.W = Math.max(280, Math.floor(el.clientWidth));
                },
                setDefaultFocus() { this.focusIdx = this.selIdx >= 0 ? this.selIdx : (this.lastActive >= 0 ? this.lastActive : null); },
                centerChip() {
                    const row = this.$refs.chipRow; if (!row) return;
                    const on = row.querySelector('.chip.on'); if (!on) return;
                    row.scrollTo({ left: on.offsetLeft - row.clientWidth / 2 + on.clientWidth / 2, behavior: 'smooth' });
                },
                selectYear(y) { if (y === this.year) return; this.year = y; this.month = ''; this.load(); },
                selectMonth(m) { this.month = m; },
                toggleCompare() { this.compare = !this.compare; this.load(); },
                reload() { this.load(true); },
                async load(force) {
                    const key = this.year + '|' + (this.compare ? 1 : 0);
                    if (!force && this.cache[key]) { this.data = this.cache[key]; return; }
                    const id = ++this.reqId;
                    this.loading = true; this.error = '';
                    try {
                        // ดึงทั้งปีครั้งเดียว แล้วกรองรายเดือนฝั่งเครื่อง (ลดจำนวน request)
                        const params = new URLSearchParams({ year: this.year });
                        if (this.compare) params.set('compare', 'true');
                        const res = await fetch(`${EDGE_FUNCTION_URL}/api/admin/audience/village_finance_summary?${params}`);
                        const d = await res.json().catch(() => ({}));
                        if (!res.ok) throw new Error(d.error || 'เซิร์ฟเวอร์ตอบกลับผิดพลาด (' + res.status + ')');
                        if (id !== this.reqId) return;
                        this.cache[key] = d;
                        if (this.compare) this.cache[this.year + '|0'] = d;
                        this.data = d;
                    } catch (e) {
                        if (id !== this.reqId) return;
                        console.error('finance load', e);
                        this.error = (e && e.message) || 'เชื่อมต่อไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต';
                    } finally {
                        if (id === this.reqId) this.loading = false;
                    }
                },
            }
        }).mount('#app');
    </script>
</body>
</html>
