<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>แอดมินแพลตฟอร์ม</title>
<style>
:root{
  --bg:#f4f6fa;--card:#fff;--ink:#1c2433;--mute:#6b7689;--line:#e1e6ee;--brand:#2f6df6;--brand-ink:#fff;
  --ok:#14804a;--ok-bg:#e3f5ea;--warn:#8a5a00;--warn-bg:#fff3d6;--bad:#b3261e;--bad-bg:#fde7e5;--idle:#55607a;--idle-bg:#e9edf5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420;--card:#171e2e;--ink:#e6eaf3;--mute:#93a0b8;--line:#28324a;--brand:#5b8cff;--brand-ink:#0b1020;
  --ok:#5fd592;--ok-bg:#12301f;--warn:#f1c25a;--warn-bg:#35290d;--bad:#ff8a80;--bad-bg:#3a1613;--idle:#aab4cc;--idle-bg:#222b40;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI","Noto Sans Thai","Sarabun",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
header.top h1{font-size:18px;margin:0;flex:1;min-width:160px}
.who{font-size:13px;color:var(--mute)}
.role{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--idle-bg);color:var(--idle);font-size:12px;margin-left:4px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--mute);cursor:pointer;font:inherit;white-space:nowrap}
nav.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
button.btn,a.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button.btn:hover{border-color:var(--brand)}
button.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.btn.dan{color:var(--bad);border-color:var(--bad)}
button.btn.sm{padding:3px 9px;font-size:13px}
button.btn[disabled]{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:90px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--mute)}
label.f>span{display:block;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--mute);font-weight:500;font-size:13px}
.scroll{overflow-x:auto}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px}
.b-active{background:var(--ok-bg);color:var(--ok)}.b-pending{background:var(--warn-bg);color:var(--warn)}.b-suspended{background:var(--bad-bg);color:var(--bad)}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-idle{background:var(--idle-bg);color:var(--idle)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
.mute{color:var(--mute)}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.msg.err{background:var(--bad-bg);color:var(--bad)}.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.msg ul{margin:4px 0 0 18px;padding:0}
.center{max-width:420px;margin:8vh auto 0}
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;padding:18px;border:1px solid var(--line)}
.modal h3{margin:0 0 12px}
.qr{display:block;margin:8px auto;width:180px;height:180px;background:#fff;padding:6px;border-radius:8px}
details summary{cursor:pointer;color:var(--brand);margin:6px 0 10px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0;font-size:14px;color:var(--ink)}
.chk input{width:auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;font-size:14px}
@media (max-width:640px){.kv{grid-template-columns:1fr}}
.feat-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0 4px}
.feat-grid .chk{align-items:flex-start}.feat-grid .chk small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
.feat-grid.off{opacity:.55}
@media (max-width:640px){.feat-grid{grid-template-columns:1fr}}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sumbar .badge{font-size:13px;padding:3px 11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 14px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat b{display:block;font-size:20px}.stat span{font-size:12.5px;color:var(--mute)}
.stat.bad b{color:var(--bad)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
@media (max-width:640px){.qgrid{grid-template-columns:1fr}}
.sec{border-top:1px solid var(--line);margin:12px 0 8px;padding-top:10px}
.sec h4{margin:0 0 6px;font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center card"><p class="mute">กำลังโหลด…</p></div></div>
<div id="modal-root"></div>

<script src="platform-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function () {
  'use strict';
  var CFG = window.PLATFORM_CONFIG || {};
  var SLUG_RE = /^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$/;
  var STATUS_TH = { active: 'ใช้งานอยู่', pending: 'รอเปิดใช้งาน', suspended: 'ระงับ' };
  var RANK = { viewer: 1, operator: 2, owner: 3 };
  var ROLE_TH = { owner: 'เจ้าของ', operator: 'ผู้ดูแล', viewer: 'ดูอย่างเดียว' };
  var TABS = [
    ['tenants', 'หมู่บ้าน (Tenant)', 'viewer'], ['plans', 'แพ็กเกจ', 'viewer'], ['billing', 'การเงิน', 'viewer'], ['jobs', 'งานตั้งเวลา', 'operator'],
    ['audit', 'ประวัติการใช้งาน', 'viewer'], ['admins', 'แอดมิน', 'owner'], ['system', 'ระบบ', 'viewer']
  ];

  var S = { sb: null, token: '', me: null, tab: 'tenants', tenants: null, plans: null, admins: null, audit: null, info: null, jobs: null, billing: null,
            msg: null, jobResult: null, stats: {}, factor: null };

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function can(role) { return !!S.me && RANK[S.me.role] >= RANK[role]; }
  function fmtDt(s) { if (!s) return '–'; var d = new Date(s); return isNaN(d) ? esc(s) : d.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }); }
  function host(u) { try { return new URL(u).hostname; } catch (_) { return u || ''; } }
  function errText(r) { return (r && r.data && r.data.error) || (r && r.status ? 'ผิดพลาด (HTTP ' + r.status + ')' : 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'); }
  function msgBox(m) {
    if (!m) return '';
    var list = m.list && m.list.length ? '<ul>' + m.list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '';
    return '<div class="msg ' + (m.kind || 'ok') + '" role="alert">' + esc(m.text) + list + '</div>';
  }
  function setMsg(kind, text, list) { S.msg = text ? { kind: kind, text: text, list: list } : null; }

  // ─── เรียก API ───────────────────────────────────────────────
  function edgeBase() {
    var b = (CFG.EDGE_URL || '').trim();
    if (!b) b = String(CFG.MASTER_SUPABASE_URL || '').replace(/\/+$/, '') + '/functions/v1/line-webhook';
    return b.replace(/\/+$/, '');
  }
  async function authHeaders() {
    if (S.token) return { 'x-platform-token': S.token };
    var s = S.sb ? (await S.sb.auth.getSession()).data.session : null;
    return s ? { 'Authorization': 'Bearer ' + s.access_token } : {};
  }
  async function api(action, opt) {
    opt = opt || {};
    var q = opt.query ? '?' + Object.keys(opt.query).filter(function (k) { return opt.query[k] !== '' && opt.query[k] != null; }).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(opt.query[k]); }).join('&') : '';
    var h = await authHeaders();
    var init = { method: opt.method || 'GET', headers: h };
    if (opt.body !== undefined) { init.method = 'POST'; init.headers = Object.assign({ 'Content-Type': 'application/json' }, h); init.body = JSON.stringify(opt.body); }
    var res;
    try { res = await fetch(edgeBase() + '/api/platform/' + action + q, init); }
    catch (e) { return { ok: false, status: 0, data: { error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้' } }; }
    var data = null; try { data = await res.json(); } catch (_) { data = {}; }
    var r = { ok: res.ok || res.status === 207, status: res.status, data: data || {} };
    if (res.status === 401 && !opt.quiet) { await logout('เซสชันหมดอายุหรือไม่มีสิทธิ์ — กรุณาเข้าสู่ระบบใหม่'); r.handled = true; }
    else if (res.status === 403 && r.data.mfa && !opt.quiet) { r.handled = true; showEnroll(true); }
    return r;
  }

  // ─── เข้าสู่ระบบ ──────────────────────────────────────────────
  function cfgProblem() {
    var u = String(CFG.MASTER_SUPABASE_URL || ''), k = String(CFG.MASTER_SUPABASE_ANON_KEY || '');
    if (!u || /YOUR-|YOUR_/.test(u) || !k || /YOUR_/.test(k)) return 'ยังไม่ได้ตั้งค่า platform-config.js (MASTER_SUPABASE_URL / MASTER_SUPABASE_ANON_KEY)';
    if (/service_role/i.test(k) || /^eyJ/.test(k) && jwtRole(k) === 'service_role') return 'พบ service_role key ใน platform-config.js — ห้ามใช้ ให้ใส่ anon/publishable key เท่านั้น แล้วเปลี่ยน service_role key ที่เปิดเผยแล้วทันที';
    return '';
  }
  function jwtRole(t) { try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role; } catch (_) { return ''; } }

  function renderLogin() {
    var p = cfgProblem();
    $('app').innerHTML =
      '<div class="center"><div class="card"><h2>' + esc(CFG.TITLE || 'แอดมินแพลตฟอร์ม') + '</h2>' +
      (p ? '<div class="msg err">' + esc(p) + '</div>' : '') + msgBox(S.msg) +
      '<form id="f-login" autocomplete="on"><label class="f"><span>อีเมล</span><input id="lg-email" type="email" autocomplete="username" required></label>' +
      '<label class="f"><span>รหัสผ่าน</span><input id="lg-pass" type="password" autocomplete="current-password" required></label>' +
      '<button class="btn pri" type="submit" id="lg-go"' + (p ? ' disabled' : '') + '>เข้าสู่ระบบ</button></form>' +
      '<details><summary>เข้าด้วย Platform Token (กรณีฉุกเฉิน)</summary><form id="f-token"><label class="f"><span>PLATFORM_ADMIN_TOKEN</span><input id="lg-token" type="password" autocomplete="off"></label>' +
      '<button class="btn" type="submit">เข้าด้วย Token</button><p class="mute" style="font-size:12px">Token อยู่ในหน่วยความจำของหน้านี้เท่านั้น ไม่ถูกบันทึกในเบราว์เซอร์ และมีสิทธิ์ owner เต็ม — ใช้เฉพาะตอนจำเป็น</p></form></details></div></div>';
  }

  async function doLogin(email, pass) {
    if (!S.sb) { setMsg('err', 'โหลดไลบรารีเข้าสู่ระบบไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต'); return renderLogin(); }
    var r = await S.sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) { setMsg('err', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'); return renderLogin(); }
    setMsg(null);
    await afterLogin();
  }
  async function doTokenLogin(tok) {
    tok = String(tok || '').trim();
    if (tok.length < 24) { setMsg('err', 'Token สั้นเกินไป'); return renderLogin(); }
    S.token = tok;
    var r = await api('me', { quiet: true });
    if (!r.ok) { S.token = ''; setMsg('err', r.status === 404 ? 'ไม่พบ API แพลตฟอร์ม (ตรวจ EDGE_URL / ตั้ง PLATFORM_ADMIN_TOKEN แล้วหรือยัง)' : r.status === 429 ? 'ลองผิดบ่อยเกินไป รอสักครู่' : 'Token ไม่ถูกต้อง'); return renderLogin(); }
    S.me = r.data; setMsg(null); await enter();
  }
  async function afterLogin() {
    var aal = await S.sb.auth.mfa.getAuthenticatorAssuranceLevel();
    var d = aal && aal.data || {};
    if (d.nextLevel === 'aal2' && d.currentLevel !== 'aal2') return showChallenge();
    var r = await api('me', { quiet: true });
    if (r.status === 403 && r.data.mfa) return showEnroll(true);
    if (!r.ok) { await logout(r.status === 401 ? 'บัญชีนี้ไม่ได้เป็นแอดมินแพลตฟอร์ม หรือถูกปิดใช้งาน' : errText(r)); return; }
    S.me = r.data; await enter();
  }
  async function logout(text) {
    S.token = ''; S.me = null; S.tenants = S.plans = S.admins = S.audit = S.info = S.jobs = S.billing = null; S.stats = {};
    try { if (S.sb) await S.sb.auth.signOut(); } catch (_) { /* ไม่เป็นไร */ }
    setMsg(text ? 'err' : null, text || ''); renderLogin();
  }

  // ─── MFA (TOTP) ───────────────────────────────────────────────
  function showChallenge() {
    $('app').innerHTML = '<div class="center"><div class="card"><h2>ยืนยันตัวตนสองขั้นตอน</h2><p class="mute">กรอกรหัส 6 หลักจากแอป Authenticator</p>' + msgBox(S.msg) +
      '<form id="f-mfa"><label class="f"><span>รหัส 6 หลัก</span><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>' +
      '<div class="row"><button class="btn pri" type="submit">ยืนยัน</button><button class="btn" type="button" data-act="logout">ยกเลิก</button></div></form></div></div>';
    var c = $('mfa-code'); if (c && c.focus) c.focus();
  }
  async function doChallenge(code) {
    var lf = await S.sb.auth.mfa.listFactors();
    var f = lf.data && lf.data.totp && lf.data.totp.filter(function (x) { return x.status === 'verified'; })[0];
    if (!f) { setMsg('err', 'ไม่พบอุปกรณ์ยืนยันตัวตน'); return showEnroll(false); }
    var ch = await S.sb.auth.mfa.challenge({ factorId: f.id });
    if (ch.error) { setMsg('err', 'ขอรหัสไม่สำเร็จ ลองใหม่'); return showChallenge(); }
    var v = await S.sb.auth.mfa.verify({ factorId: f.id, challengeId: ch.data.id, code: String(code).trim() });
    if (v.error) { setMsg('err', 'รหัสไม่ถูกต้อง หรือหมดอายุ'); return showChallenge(); }
    setMsg(null); await afterLogin();
  }
  async function showEnroll(required) {
    var lf = await S.sb.auth.mfa.listFactors();
    var verified = lf.data && lf.data.totp && lf.data.totp.filter(function (x) { return x.status === 'verified'; });
    if (verified && verified.length) return showChallenge();
    // ลบ factor ที่ค้างยังไม่ยืนยัน แล้วสมัครใหม่
    var stale = (lf.data && lf.data.all || []).filter(function (x) { return x.status !== 'verified'; });
    for (var i = 0; i < stale.length; i++) { try { await S.sb.auth.mfa.unenroll({ factorId: stale[i].id }); } catch (_) { /* ข้าม */ } }
    var en = await S.sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: 'platform-' + Date.now() });
    if (en.error) { setMsg('err', 'เริ่มตั้งค่า MFA ไม่สำเร็จ: ' + en.error.message); return renderLogin(); }
    S.factor = en.data.id;
    var qr = String(en.data.totp && en.data.totp.qr_code || '');
    var okQr = /^data:image\/(svg\+xml|png)/.test(qr);
    $('app').innerHTML = '<div class="center"><div class="card"><h2>ตั้งค่ายืนยันตัวตนสองขั้นตอน</h2>' +
      (required ? '<div class="msg warn">ระบบบังคับใช้ MFA — ต้องตั้งค่าก่อนใช้งาน</div>' : '') + msgBox(S.msg) +
      '<p>สแกน QR ด้วยแอป Authenticator (Google Authenticator / Authy / 1Password) แล้วกรอกรหัส 6 หลัก</p>' +
      (okQr ? '<img class="qr" id="mfa-qr" alt="QR">' : '') +
      '<p class="mono" id="mfa-secret">' + esc(en.data.totp && en.data.totp.secret || '') + '</p>' +
      '<form id="f-enroll"><label class="f"><span>รหัส 6 หลัก</span><input id="mfa-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label>' +
      '<div class="row"><button class="btn pri" type="submit">ยืนยันและเปิดใช้</button><button class="btn" type="button" data-act="logout">ยกเลิก</button></div></form></div></div>';
    if (okQr) $('mfa-qr').setAttribute('src', qr);
  }
  async function doEnrollVerify(code) {
    var ch = await S.sb.auth.mfa.challenge({ factorId: S.factor });
    if (ch.error) { setMsg('err', 'ขอรหัสไม่สำเร็จ'); return showEnroll(true); }
    var v = await S.sb.auth.mfa.verify({ factorId: S.factor, challengeId: ch.data.id, code: String(code).trim() });
    if (v.error) { setMsg('err', 'รหัสไม่ถูกต้อง ลองใหม่'); return showEnroll(true); }
    setMsg(null); await afterLogin();
  }

  // ─── โครงหน้าหลัก ───────────────────────────────────────────
  async function enter() {
    S.tab = 'tenants';
    await Promise.all([loadTenants(), loadPlans(), loadInfo()]);
    render();
  }
  function render() {
    if (!S.me) return renderLogin();
    var tabs = TABS.filter(function (t) { return can(t[2]); });
    if (!tabs.some(function (t) { return t[0] === S.tab; })) S.tab = tabs[0][0];
    $('app').innerHTML =
      '<header class="top"><h1>' + esc(CFG.TITLE || 'แอดมินแพลตฟอร์ม') + '</h1><div class="who">' + esc(S.me.label) +
      '<span class="role">' + esc(ROLE_TH[S.me.role] || S.me.role) + '</span></div>' +
      '<button class="btn sm" data-act="mfa-setup"' + (S.me.via === 'token' ? ' hidden' : '') + '>ตั้งค่า MFA</button>' +
      '<button class="btn sm" data-act="logout">ออกจากระบบ</button></header>' +
      '<nav class="tabs" role="tablist">' + tabs.map(function (t) { return '<button role="tab" data-act="tab" data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + esc(t[1]) + '</button>'; }).join('') + '</nav>' +
      msgBox(S.msg) + '<div id="view"></div>';
    var v = { tenants: viewTenants, plans: viewPlans, billing: viewBilling, jobs: viewJobs, audit: viewAudit, admins: viewAdmins, system: viewSystem }[S.tab];
    $('view').innerHTML = v();
  }

  // ─── Tenants ─────────────────────────────────────────────────
  async function loadTenants() { var r = await api('tenants'); if (r.ok) S.tenants = r.data.tenants || []; else if (!r.handled) setMsg('err', errText(r)); }
  async function loadPlans() { var r = await api('plans'); if (r.ok) S.plans = r.data.plans || []; else if (!r.handled) setMsg('err', errText(r)); }
  async function loadInfo() { var r = await api('info'); if (r.ok) S.info = r.data; }

  // sync หน้าฟอร์ม: โหมด "ตามแพ็กเกจ" → แสดงฟีเจอร์ของแพ็กเกจที่เลือก (ติ๊กไม่ได้)

  function readLimits(form) {

  function checkLimits(form, forTenant) {

  function formBody(form) {

    b.sharedEnv = shared;

  async function submitTenant(form) {
    var mode = form.getAttribute('data-mode'), b = formBody(form), box = $('tf-msg');
    var bad = function (t) { box.innerHTML = msgBox({ kind: 'err', text: t }); };
    if (!SLUG_RE.test(b.slug || '')) return bad('slug ต้องเป็น a-z 0-9 และ - ยาว 3-32 ตัว');
    if (!b.name) return bad('ต้องระบุชื่อ');
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(b.supabaseUrl || '')) return bad('Supabase URL ต้องอยู่ในรูป https://xxxx.supabase.co');
    if (mode === 'create' && !b.serviceKey) return bad('ต้องระบุ service_role key');
    var lerr = checkLimits(form, true); if (lerr) return bad(lerr);
    var btn = $('tf-go'); btn.disabled = true;
    var r = await api(mode === 'create' ? 'tenant_create' : 'tenant_update', { body: b });

      '<label class="f"><span>หมายเหตุ</span><input name="note" maxlength="300" value="' + esc(inv.note || '') + '"></label>' +
      '<div class="row"><button class="btn pri" type="submit" id="pay-go">บันทึกว่าชำระแล้ว + ต่ออายุ</button><button class="btn" type="button" data-act="close">ปิด</button></div></form>';
  }
  async function submitPay(form) {
    var fd = new FormData(form), box = $('pay-msg');
    var body = { id: form.getAttribute('data-id'), status: 'paid', paidMethod: String(fd.get('paidMethod') || ''), note: String(fd.get('note') || '').trim() };
    var d = String(fd.get('paidAt') || ''); if (d) body.paidAt = new Date(d + 'T12:00:00+07:00').toISOString();
    var btn = $('pay-go'); btn.disabled = true;
    var r = await api('invoice_set_status', { body: body });
    btn.disabled = false;
    if (r.handled) return;
    if (!r.ok) { box.innerHTML = msgBox({ kind: 'err', text: errText(r) }); return; }
    closeModal();
    setMsg('ok', 'บันทึกการชำระแล้ว' + (r.data.renewed ? ' · ต่ออายุถึง ' + fmtDate(r.data.expiresAt) : ' · หมู่บ้านนี้ไม่มีวันหมดอายุ จึงไม่ต้องต่อ'));
    await Promise.all([loadBilling(), loadTenants()]); render();
  }

  // ─── ต่ออายุ ─────────────────────────────────────────────────
  function renewForm(t) {
    var cur = t.expiresAt ? thDate(t.expiresAt) : '';
    return '<h3>ต่ออายุ ' + esc(t.name) + '</h3><div id="rn-msg"></div>' +
      '<p class="mute">ตอนนี้: ' + (t.expiresAt ? (t.expired ? 'หมดอายุแล้วเมื่อ ' : 'หมดอายุ ') + esc(fmtDate(t.expiresAt)) : 'ไม่หมดอายุ') + '</p>' +
      '<form id="f-renew" data-slug="' + esc(t.slug) + '" data-cur="' + esc(t.expiresAt || '') + '">' +
      '<div class="quick">' + [30, 90, 180, 365].map(function (n) { return '<button type="button" class="btn sm" data-act="rn-add" data-days="' + n + '">+' + n + ' วัน</button>'; }).join('') + '</div>' +
      '<label class="f"><span>หมดอายุวันที่ (นับต่อจากวันหมดอายุเดิม หรือจากวันนี้ถ้าหมดแล้ว)</span><input type="date" name="expiresAt" value="' + esc(cur) + '"></label>' +
      '<label class="chk"><input type="checkbox" name="never"' + (t.expiresAt ? '' : ' checked') + '> ไม่หมดอายุ</label>' +
      (t.expired ? '<div class="msg warn">ต่ออายุแล้วหมู่บ้านนี้กลับมาให้บริการทันที (สถานะต้องเป็น “ใช้งานอยู่” ด้วย)</div>' : '') +
      '<div class="row"><button class="btn pri" type="submit" id="rn-go">บันทึก</button><button class="btn" type="button" data-act="close">ปิด</button></div></form>';
  }
  function renewAdd(form, days) {
    var curIso = form.getAttribute('data-cur'), base = Date.now();
    var cm = Date.parse(curIso); if (!isNaN(cm) && cm > base) base = cm;
    form.elements.expiresAt.value = thDate(new Date(base + days * 86400000).toISOString());
    form.elements.never.checked = false;
  }
  async function submitRenew(form) {
    var box = $('rn-msg'), slug = form.getAttribute('data-slug');
    var bad = function (m) { box.innerHTML = msgBox({ kind: 'err', text: m }); };
    var never = form.elements.never.checked, d = form.elements.expiresAt.value;
    if (!never && !d) return bad('เลือกวันหมดอายุ หรือติ๊ก “ไม่หมดอายุ”');
    $('rn-go').disabled = true;
    var r = await api('tenant_update', { body: { slug: slug, expiresAt: never ? null : d } });
    if (r.handled) return;
    if (!r.ok) { $('rn-go').disabled = false; return bad(errText(r)); }
    closeModal(); setMsg('ok', never ? 'ตั้งเป็นไม่หมดอายุแล้ว' : 'ต่ออายุถึง ' + fmtDate(r.data.tenant && r.data.tenant.expiresAt)); await loadTenants(); render();
  }

  // ─── Jobs ────────────────────────────────────────────────────
  var JOB_TH = { process_birthdays: 'อวยพรวันเกิด/แจกคะแนน', process_point_expiry: 'คะแนนหมดอายุ', process_tier_notifications: 'แจ้งเตือนระดับสมาชิก' };
  function viewJobs() {
    var jobs = S.jobs || [];
    var res = S.jobResult;
    return '<div class="card"><h2>สั่งงานตั้งเวลา (ทุกหมู่บ้านที่เปิดใช้งาน)</h2>' +
      '<p class="mute">งานปกติควรตั้งให้ทำงานอัตโนมัติด้วย <span class="mono">tenant-jobs.yml</span> (GitHub Actions) — หน้านี้ใช้สั่งมือเมื่อจำเป็น</p>' +
      '<form id="f-job"><div class="grid2"><label class="f"><span>งาน</span><select name="job">' + jobs.map(function (j) { return '<option value="' + esc(j) + '">' + esc(JOB_TH[j] || j) + ' (' + esc(j) + ')</option>'; }).join('') + '</select></label>' +
      '<label class="f"><span>เฉพาะ slug (คั่นด้วย , — เว้นว่าง = ทุกหมู่บ้าน)</span><input name="slugs" placeholder="baan-suk, village-2"></label></div>' +
      '<button class="btn pri" type="submit" id="jb-go">รันงาน</button></form></div>' +
      (res ? '<div class="card"><h2>ผลลัพธ์ ' + esc(res.job) + ' — ทั้งหมด ' + esc(res.total) + ' · ล้มเหลว ' + esc(res.failed) + '</h2><div class="scroll"><table class="tbl"><thead><tr><th>tenant</th><th>ผล</th><th>รายละเอียด</th><th>ms</th></tr></thead><tbody>' +
        (res.results || []).map(function (x) { return '<tr><td class="mono">' + esc(x.slug) + '</td><td><span class="badge ' + (x.ok ? 'b-ok' : 'b-bad') + '">' + (x.ok ? 'สำเร็จ' : 'ล้มเหลว') + '</span></td><td class="mono mute">' + esc(x.error || x.detail || '') + '</td><td>' + esc(x.ms) + '</td></tr>'; }).join('') +
        '</tbody></table></div>' + (res.next != null ? '<button class="btn" data-act="job-next" data-next="' + esc(res.next) + '">รันหน้าถัดไป (ยังมีหมู่บ้านเหลือ)</button>' : '') + '</div>' : '');
  }
  async function runJob(job, slugs, offset) {
    var btn = $('jb-go'); if (btn) btn.disabled = true;
    var body = { job: job, offset: offset || 0 };
    if (slugs && slugs.length) body.slugs = slugs;
    var r = await api('run_job', { body: body });
    if (r.handled) return;
    if (!r.ok && !(r.data && r.data.results)) { setMsg('err', errText(r)); S.jobResult = null; }
    else { S.jobResult = Object.assign({ slugs: slugs }, r.data); setMsg(r.data.failed ? 'warn' : 'ok', r.data.failed ? 'บางหมู่บ้านล้มเหลว ดูรายละเอียดด้านล่าง' : 'รันงานสำเร็จ'); }
    render();
  }

  // ─── Audit ───────────────────────────────────────────────────
  function viewAudit() {
    var rows = (S.audit || []).map(function (a) {
      return '<tr><td>' + fmtDt(a.at) + '</td><td>' + esc(a.actor) + '</td><td class="mono">' + esc(a.action) + '</td><td class="mono">' + esc(a.slug || '–') + '</td><td class="mono mute">' + esc(JSON.stringify(a.detail || {})) + '</td></tr>';
    }).join('');
    return '<div class="card"><form id="f-audit" class="row"><h2 class="grow">ประวัติการใช้งาน</h2><input name="slug" placeholder="กรอง slug" style="width:160px"><button class="btn" type="submit">ค้นหา</button></form>' +
      '<div class="scroll"><table class="tbl"><thead><tr><th>เวลา</th><th>ผู้ทำ</th><th>การกระทำ</th><th>tenant</th><th>รายละเอียด</th></tr></thead><tbody>' + (rows || '<tr><td colspan="5" class="mute">ไม่มีข้อมูล</td></tr>') + '</tbody></table></div></div>';
  }
  async function loadAudit(slug) {
    var r = await api('audit', { query: { limit: 100, slug: slug || '' } });
    if (r.ok) S.audit = r.data.audit || []; else if (!r.handled) setMsg('err', errText(r));
  }

  // ─── Admins ──────────────────────────────────────────────────
  function viewAdmins() {
    var rows = (S.admins || []).map(function (a) {
      return '<tr><td>' + esc(a.email) + '</td><td>' + esc(ROLE_TH[a.role] || a.role) + '</td><td><span class="badge ' + (a.disabled ? 'b-bad' : 'b-ok') + '">' + (a.disabled ? 'ปิดใช้งาน' : 'ใช้งานได้') + '</span></td>' +
        '<td><button class="btn sm" data-act="a-edit" data-email="' + esc(a.email) + '">แก้ไข</button></td></tr>';
    }).join('');
    return '<div class="card"><div class="row"><h2 class="grow">แอดมินแพลตฟอร์ม</h2><button class="btn pri" data-act="a-new">+ เพิ่ม/แก้สิทธิ์</button></div>' +
      '<p class="mute">ต้องสร้างบัญชีที่ Supabase Dashboard → Authentication → Users ก่อน แล้วกำหนดสิทธิ์ที่นี่</p>' +
      '<div class="scroll"><table class="tbl"><thead><tr><th>อีเมล</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }
  function adminForm(a) {
    a = a || {};
    return '<h3>แอดมินแพลตฟอร์ม</h3><div id="af-msg"></div><form id="f-admin">' +
      '<label class="f"><span>อีเมล (ต้องมีบัญชีใน Authentication แล้ว)</span><input name="email" type="email" value="' + esc(a.email || '') + '" required></label>' +
      '<label class="f"><span>สิทธิ์</span><select name="role">' + ['viewer', 'operator', 'owner'].map(function (r) { return '<option value="' + r + '"' + (a.role === r ? ' selected' : '') + '>' + esc(ROLE_TH[r]) + ' (' + r + ')</option>'; }).join('') + '</select></label>' +
      '<label class="chk"><input type="checkbox" name="disabled"' + (a.disabled ? ' checked' : '') + '> ปิดการใช้งานบัญชีนี้</label>' +
      '<div class="row"><button class="btn pri" type="submit">บันทึก</button><button class="btn" type="button" data-act="close">ปิด</button></div></form>';
  }
  async function submitAdmin(form) {
    var fd = new FormData(form), box = $('af-msg');
    var r = await api('admin_set', { body: { email: String(fd.get('email') || '').trim(), role: String(fd.get('role')), disabled: form.elements.disabled.checked } });
    if (r.handled) return;
    if (!r.ok) { box.innerHTML = msgBox({ kind: 'err', text: errText(r) }); return; }
    closeModal(); setMsg('ok', 'บันทึกสิทธิ์แล้ว'); var a = await api('admins'); if (a.ok) S.admins = a.data.admins || []; render();
  }

  // ─── System ──────────────────────────────────────────────────
  function viewSystem() {
    var i = S.info || {};
    return '<div class="card"><h2>สถานะระบบ</h2><div class="kv">' +
      '<div class="mute">โหมด</div><div>' + (i.platformMode ? '<span class="badge b-ok">แพลตฟอร์ม (PLATFORM_MODE)</span>' : '<span class="badge b-pending">เดี่ยว — ยังไม่ได้ตั้ง PLATFORM_MODE=true</span>') + '</div>' +
      '<div class="mute">กุญแจเข้ารหัสความลับ</div><div>' + (i.cryptoKeyConfigured ? '<span class="badge b-ok">ตั้งแล้ว (TENANT_SECRET_KEY)</span>' : '<span class="badge b-bad">ยังไม่ได้ตั้ง TENANT_SECRET_KEY</span>') + '</div>' +
      '<div class="mute">รูปแบบ Webhook</div><div class="mono">' + esc(i.webhookPattern || '') + '</div>' +
      '<div class="mute">ตารางที่หมู่บ้านต้องมี</div><div class="mono">' + esc((i.requiredTables || []).join(', ')) + '</div>' +
      '<div class="mute">คีย์กลางที่แชร์ได้</div><div class="mono">' + esc((i.sharedEnvAllowlist || []).join(', ') || '–') + '</div></div></div>' +
      (can('operator') ? '<div class="card"><h2>ทดสอบการแยกข้อมูลระหว่างหมู่บ้าน</h2><p class="mute">จำลองคำขอสลับหลาย tenant พร้อมกัน เพื่อยืนยันว่า context ไม่ปนกัน</p><button class="btn" data-act="selftest">รันทดสอบ</button><div id="st-out"></div></div>' : '');
  }

  // ─── Event wiring ───────────────────────────────────────────
  async function onAction(el) {
    var act = el.getAttribute('data-act'), slug = el.getAttribute('data-slug');
    var find = function (arr, k, v) { return (arr || []).filter(function (x) { return x[k] === v; })[0]; };
    switch (act) {
      case 'logout': return logout();
      case 'close': return closeModal();
      case 'ov': return;
      case 'reload': setMsg(null); await Promise.all([loadTenants(), loadPlans()]); return render();
      case 'tab': {
        S.tab = el.getAttribute('data-tab'); setMsg(null);
        if (S.tab === 'audit' && !S.audit) await loadAudit('');
        if (S.tab === 'admins') { var a = await api('admins'); if (a.ok) S.admins = a.data.admins || []; }
        if (S.tab === 'jobs' && !S.jobs) { var j = await api('jobs'); if (j.ok) S.jobs = j.data.jobs || []; }
        if (S.tab === 'plans') await loadPlans();
        if (S.tab === 'billing') { await Promise.all([loadBilling(), loadTenants(), loadPlans()]); }
        if (S.tab === 'system') await loadInfo();
        return render();
      }
      case 't-new': openModal(tenantForm(null)); return syncFeat($('f-tenant'));
      case 't-edit': openModal(tenantForm(find(S.tenants, 'slug', slug))); return syncFeat($('f-tenant'));
      case 't-renew': return openModal(renewForm(find(S.tenants, 'slug', slug)));
      case 'rn-add': return renewAdd(el.closest('form'), Number(el.getAttribute('data-days')));
      case 'feat-all': case 'feat-none': {
        var ff = el.closest('form'), cm = ff.querySelector('input[name="featMode"][value="custom"]');
        if (cm) cm.checked = true; syncFeat(ff);
        Array.prototype.forEach.call(ff.querySelectorAll('input[name="feat"]'), function (c) { c.checked = act === 'feat-all'; });
        return;
      }
      case 't-test': return tenantTest(slug);
      case 't-webhook': return tenantWebhook(slug);
      case 't-status': return tenantStatus(slug, el.getAttribute('data-status'));
      case 't-stats': return tenantStats(slug);
      case 'p-new': openModal(planForm(null)); return syncFeat($('f-plan'));
      case 'p-edit': openModal(planForm(find(S.plans, 'code', el.getAttribute('data-code')))); return syncFeat($('f-plan'));
      case 'p-del': {
        var code = el.getAttribute('data-code');
        if (!(await confirmBox('ลบแพ็กเกจ', 'ลบแพ็กเกจ “' + code + '” ?', 'ลบ', true))) return;
        var r = await api('plan_delete', { body: { code: code } });
        if (r.handled) return;
        if (!r.ok) setMsg('err', errText(r), r.data && r.data.slugs); else setMsg('ok', 'ลบแล้ว');
        await loadPlans(); return render();
      }
      case 'b-reload': setMsg(null); await loadBilling(); return render();
      case 'inv-filter': S.billing = Object.assign({}, S.billing, { status: el.getAttribute('data-status') || '' }); await loadBilling(); return render();
      case 'inv-new': return openModal(invoiceForm(slug));
      case 'inv-gen': {
        if (!(await confirmBox('ออกใบแจ้งหนี้อัตโนมัติ', 'ออกใบ 1 เดือนให้ทุกหมู่บ้านที่ใช้งานอยู่และจะหมดอายุภายใน 14 วัน (หรือหมดแล้ว) ซึ่งแพ็กเกจมีราคา และยังไม่มีใบค้างชำระ — กดซ้ำได้ ไม่ออกซ้ำ', 'ออกใบ', false))) return;
        var g = await api('invoice_generate_due', { body: { daysAhead: 14 } });
        if (g.handled) return;
        if (!g.ok) setMsg('err', errText(g));
        else setMsg(g.data.created.length ? 'ok' : 'warn', 'ออกใบแจ้งหนี้ ' + g.data.created.length + ' ใบ' + (g.data.skipped.length ? ' · ข้าม ' + g.data.skipped.length + ' แห่ง' : ''),
          g.data.created.map(function (x) { return x.slug + ' → ' + x.invoice_no + ' (' + money(x.amount_thb) + ')'; }).concat(g.data.skipped.map(function (x) { return x.slug + ' — ข้าม: ' + x.reason; })));
        await loadBilling(); return render();
      }
      case 'inv-pay': { var iv = find(S.billing && S.billing.list, 'id', el.getAttribute('data-id')); return iv ? openModal(payForm(iv)) : undefined; }
      case 'inv-void': {
        var iv2 = find(S.billing && S.billing.list, 'id', el.getAttribute('data-id')); if (!iv2) return;
        if (!(await confirmBox('ยกเลิกใบแจ้งหนี้', 'ยกเลิกใบ ' + iv2.invoice_no + ' ของ ' + iv2.slug + ' ? (ยกเลิกแล้วคืนไม่ได้ ต้องออกใบใหม่)', 'ยกเลิกใบ', true))) return;
        var vr = await api('invoice_set_status', { body: { id: iv2.id, status: 'void' } });
        if (vr.handled) return;
        if (!vr.ok) setMsg('err', errText(vr)); else setMsg('ok', 'ยกเลิกใบแล้ว');
        await loadBilling(); return render();
      }
      case 'a-new': return openModal(adminForm(null));
      case 'a-edit': return openModal(adminForm(find(S.admins, 'email', el.getAttribute('data-email'))));
      case 'job-next': return runJob(S.jobResult.job, S.jobResult.slugs, Number(el.getAttribute('data-next')));
      case 'mfa-setup': return showEnroll(false);
      case 'selftest': {
        el.disabled = true; var out = $('st-out'); out.innerHTML = '<p class="mute">กำลังทดสอบ…</p>';
        var s = await api('selftest', { body: {} }); el.disabled = false;
        if (s.handled) return;
        out.innerHTML = msgBox({ kind: s.data.ok ? 'ok' : 'err', text: s.data.ok ? 'ผ่าน — ไม่พบการปนกันของข้อมูล' : (s.data.error || 'ไม่ผ่าน'), list: s.data.detail });
        return;
      }
    }
  }
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el) return;
    if (el.getAttribute('data-act') === 'ov' && ev.target !== el) return;   // คลิกพื้นหลังเท่านั้นถึงปิด
    if (el.getAttribute('data-act') === 'ov') return closeModal();
    onAction(el);
  });
  document.addEventListener('submit', function (ev) {
    var f = ev.target; ev.preventDefault();
    switch (f.id) {
      case 'f-login': return doLogin(f.elements['lg-email'] ? f.elements['lg-email'].value : $('lg-email').value, $('lg-pass').value);
      case 'f-token': return doTokenLogin($('lg-token').value);
      case 'f-mfa': return doChallenge($('mfa-code').value);
      case 'f-enroll': return doEnrollVerify($('mfa-code').value);
      case 'f-tenant': return submitTenant(f);
      case 'f-plan': return submitPlan(f);
      case 'f-inv': return submitInvoice(f);
      case 'f-pay': return submitPay(f);
      case 'f-renew': return submitRenew(f);
      case 'f-admin': return submitAdmin(f);
      case 'f-job': {
        var fd = new FormData(f), sl = String(fd.get('slugs') || '').split(',').map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean);
        return runJob(String(fd.get('job')), sl, 0);
      }
      case 'f-audit': return (async function () { await loadAudit(String(new FormData(f).get('slug') || '').trim().toLowerCase()); render(); })();
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target, f = t && t.form;
    if (!f) return;
    if (t.name === 'featMode' || (t.name === 'plan' && f.id === 'f-tenant')) syncFeat(f);
    if (t.name === 'never' && f.id === 'f-renew' && t.checked) f.elements.expiresAt.value = '';
    if (t.name === 'expiresAt' && f.id === 'f-renew' && t.value) f.elements.never.checked = false;
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });

  // ─── เริ่มทำงาน ──────────────────────────────────────────────
  async function boot() {
    var p = cfgProblem();
    if (!p && window.supabase && window.supabase.createClient) {
      S.sb = window.supabase.createClient(CFG.MASTER_SUPABASE_URL, CFG.MASTER_SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
      var s = await S.sb.auth.getSession();
      if (s && s.data && s.data.session) return afterLogin();
    } else if (!p) { setMsg('err', 'โหลดไลบรารีเข้าสู่ระบบไม่สำเร็จ — ตรวจสอบอินเทอร์เน็ต'); }
    renderLogin();
  }
  window.__platform = { S: S, boot: boot, api: api, render: render };
  boot();
})();
</script>
</body>
</html>
