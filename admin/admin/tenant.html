<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ทะเบียนผู้เช่า · Tenant Registry · 租户登记</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/128/1077/1077114.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        [v-cloak] { display: none !important; }
        body {
            background: linear-gradient(180deg, #fdf2f8 0%, #f8fafc 100%);
            font-family: 'Sarabun', 'Noto Sans SC', sans-serif;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255,255,255,0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.9); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.06);
        }
        .lang-btn.active { background: #db2777; color: white; }
        input, select, textarea { font-family: inherit; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

<body>
    <div id="app" v-cloak class="relative max-w-lg mx-auto min-h-screen pb-10 px-4">

        <!-- Language Switcher -->
        <div class="flex justify-center gap-2 pt-5 pb-4">
            <button v-for="l in ['th','en','zh']" :key="l" @click="lang = l"
                class="lang-btn px-4 py-2 rounded-full text-sm font-bold bg-white border border-slate-200 transition-all"
                :class="{ active: lang === l }">
                {{ { th: '🇹🇭 ไทย', en: '🇬🇧 English', zh: '🇨🇳 中文' }[l] }}
            </button>
        </div>

        <!-- Header -->
        <div class="glass-card p-5 mb-4 text-center">
            <div class="text-3xl mb-2">👥</div>
            <h1 class="text-xl font-extrabold text-slate-800">{{ t.title }}</h1>
            <p class="text-sm text-slate-500 mt-1">{{ t.subtitle }}</p>
        </div>

        <!-- Success State -->
        <div v-if="submitted" class="glass-card p-8 text-center">
            <div class="text-5xl mb-3">✅</div>
            <h2 class="text-lg font-bold text-slate-800">{{ t.successTitle }}</h2>
            <p class="text-sm text-slate-500 mt-2">{{ t.successMsg }}</p>
            <button @click="resetForm" class="mt-5 px-6 py-2.5 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-bold text-sm">{{ t.newSubmission }}</button>
        </div>

        <!-- Form -->
        <form v-else @submit.prevent="submitForm" class="space-y-4">
            <div class="glass-card p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.houseNo }} *</label>
                    <input v-model="form.house_no" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none" :placeholder="t.houseNoPlaceholder">
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.fullNameEn }} *</label>
                        <input v-model="form.full_name_en" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none" placeholder="e.g. Wang Xiao Ming">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.fullNameTh }}</label>
                        <input v-model="form.full_name_th" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none" :placeholder="t.fullNameThPlaceholder">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.nationality }} *</label>
                    <input v-model="form.nationality" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none" :placeholder="t.nationalityPlaceholder">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.idType }} *</label>
                        <select v-model="form.id_type" required class="w-full rounded-2xl border border-slate-200 px-3 py-3 text-sm bg-white focus:ring-2 focus:ring-pink-300 outline-none">
                            <option value="">{{ t.select }}</option>
                            <option value="thai_id">{{ t.thaiId }}</option>
                            <option value="passport">{{ t.passport }}</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.idNumber }} *</label>
                        <input v-model="form.id_number" required class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.phone }} *</label>
                    <input v-model="form.phone" required type="tel" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none" placeholder="+66 8x-xxx-xxxx">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.email }}</label>
                    <input v-model="form.email" type="email" class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.leaseStart }}</label>
                        <input v-model="form.lease_start" type="date" class="w-full rounded-2xl border border-slate-200 px-3 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1.5">{{ t.leaseEnd }}</label>
                        <input v-model="form.lease_end" type="date" class="w-full rounded-2xl border border-slate-200 px-3 py-3 text-sm focus:ring-2 focus:ring-pink-300 outline-none">
                    </div>
                </div>
            </div>

            <!-- Document Upload -->
            <div class="glass-card p-5">
                <label class="block text-xs font-bold text-slate-600 mb-2">{{ t.documents }}</label>
                <p class="text-[11px] text-slate-400 mb-3">{{ t.documentsHint }}</p>
                <div class="flex flex-wrap gap-2 mb-2">
                    <div v-for="(url, i) in documentUrls" :key="i" class="relative w-16 h-16">
                        <img :src="url" class="w-16 h-16 object-cover rounded-xl border border-slate-200">
                        <button type="button" @click="documentUrls.splice(i,1)" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-rose-500 text-white rounded-full text-xs">×</button>
                    </div>
                    <div v-if="uploading" class="w-16 h-16 bg-slate-100 rounded-xl flex items-center justify-center">
                        <i class="fa-solid fa-spinner fa-spin text-slate-400"></i>
                    </div>
                </div>
                <input type="file" ref="fileInput" accept="image/*" multiple class="hidden" @change="handleFileSelect">
                <button type="button" @click="$refs.fileInput.click()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl text-sm font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-camera"></i> {{ t.addPhoto }}
                </button>
            </div>

            <button type="submit" :disabled="submitting" class="w-full py-4 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-bold shadow-lg shadow-pink-200 flex items-center justify-center gap-2 disabled:opacity-50">
                <i v-if="submitting" class="fa-solid fa-spinner fa-spin"></i>
                <span>{{ submitting ? t.submitting : t.submit }}</span>
            </button>
        </form>

        <div class="text-center mt-6">
            <p class="text-[11px] text-slate-300">Golden Land Serene · {{ t.footer }}</p>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://kiumelolsilduqnvrekf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtpdW1lbG9sc2lsZHVxbnZyZWtmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwODUyNzYsImV4cCI6MjA3MjY2MTI3Nn0.3hCFJiDrkgNJQEggS8MkRnxlhvqIMAax_a73NJq14gU';
        const EDGE_FUNCTION_URL = 'https://kiumelolsilduqnvrekf.supabase.co/functions/v1/line-webhook';

        const I18N = {
            th: {
                title: 'ทะเบียนผู้เช่า', subtitle: 'กรอกข้อมูลผู้เช่าสำหรับหมู่บ้าน Golden Land Serene',
                houseNo: 'บ้านเลขที่ที่เช่า', houseNoPlaceholder: 'เช่น 998/1',
                fullNameEn: 'ชื่อ-นามสกุล (ตามหนังสือเดินทาง/บัตร)', fullNameTh: 'ชื่อ-นามสกุล (ภาษาไทย)',
                fullNameThPlaceholder: 'ถ้ามี',
                nationality: 'สัญชาติ', nationalityPlaceholder: 'เช่น ไทย, จีน',
                idType: 'ประเภทเอกสาร', select: '-- เลือก --', thaiId: 'บัตรประชาชนไทย', passport: 'หนังสือเดินทาง',
                idNumber: 'เลขที่เอกสาร', phone: 'เบอร์โทรศัพท์', email: 'อีเมล',
                leaseStart: 'วันเริ่มสัญญาเช่า', leaseEnd: 'วันสิ้นสุดสัญญาเช่า',
                documents: 'เอกสารแนบ', documentsHint: 'รูปถ่ายบัตรประชาชน/หนังสือเดินทาง หรือสัญญาเช่า',
                addPhoto: 'เพิ่มรูปภาพ', submit: 'ส่งข้อมูล', submitting: 'กำลังส่ง...',
                successTitle: 'ส่งข้อมูลสำเร็จ!', successMsg: 'นิติบุคคลจะตรวจสอบข้อมูลของท่านโดยเร็วที่สุด',
                newSubmission: 'กรอกข้อมูลใหม่', footer: 'ทะเบียนผู้เช่า',
                required: 'กรุณากรอกข้อมูลให้ครบถ้วน', uploadError: 'อัปโหลดรูปไม่สำเร็จ', submitError: 'ส่งข้อมูลไม่สำเร็จ',
            },
            en: {
                title: 'Tenant Registration', subtitle: 'Please fill in your details for Golden Land Serene Village',
                houseNo: 'House Number', houseNoPlaceholder: 'e.g. 998/1',
                fullNameEn: 'Full Name (as per Passport/ID)', fullNameTh: 'Thai Name (if any)',
                fullNameThPlaceholder: 'Optional',
                nationality: 'Nationality', nationalityPlaceholder: 'e.g. Thai, Chinese',
                idType: 'ID Type', select: '-- Select --', thaiId: 'Thai National ID', passport: 'Passport',
                idNumber: 'ID / Passport Number', phone: 'Phone Number', email: 'Email',
                leaseStart: 'Lease Start Date', leaseEnd: 'Lease End Date',
                documents: 'Attached Documents', documentsHint: 'Photo of ID card/passport or lease contract',
                addPhoto: 'Add Photo', submit: 'Submit', submitting: 'Submitting...',
                successTitle: 'Submitted Successfully!', successMsg: 'The management office will review your information shortly.',
                newSubmission: 'New Submission', footer: 'Tenant Registry',
                required: 'Please fill in all required fields', uploadError: 'Photo upload failed', submitError: 'Submission failed',
            },
            zh: {
                title: '租户登记', subtitle: '请填写您在 Golden Land Serene 村庄的租户信息',
                houseNo: '所租房屋门牌号', houseNoPlaceholder: '例如 998/1',
                fullNameEn: '姓名（护照/证件姓名）', fullNameTh: '泰文姓名（如有）',
                fullNameThPlaceholder: '可选',
                nationality: '国籍', nationalityPlaceholder: '例如 泰国、中国',
                idType: '证件类型', select: '-- 请选择 --', thaiId: '泰国身份证', passport: '护照',
                idNumber: '证件号码', phone: '电话号码', email: '电子邮箱',
                leaseStart: '租约开始日期', leaseEnd: '租约结束日期',
                documents: '附件文件', documentsHint: '身份证/护照照片或租赁合同',
                addPhoto: '添加照片', submit: '提交', submitting: '提交中...',
                successTitle: '提交成功！', successMsg: '物业管理处将尽快审核您的信息。',
                newSubmission: '新提交', footer: '租户登记',
                required: '请填写所有必填项', uploadError: '照片上传失败', submitError: '提交失败',
            },
        };

        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    lang: 'th',
                    supabase: null,
                    submitting: false,
                    uploading: false,
                    submitted: false,
                    documentUrls: [],
                    form: this.emptyForm(),
                };
            },
            computed: {
                t() { return I18N[this.lang]; }
            },
            mounted() {
                this.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
                const browserLang = (navigator.language || '').toLowerCase();
                if (browserLang.startsWith('zh')) this.lang = 'zh';
                else if (browserLang.startsWith('en')) this.lang = 'en';
            },
            methods: {
                emptyForm() {
                    return {
                        house_no: '', full_name_en: '', full_name_th: '', nationality: '',
                        id_type: '', id_number: '', phone: '', email: '', lease_start: '', lease_end: '',
                    };
                },
                async handleFileSelect(e) {
                    const files = e.target.files;
                    if (!files?.length) return;
                    this.uploading = true;
                    for (const file of files) {
                        if (this.documentUrls.length >= 6) break;
                        try {
                            const fd = new FormData();
                            fd.append('file', file);
                            const res = await fetch(`${EDGE_FUNCTION_URL}/api/admin/audience/tenant_document_upload`, { method: 'POST', body: fd });
                            const d = await res.json();
                            if (!res.ok) throw new Error(d.error || this.t.uploadError);
                            this.documentUrls.push(d.url);
                        } catch (err) {
                            Swal.fire({ icon: 'error', title: this.t.uploadError, text: err.message, confirmButtonColor: '#db2777' });
                        }
                    }
                    this.uploading = false;
                    e.target.value = '';
                },
                async submitForm() {
                    if (!this.form.house_no || !this.form.full_name_en || !this.form.nationality || !this.form.id_type || !this.form.id_number || !this.form.phone) {
                        Swal.fire({ icon: 'warning', title: this.t.required, confirmButtonColor: '#db2777' });
                        return;
                    }
                    this.submitting = true;
                    try {
                        const { error } = await this.supabase.from('tenant_registry').insert({
                            ...this.form,
                            lease_start: this.form.lease_start || null,
                            lease_end: this.form.lease_end || null,
                            document_urls: this.documentUrls,
                            status: 'pending',
                        });
                        if (error) throw error;
                        this.submitted = true;
                    } catch (err) {
                        Swal.fire({ icon: 'error', title: this.t.submitError, text: err.message, confirmButtonColor: '#db2777' });
                    } finally {
                        this.submitting = false;
                    }
                },
                resetForm() {
                    this.form = this.emptyForm();
                    this.documentUrls = [];
                    this.submitted = false;
                },
            }
        }).mount('#app');
    </script>
</body>
</html>
