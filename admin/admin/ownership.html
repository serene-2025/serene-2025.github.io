<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ยืนยันสิทธิ์เจ้าของบ้าน - โกลเด้นแลนด์ ซีรีน</title>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Sarabun', sans-serif; background: #F8F9FB; }
    @keyframes slideUp { from { opacity:0; transform: translateY(15px); } to { opacity:1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.35s ease-out; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_v6Srw8MV1VE-K3A8alvqHQ_T_O26qVQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const EDGE_FUNCTION_URL = SUPABASE_URL + '/functions/v1/line-webhook';

    const STATUS_LABELS = {
        pending:  { icon:'⏳', label:'รอตรวจสอบ', color:'amber' },
        verified: { icon:'✅', label:'ยืนยันแล้ว', color:'emerald' },
        rejected: { icon:'❌', label:'ไม่ผ่านการตรวจสอบ', color:'rose' },
    };

    // ─── ✍️ Signature Pad (คัดลอก pattern เดิมจากระบบร้องเรียน) ───────
    const SignaturePad = ({ onReady }) => {
        const canvasRef = useRef(null);
        const drawing = useRef(false);
        const last = useRef({ x:0, y:0 });

        useEffect(() => {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const resize = () => {
                const ratio = window.devicePixelRatio || 1;
                canvas.width = canvas.offsetWidth * ratio;
                canvas.height = canvas.offsetHeight * ratio;
                ctx.scale(ratio, ratio);
                ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1e293b';
            };
            resize();
            onReady({
                clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); },
                isEmpty: () => !canvas.dataset.hasDrawn,
                toBlob: () => new Promise(resolve => canvas.toBlob(resolve, 'image/png')),
            });
        }, []);

        const pos = e => {
            const rect = canvasRef.current.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - rect.left, y: t.clientY - rect.top };
        };
        const start = e => { drawing.current = true; last.current = pos(e); };
        const move = e => {
            if (!drawing.current) return;
            e.preventDefault();
            const canvas = canvasRef.current; const ctx = canvas.getContext('2d');
            const p = pos(e);
            ctx.beginPath(); ctx.moveTo(last.current.x, last.current.y); ctx.lineTo(p.x, p.y); ctx.stroke();
            last.current = p; canvas.dataset.hasDrawn = '1';
        };
        const end = () => { drawing.current = false; };

        return (
            <canvas ref={canvasRef}
                className="w-full h-32 bg-white border-2 border-dashed border-slate-300 rounded-2xl touch-none"
                onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end}
                onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
        );
    };

    async function compressImage(file, maxWidth, quality) {
        maxWidth = maxWidth || 1280; quality = quality || 0.7;
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                canvas.toBlob(b => b ? resolve(b) : reject(new Error('compress failed')), 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = url;
        });
    }

    async function uploadToStorage(blob, prefix) {
        const fileName = 'public/' + prefix + '_' + Date.now() + '_' + Math.random().toString(36).substring(7) + '.jpg';
        const { error } = await supabaseClient.storage.from('ownership_docs').upload(fileName, blob);
        if (error) throw error;
        const { data } = supabaseClient.storage.from('ownership_docs').getPublicUrl(fileName);
        return data.publicUrl;
    }

    let _liffId = null;
    async function getLiffId() {
        if (_liffId !== null) return _liffId;
        const res = await supabaseClient.from('system_settings').select('value').eq('key', 'ownership_liff_id').maybeSingle();
        const cfg = res.data;
        _liffId = (cfg && cfg.value && cfg.value !== 'YOUR_OWNERSHIP_LIFF_ID_HERE') ? cfg.value : '';
        return _liffId;
    }

    const App = () => {
        const [activeTab, setActiveTab] = useState('submit');
        const [currentUid, setCurrentUid] = useState(null);
        const [currentProfile, setCurrentProfile] = useState(null);
        const [liffStatus, setLiffStatus] = useState('⏳ กำลังเชื่อมต่อ LINE...');

        const [house, setHouse] = useState('');
        const [fullName, setFullName] = useState('');
        const [phone, setPhone] = useState('');
        const [claimType, setClaimType] = useState('sole');
        const [ownershipShare, setOwnershipShare] = useState('');
        const [idCardLast4, setIdCardLast4] = useState('');
        const [deedBlob, setDeedBlob] = useState(null);
        const [deedPreview, setDeedPreview] = useState(null);
        const [idCardBlob, setIdCardBlob] = useState(null);
        const [idCardPreview, setIdCardPreview] = useState(null);
        const [consent, setConsent] = useState(false);
        const sigPad = useRef(null);
        const [submitting, setSubmitting] = useState(false);
        const [toast, setToast] = useState(null);

        const [myRequests, setMyRequests] = useState([]);
        const [historyLoading, setHistoryLoading] = useState(false);

        useEffect(() => {
            (async () => {
                try {
                    const liffId = await getLiffId();
                    if (!liffId) { setLiffStatus('⚠️ ยังไม่ได้ตั้งค่า LIFF — กรอกข้อมูลได้ปกติแต่จะไม่เชื่อมกับ LINE'); return; }
                    await liff.init({ liffId });
                    if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
                    const profile = await liff.getProfile();
                    setCurrentUid(profile.userId);
                    setCurrentProfile(profile);
                    setLiffStatus('✅ เชื่อมต่อ LINE: ' + (profile.displayName || ''));
                } catch (e) {
                    console.error('LIFF init error', e);
                    setLiffStatus('⚠️ เชื่อมต่อ LINE ไม่สำเร็จ — กรอกข้อมูลได้ปกติ');
                }
            })();
        }, []);

        const loadHistory = async (uid) => {
            if (!uid) return;
            setHistoryLoading(true);
            try {
                const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/ownership_verify_list_mine?uid=' + uid);
                const d = await res.json();
                if (!res.ok) throw new Error(d.error);
                setMyRequests(d.items || []);
            } catch (e) { console.error('loadHistory', e); }
            finally { setHistoryLoading(false); }
        };
        useEffect(() => { if (activeTab === 'history' && currentUid) loadHistory(currentUid); }, [activeTab, currentUid]);

        const showToast = (msg, type) => { setToast({ msg, type: type || 'success' }); setTimeout(() => setToast(null), 2800); };

        const handleFileChange = async (setBlob, setPreview) => async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setPreview(URL.createObjectURL(file));
            try { setBlob(await compressImage(file)); }
            catch (err) { console.warn('compress failed, ใช้ไฟล์เดิม', err); setBlob(file); }
        };

        const submitForm = async (e) => {
            e.preventDefault();
            if (!house.trim() || !fullName.trim()) return showToast('กรอกบ้านเลขที่และชื่อ-สกุลให้ครบค่ะ', 'error');
            if (!deedBlob) return showToast('แนบรูปโฉนดที่ดินก่อนค่ะ', 'error');
            if (!idCardBlob) return showToast('แนบรูปบัตรประชาชนก่อนค่ะ', 'error');
            if (!consent) return showToast('ต้องติ๊กยินยอมให้ตรวจสอบข้อมูลก่อนค่ะ', 'error');
            if (!sigPad.current || sigPad.current.isEmpty()) return showToast('กรุณาเซ็นชื่อยืนยันก่อนค่ะ', 'error');
            if (!currentUid) return showToast('ต้องเชื่อมต่อ LINE ก่อนส่งคำขอค่ะ', 'error');

            setSubmitting(true);
            try {
                const [deedUrl, idCardUrl, sigBlob] = await Promise.all([
                    uploadToStorage(deedBlob, 'deed'),
                    uploadToStorage(idCardBlob, 'idcard'),
                    sigPad.current.toBlob(),
                ]);
                const signatureUrl = await uploadToStorage(sigBlob, 'sig');

                const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/ownership_verify_submit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        uid: currentUid, lineDisplayName: currentProfile ? currentProfile.displayName : null,
                        linePictureUrl: currentProfile ? currentProfile.pictureUrl : null,
                        houseNumber: house.trim(), fullName: fullName.trim(), phoneNumber: phone.trim() || null,
                        claimType, ownershipShare: claimType === 'joint' ? ownershipShare.trim() : null,
                        idCardLast4: idCardLast4.trim() || null,
                        deedImageUrl: deedUrl, idCardImageUrl: idCardUrl,
                        consentGiven: true, signatureUrl,
                    }),
                });
                const rawText = await res.text();
                let result;
                try { result = JSON.parse(rawText); }
                catch (_) { throw new Error(res.status === 404 ? 'ระบบยังไม่พร้อมใช้งาน กรุณาแจ้งแอดมิน' : 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ' + res.status + ')'); }
                if (!res.ok) throw new Error(result.error || 'ส่งคำขอไม่สำเร็จ');

                showToast('🎉 ส่งคำขอยืนยันสิทธิ์เรียบร้อยแล้ว รอนิติบุคคลตรวจสอบค่ะ');
                setHouse(''); setFullName(''); setPhone(''); setOwnershipShare(''); setIdCardLast4('');
                setDeedBlob(null); setDeedPreview(null); setIdCardBlob(null); setIdCardPreview(null);
                setConsent(false); if (sigPad.current) sigPad.current.clear();
                setActiveTab('history');
                if (currentUid) loadHistory(currentUid);
            } catch (err) {
                showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
                <header className="px-5 py-5 shadow-md flex items-center justify-between rounded-b-2xl mb-1 bg-gradient-to-r from-indigo-600 to-blue-500">
                    <div className="flex items-center text-white">
                        <span className="text-3xl mr-3">🏠</span>
                        <div>
                            <h1 className="text-lg font-extrabold tracking-wide">ยืนยันสิทธิ์เจ้าของบ้าน</h1>
                            <p className="text-xs text-white/90 font-medium mt-0.5">โกลเด้นแลนด์ ซีรีน</p>
                        </div>
                    </div>
                </header>
                <p className="text-[11px] text-slate-400 text-center mb-3">{liffStatus}</p>

                <div className="flex gap-2 px-5 mb-4">
                    <button onClick={() => setActiveTab('submit')}
                        className={'flex-1 py-2.5 rounded-2xl font-bold text-sm transition-all ' + (activeTab === 'submit' ? 'bg-indigo-500 text-white shadow-md' : 'bg-white text-slate-500')}>
                        📝 ยื่นคำขอ
                    </button>
                    <button onClick={() => setActiveTab('history')}
                        className={'flex-1 py-2.5 rounded-2xl font-bold text-sm transition-all ' + (activeTab === 'history' ? 'bg-indigo-500 text-white shadow-md' : 'bg-white text-slate-500')}>
                        📋 ประวัติคำขอ
                    </button>
                </div>

                <div className="px-5 pb-8 flex-1">
                    {activeTab === 'submit' && (
                        <form onSubmit={submitForm} className="bg-white rounded-3xl shadow-lg p-6 border border-gray-100/50 space-y-5 animate-slide-up">

                            <div className="bg-amber-50 border border-amber-200 rounded-2xl p-3 text-xs text-amber-700">
                                📌 ใช้สำหรับยืนยันว่าท่านเป็น<b>เจ้าของกรรมสิทธิ์ตัวจริง</b>ตามโฉนดที่ดิน — ต่างจากการลงทะเบียนผู้อยู่อาศัยทั่วไป กรุณาเตรียมรูปโฉนดและบัตรประชาชนให้พร้อม
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">บ้านเลขที่ *</label>
                                    <input value={house} onChange={e => setHouse(e.target.value)} required placeholder="เช่น 998/27"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">เบอร์โทร</label>
                                    <input value={phone} onChange={e => setPhone(e.target.value)} type="tel" placeholder="08x-xxx-xxxx"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ชื่อ-สกุล (ตามโฉนด/บัตรประชาชน) *</label>
                                <input value={fullName} onChange={e => setFullName(e.target.value)} required placeholder="นาย/นาง/นางสาว ..."
                                    className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ประเภทกรรมสิทธิ์</label>
                                <div className="flex gap-2">
                                    <button type="button" onClick={() => setClaimType('sole')}
                                        className={'flex-1 py-2.5 rounded-2xl text-sm font-bold border-2 ' + (claimType === 'sole' ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-gray-50 text-gray-500 border-gray-200')}>
                                        👤 เจ้าของคนเดียว
                                    </button>
                                    <button type="button" onClick={() => setClaimType('joint')}
                                        className={'flex-1 py-2.5 rounded-2xl text-sm font-bold border-2 ' + (claimType === 'joint' ? 'bg-indigo-500 text-white border-indigo-500' : 'bg-gray-50 text-gray-500 border-gray-200')}>
                                        👥 เจ้าของร่วม
                                    </button>
                                </div>
                            </div>

                            {claimType === 'joint' && (
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">สัดส่วนกรรมสิทธิ์</label>
                                    <input value={ownershipShare} onChange={e => setOwnershipShare(e.target.value)} placeholder="เช่น 1/2, 50%, ร่วมกับนาย ก."
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                </div>
                            )}

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">เลขบัตรประชาชน 4 ตัวท้าย (ไม่บังคับ)</label>
                                <input value={idCardLast4} onChange={e => setIdCardLast4(e.target.value.replace(/\D/g,'').slice(0,4))} placeholder="xxxx" maxLength="4"
                                    className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none text-sm" />
                                <p className="text-[10px] text-gray-400 mt-1">เก็บแค่ 4 ตัวท้ายเพื่อความเป็นส่วนตัว ไม่ต้องกรอกเลขเต็ม</p>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">รูปโฉนดที่ดิน *</label>
                                {deedPreview ? (
                                    <div className="relative">
                                        <img src={deedPreview} className="w-full h-40 object-cover rounded-2xl border border-gray-200" />
                                        <button type="button" onClick={() => { setDeedBlob(null); setDeedPreview(null); }}
                                            className="absolute top-2 right-2 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center">✕</button>
                                    </div>
                                ) : (
                                    <label className="flex flex-col items-center justify-center h-32 border-2 border-dashed border-gray-200 rounded-2xl cursor-pointer bg-gray-50/50">
                                        <span className="text-2xl mb-1">📄</span>
                                        <span className="text-xs text-indigo-600 font-bold">อัปโหลดรูปโฉนด</span>
                                        <input type="file" accept="image/*" className="hidden" onChange={handleFileChange(setDeedBlob, setDeedPreview)} />
                                    </label>
                                )}
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">รูปบัตรประชาชน *</label>
                                {idCardPreview ? (
                                    <div className="relative">
                                        <img src={idCardPreview} className="w-full h-40 object-cover rounded-2xl border border-gray-200" />
                                        <button type="button" onClick={() => { setIdCardBlob(null); setIdCardPreview(null); }}
                                            className="absolute top-2 right-2 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center">✕</button>
                                    </div>
                                ) : (
                                    <label className="flex flex-col items-center justify-center h-32 border-2 border-dashed border-gray-200 rounded-2xl cursor-pointer bg-gray-50/50">
                                        <span className="text-2xl mb-1">🪪</span>
                                        <span className="text-xs text-indigo-600 font-bold">อัปโหลดรูปบัตรประชาชน</span>
                                        <input type="file" accept="image/*" className="hidden" onChange={handleFileChange(setIdCardBlob, setIdCardPreview)} />
                                    </label>
                                )}
                            </div>

                            <div className="bg-slate-50 border border-slate-200 rounded-2xl p-3">
                                <label className="flex items-start gap-2.5 cursor-pointer">
                                    <input type="checkbox" checked={consent} onChange={e => setConsent(e.target.checked)}
                                        className="mt-0.5 w-4 h-4 accent-indigo-500 flex-shrink-0" />
                                    <span className="text-[11px] text-slate-600 leading-relaxed">
                                        ข้าพเจ้ายินยอมให้นิติบุคคลหมู่บ้านเก็บรวบรวม ใช้ และตรวจสอบข้อมูลส่วนบุคคล เอกสารโฉนดที่ดิน
                                        และบัตรประชาชนที่แนบมา เพื่อวัตถุประสงค์ในการยืนยันสิทธิ์ความเป็นเจ้าของกรรมสิทธิ์เท่านั้น
                                        ตามพระราชบัญญัติคุ้มครองข้อมูลส่วนบุคคล (PDPA)
                                    </span>
                                </label>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">ลายเซ็นยืนยัน *</label>
                                <SignaturePad onReady={api => sigPad.current = api} />
                                <button type="button" onClick={() => sigPad.current && sigPad.current.clear()}
                                    className="text-xs text-slate-400 mt-1 underline">ล้างลายเซ็น</button>
                            </div>

                            <button type="submit" disabled={submitting}
                                className="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-blue-500 text-white rounded-2xl font-bold shadow-lg disabled:opacity-50">
                                {submitting ? '⏳ กำลังส่งคำขอ...' : '📤 ส่งคำขอยืนยันสิทธิ์'}
                            </button>
                        </form>
                    )}

                    {activeTab === 'history' && (
                        <div className="animate-slide-up space-y-3">
                            {!currentUid && (
                                <div className="text-center text-slate-400 text-sm py-10 bg-white rounded-3xl border border-slate-100/50">
                                    ต้องเชื่อมต่อ LINE ก่อนถึงจะดูประวัติได้
                                </div>
                            )}
                            {historyLoading && <div className="text-center py-10 text-slate-400">⏳ กำลังโหลด...</div>}
                            {!historyLoading && currentUid && myRequests.length === 0 && (
                                <div className="text-center text-slate-400 text-sm py-10 bg-white rounded-3xl border border-slate-100/50">
                                    ยังไม่เคยยื่นคำขอยืนยันสิทธิ์ผ่าน LINE นี้
                                </div>
                            )}
                            {myRequests.map(r => {
                                const st = STATUS_LABELS[r.status] || STATUS_LABELS.pending;
                                return (
                                    <div key={r.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-sm font-extrabold text-gray-800">🏠 {r.house_number}</span>
                                            <span className={'text-[10px] font-bold px-2 py-1 rounded-full bg-' + st.color + '-100 text-' + st.color + '-700'}>{st.icon} {st.label}</span>
                                        </div>
                                        <p className="text-xs text-gray-500 mb-1">{r.full_name} · {r.claim_type === 'joint' ? 'เจ้าของร่วม' + (r.ownership_share ? ' (' + r.ownership_share + ')' : '') : 'เจ้าของคนเดียว'}</p>
                                        {r.admin_remark && (
                                            <div className="text-xs text-indigo-600 bg-indigo-50 rounded-xl p-2.5 mb-2 mt-2">
                                                <b>หมายเหตุจากนิติบุคคล:</b> {r.admin_remark}
                                            </div>
                                        )}
                                        <p className="text-[11px] text-gray-400 mt-1">ยื่นเมื่อ {new Date(r.created_at).toLocaleDateString('th-TH')}</p>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>

                {toast && (
                    <div className={'fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl shadow-lg text-white text-sm font-bold z-50 max-w-[90%] text-center ' + (toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500')}>
                        {toast.msg}
                    </div>
                )}
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
