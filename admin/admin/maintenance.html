<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ระบบแจ้งซ่อม - โกลเด้นแลนด์ ซีรีน</title>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Sarabun', sans-serif; background: #F8F9FB; }
    @keyframes slideUp { from { opacity:0; transform: translateY(15px); } to { opacity:1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.35s ease-out; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_v6Srw8MV1VE-K3A8alvqHQ_T_O26qVQ';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const EDGE_FUNCTION_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co/functions/v1/line-webhook';

    const CATEGORIES = [
        { value: 'ไฟฟ้า / แสงสว่าง', icon: '⚡' },
        { value: 'ประปา / ท่อระบายน้ำ', icon: '💧' },
        { value: 'ถนน / ทางเท้า', icon: '🛣️' },
        { value: 'สวนสาธารณะ / ต้นไม้', icon: '🌳' },
        { value: 'คลับเฮ้าส์ / สระว่ายน้ำ', icon: '🏊' },
        { value: 'อื่นๆ (ส่วนกลาง)', icon: '📌' },
    ];

    const STATUS_LABELS = {
        pending:     { icon: '⏳', label: 'รอตรวจสอบ', color: 'amber' },
        in_progress: { icon: '🔧', label: 'กำลังดำเนินการ', color: 'blue' },
        completed:   { icon: '✅', label: 'ดำเนินการเสร็จแล้ว', color: 'emerald' },
    };

    function compressImage(file, maxWidth, quality) {
        maxWidth = maxWidth || 1280; quality = quality || 0.7;
        return new Promise((resolve, reject) => {
            const img = new Image();
            const objectUrl = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                canvas.width = width; canvas.height = height;
                canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('compress failed')), 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = objectUrl;
        });
    }

    async function uploadToStorage(blob) {
        const fileName = 'public/' + Date.now() + '_' + Math.random().toString(36).substring(7) + '.jpg';
        const { error } = await supabaseClient.storage.from('repair_images').upload(fileName, blob);
        if (error) throw error;
        const { data } = supabaseClient.storage.from('repair_images').getPublicUrl(fileName);
        return data.publicUrl;
    }

    function buildRepairConfirmFlex(payload) {
        function infoRow(label, value) {
            return {
                type: 'box', layout: 'baseline', spacing: 'sm',
                contents: [
                    { type: 'text', text: label, color: '#aaaaaa', size: 'sm', flex: 2 },
                    { type: 'text', text: String(value || '-'), wrap: true, color: '#666666', size: 'sm', flex: 4 }
                ]
            };
        }
        const bubble = {
            type: 'bubble',
            hero: payload.imageUrl ? { type: 'image', url: payload.imageUrl, size: 'full', aspectRatio: '20:13', aspectMode: 'cover' } : undefined,
            body: {
                type: 'box', layout: 'vertical', spacing: 'md',
                contents: [
                    { type: 'text', text: '🔧 แจ้งซ่อมสำเร็จ', weight: 'bold', size: 'lg' },
                    { type: 'text', text: '⏳ รอตรวจสอบ', size: 'sm', color: '#F59E0B', weight: 'bold' },
                    { type: 'separator', margin: 'lg' },
                    {
                        type: 'box', layout: 'vertical', margin: 'lg', spacing: 'sm',
                        contents: [
                            infoRow('บ้านเลขที่', payload.houseNumber),
                            infoRow('หมวดหมู่', payload.category),
                            infoRow('รายละเอียด', payload.detail),
                        ]
                    },
                    { type: 'separator', margin: 'lg' },
                    { type: 'text', size: 'xs', color: '#999999', wrap: true, margin: 'lg', text: 'นิติบุคคลจะตรวจสอบและแจ้งผลการดำเนินการให้ทราบผ่าน LINE นี้ค่ะ' }
                ]
            }
        };
        return { type: 'flex', altText: 'แจ้งซ่อมสำเร็จ - ' + payload.category, contents: bubble };
    }

    let _liffId = null;
    async function getLiffId() {
        if (_liffId !== null) return _liffId;
        const res = await supabaseClient.from('system_settings').select('value').eq('key', 'maintenance_liff_id').maybeSingle();
        const cfg = res.data;
        _liffId = (cfg && cfg.value && cfg.value !== 'YOUR_MAINTENANCE_LIFF_ID_HERE') ? cfg.value : '';
        return _liffId;
    }

    const App = () => {
        const [activeTab, setActiveTab] = useState('submit');
        const [currentUid, setCurrentUid] = useState(null);
        const [currentProfile, setCurrentProfile] = useState(null);
        const [liffStatus, setLiffStatus] = useState('⏳ กำลังเชื่อมต่อ LINE...');
        const [isInClient, setIsInClient] = useState(false);

        const [house, setHouse] = useState('');
        const [phone, setPhone] = useState('');
        const [category, setCategory] = useState(CATEGORIES[0].value);
        const [detail, setDetail] = useState('');
        const [imageBlob, setImageBlob] = useState(null);
        const [imagePreview, setImagePreview] = useState(null);
        const [submitting, setSubmitting] = useState(false);
        const [toast, setToast] = useState(null);

        const [myRequests, setMyRequests] = useState([]);
        const [historyLoading, setHistoryLoading] = useState(false);

        useEffect(() => {
            (async () => {
                try {
                    const liffId = await getLiffId();
                    if (!liffId) { setLiffStatus('⚠️ ยังไม่ได้ตั้งค่า LIFF — กรอกข้อมูลได้ปกติแต่จะไม่เชื่อมกับ LINE'); return; }

                    await liff.init({ liffId: liffId });
                    if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }

                    const profile = await liff.getProfile();
                    setCurrentUid(profile.userId);
                    setCurrentProfile(profile);
                    setIsInClient(liff.isInClient());
                    setLiffStatus('✅ เชื่อมต่อ LINE: ' + (profile.displayName || ''));
                } catch (e) {
                    console.error('LIFF init error', e);
                    setLiffStatus('⚠️ เชื่อมต่อ LINE ไม่สำเร็จ — กรอกข้อมูลได้ปกติ');
                }
            })();
        }, []);

        const loadHistory = async (uid) => {
            if (!uid) return;
            setHistoryLoading(true);
            try {
                const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/repair_request_list_mine?uid=' + uid);
                const d = await res.json();
                if (!res.ok) throw new Error(d.error);
                setMyRequests(d.items || []);
            } catch (e) {
                console.error('loadHistory', e);
            } finally {
                setHistoryLoading(false);
            }
        };

        useEffect(() => { if (activeTab === 'history' && currentUid) loadHistory(currentUid); }, [activeTab, currentUid]);

        const showToast = (msg, type) => { setToast({ msg: msg, type: type || 'success' }); setTimeout(() => setToast(null), 2500); };

        const handleImageChange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const previewUrl = URL.createObjectURL(file);
            setImagePreview(previewUrl);
            try {
                setImageBlob(await compressImage(file));
            } catch (err) {
                console.warn('compress failed, using original', err);
                setImageBlob(file);
            }
        };

        const submitForm = async (e) => {
            e.preventDefault();
            if (!house.trim() || !detail.trim()) return showToast('กรอกบ้านเลขที่และรายละเอียดให้ครบค่ะ', 'error');

            setSubmitting(true);
            try {
                let imageUrl = null;
                if (imageBlob) imageUrl = await uploadToStorage(imageBlob);

                const payload = {
                    uid: currentUid || null,
                    lineDisplayName: currentProfile ? currentProfile.displayName : null,
                    linePictureUrl: currentProfile ? currentProfile.pictureUrl : null,
                    houseNumber: house.trim(), phoneNumber: phone.trim() || null,
                    category: category, detail: detail.trim(), imageUrl: imageUrl,
                };

                const res = await fetch(EDGE_FUNCTION_URL + '/api/admin/audience/repair_request_submit', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const rawText = await res.text();
                let result;
                try { result = JSON.parse(rawText); }
                catch (_) {
                    throw new Error(res.status === 404
                        ? 'ระบบยังไม่พร้อมใช้งาน กรุณาแจ้งแอดมินให้ deploy ระบบล่าสุดก่อน'
                        : 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (HTTP ' + res.status + ')');
                }
                if (!res.ok) throw new Error(result.error || 'ส่งข้อมูลไม่สำเร็จ');

                if (isInClient) {
                    try { await liff.sendMessages([buildRepairConfirmFlex(payload)]); }
                    catch (flexErr) { console.warn('sendMessages ไม่สำเร็จ (ไม่กระทบการแจ้งซ่อม):', flexErr); }
                }

                showToast('🎉 ส่งเรื่องแจ้งซ่อมเรียบร้อยแล้ว');
                setHouse(''); setPhone(''); setDetail(''); setImageBlob(null); setImagePreview(null);
                setActiveTab('history');
                if (currentUid) loadHistory(currentUid);
            } catch (err) {
                showToast(err.message || 'เกิดข้อผิดพลาด', 'error');
            } finally {
                setSubmitting(false);
            }
        };

        return (
            <div className="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
                <header className="px-5 py-5 shadow-md flex items-center justify-between rounded-b-2xl mb-1 bg-gradient-to-r from-blue-600 to-cyan-500">
                    <div className="flex items-center text-white">
                        <span className="text-3xl mr-3">🏢</span>
                        <div>
                            <h1 className="text-lg font-extrabold tracking-wide">โกลเด้นแลนด์ ซีรีน</h1>
                            <p className="text-xs text-white/90 font-medium mt-0.5">แจ้งซ่อมออนไลน์ 24 ชม.</p>
                        </div>
                    </div>
                </header>
                <p className="text-[11px] text-slate-400 text-center mb-3">{liffStatus}</p>

                <div className="flex gap-2 px-5 mb-4">
                    <button onClick={() => setActiveTab('submit')}
                        className={'flex-1 py-2.5 rounded-2xl font-bold text-sm transition-all ' + (activeTab === 'submit' ? 'bg-blue-500 text-white shadow-md' : 'bg-white text-slate-500')}>
                        📝 แจ้งซ่อม
                    </button>
                    <button onClick={() => setActiveTab('history')}
                        className={'flex-1 py-2.5 rounded-2xl font-bold text-sm transition-all ' + (activeTab === 'history' ? 'bg-blue-500 text-white shadow-md' : 'bg-white text-slate-500')}>
                        📋 ประวัติของฉัน
                    </button>
                </div>

                <div className="px-5 pb-8 flex-1">
                    {activeTab === 'submit' && (
                        <form onSubmit={submitForm} className="bg-white rounded-3xl shadow-lg p-6 border border-gray-100/50 space-y-5 animate-slide-up">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">บ้านเลขที่ *</label>
                                    <input value={house} onChange={e => setHouse(e.target.value)} required placeholder="เช่น 998/27"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1.5">เบอร์โทร</label>
                                    <input value={phone} onChange={e => setPhone(e.target.value)} type="tel" placeholder="08x-xxx-xxxx"
                                        className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                </div>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">หมวดหมู่ปัญหา (พื้นที่ส่วนกลาง)</label>
                                <select value={category} onChange={e => setCategory(e.target.value)}
                                    className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm font-medium">
                                    {CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.icon} {c.value}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">รายละเอียด *</label>
                                <textarea value={detail} onChange={e => setDetail(e.target.value)} required rows={3}
                                    placeholder="อธิบายลักษณะปัญหาที่พบ..."
                                    className="w-full px-4 py-3 bg-gray-50 rounded-2xl border border-gray-200 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none text-sm resize-none" />
                            </div>

                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1.5">แนบรูปภาพ (ถ้ามี)</label>
                                {imagePreview ? (
                                    <div className="relative">
                                        <img src={imagePreview} className="w-full h-40 object-cover rounded-2xl border border-gray-200" />
                                        <button type="button" onClick={() => { setImageBlob(null); setImagePreview(null); }}
                                            className="absolute top-2 right-2 w-8 h-8 bg-black/50 text-white rounded-full flex items-center justify-center">✕</button>
                                    </div>
                                ) : (
                                    <label className="flex flex-col items-center justify-center h-32 border-2 border-dashed border-gray-200 rounded-2xl cursor-pointer bg-gray-50/50">
                                        <span className="text-2xl mb-1">📷</span>
                                        <span className="text-xs text-blue-600 font-bold">อัพโหลดรูปภาพจากมือถือ</span>
                                        <input type="file" accept="image/*" className="hidden" onChange={handleImageChange} />
                                    </label>
                                )}
                            </div>

                            <button type="submit" disabled={submitting}
                                className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-cyan-500 text-white rounded-2xl font-bold shadow-lg disabled:opacity-50">
                                {submitting ? '⏳ กำลังส่งข้อมูล...' : '📤 ส่งข้อมูลแจ้งซ่อม'}
                            </button>
                        </form>
                    )}

                    {activeTab === 'history' && (
                        <div className="animate-slide-up space-y-3">
                            {!currentUid && (
                                <div className="text-center text-slate-400 text-sm py-10 bg-white rounded-3xl border border-slate-100/50">
                                    ต้องเชื่อมต่อ LINE ก่อนถึงจะดูประวัติได้
                                </div>
                            )}
                            {historyLoading && <div className="text-center py-10 text-slate-400">⏳ กำลังโหลด...</div>}
                            {!historyLoading && currentUid && myRequests.length === 0 && (
                                <div className="text-center text-slate-400 text-sm py-10 bg-white rounded-3xl border border-slate-100/50">
                                    ยังไม่เคยแจ้งซ่อมผ่าน LINE นี้
                                </div>
                            )}
                            {myRequests.map(r => {
                                const st = STATUS_LABELS[r.status] || STATUS_LABELS.pending;
                                return (
                                    <div key={r.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-sm font-extrabold text-gray-800">{r.category}</span>
                                            <span className={'text-[10px] font-bold px-2 py-1 rounded-full bg-' + st.color + '-100 text-' + st.color + '-700'}>{st.icon} {st.label}</span>
                                        </div>
                                        <p className="text-sm text-gray-600 bg-gray-50 rounded-xl p-3 mb-2">{r.detail}</p>
                                        {r.admin_remark && (
                                            <div className="text-xs text-indigo-600 bg-indigo-50 rounded-xl p-2.5 mb-2">
                                                <b>ผลการดำเนินการ:</b> {r.admin_remark}
                                            </div>
                                        )}
                                        <p className="text-[11px] text-gray-400">🏠 {r.house_number} · {new Date(r.created_at).toLocaleDateString('th-TH')}</p>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>

                {toast && (
                    <div className={'fixed bottom-6 left-1/2 -translate-x-1/2 px-5 py-3 rounded-2xl shadow-lg text-white text-sm font-bold z-50 ' + (toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-500')}>
                        {toast.msg}
                    </div>
                )}
            </div>
        );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
