<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Gate - ระบบจัดการคลาวด์</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a' }
                    },
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        sarabun: ['Sarabun', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <script>
        document.documentElement.classList.add('dark');
    </script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            color: #f1f5f9;
        }
        .font-prompt { font-family: 'Prompt', sans-serif; }
        .plate-box { font-family: 'Sarabun', sans-serif; font-weight: 700; background: #fff; border: 2px solid #1e293b; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: relative; background-image: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%); color: #0f172a; display: flex; flex-direction: column; justify-content: center; align-items: center; line-height: 1; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-nav { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(51, 65, 85, 0.5); }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(15px); }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .click-scale:active { transform: scale(0.95); }
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="pb-32 transition-colors duration-300">

    <nav class="glass-nav sticky top-0 z-40 shadow-sm transition-all duration-300">
        <div class="max-w-4xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-600 p-2 rounded-xl shadow-lg shadow-blue-500/20 text-white">
                        <i data-lucide="scan-line" class="h-6 w-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold font-prompt text-white leading-tight">Smart Gate</h1>
                        <p class="text-[10px] font-bold text-blue-400 uppercase tracking-widest">Admin Control Panel</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="switchView('admin')" class="bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-slate-400 hover:text-indigo-500 transition-all click-scale shadow-sm">
                        <i data-lucide="settings" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 space-y-6">
        <div id="dashboardCard" class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-600 to-violet-700 p-6 sm:p-8 text-white shadow-2xl shadow-indigo-500/30 transition-all duration-500">
            <div class="relative z-10">
                <div class="flex flex-col sm:flex-row justify-between items-end gap-6">
                    <div>
                        <div class="flex items-center gap-2 mb-2 text-indigo-100/80">
                            <i data-lucide="database" class="w-4 h-4"></i>
                            <span class="text-xs font-bold uppercase tracking-wider" id="dashboardTitle">ฐานข้อมูลรถในระบบ</span>
                        </div>
                        <h2 class="text-5xl font-bold font-prompt tracking-tighter" id="totalCount">0</h2>
                        <p class="text-indigo-100 text-sm mt-1 font-medium opacity-90" id="dashboardSubtitle">รายการที่ลงทะเบียนทั้งหมด</p>
                    </div>
                    <div class="flex gap-3 w-full sm:w-auto" id="statsContainer">
                        <div class="flex-1 bg-white/10 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 text-center min-w-[100px]">
                            <span class="block text-2xl font-bold" id="allowCount">-</span>
                            <span class="text-[10px] text-emerald-300 font-bold uppercase tracking-wide">อนุญาต</span>
                        </div>
                        <div class="flex-1 bg-white/10 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 text-center min-w-[100px]">
                            <span class="block text-2xl font-bold" id="blockCount">-</span>
                            <span class="text-[10px] text-rose-300 font-bold uppercase tracking-wide">ระงับ</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="dashboardStatsGrid" class="hidden grid grid-cols-2 sm:grid-cols-5 gap-3 animate-fade-in-up">
            <div class="glass-panel rounded-2xl p-4 text-center shadow-sm border-l-4 border-l-emerald-500">
                <div class="text-2xl font-bold text-emerald-400" id="statSynced">-</div>
                <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">Sync กล้องแล้ว</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 text-center shadow-sm border-l-4 border-l-indigo-500">
                <div class="text-2xl font-bold text-indigo-400" id="statCars">-</div>
                <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">🚗 รถยนต์</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 text-center shadow-sm border-l-4 border-l-sky-500">
                <div class="text-2xl font-bold text-sky-400" id="statMoto">-</div>
                <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">🏍️ มอเตอร์ไซค์</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 text-center shadow-sm border-l-4 border-l-slate-400">
                <div class="text-2xl font-bold text-slate-300" id="statDeleted">-</div>
                <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">ถูกลบทั้งหมด</div>
            </div>
            <div class="glass-panel rounded-2xl p-4 text-center shadow-sm border-l-4 border-l-rose-500">
                <div class="text-2xl font-bold text-rose-400" id="statBlocked">-</div>
                <div class="text-[10px] font-bold text-slate-500 uppercase mt-1">ถูกระงับสะสม</div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 items-center w-full" id="searchContainer">
            <div class="relative flex-1 w-full group">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400 group-hover:text-indigo-500 transition-colors"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ค้นหาทะเบียน, บ้านเลขที่..." class="w-full pl-10 pr-4 py-3 rounded-2xl border border-slate-700 bg-slate-800 shadow-sm focus:ring-2 focus:ring-indigo-500 outline-none text-white">
            </div>
            <button onclick="refreshCurrentView()" class="w-full sm:w-auto p-3 bg-slate-800 text-indigo-400 border border-slate-700 rounded-2xl shadow-sm hover:bg-slate-700 transition-all click-scale flex items-center justify-center gap-2">
                <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                <span class="font-bold">โหลดข้อมูลล่าสุด</span>
            </button>
        </div>
        
        <div id="permissionTool" class="hidden w-full bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-sm">
            <label class="block text-xs font-bold text-slate-500 mb-1">บ้านเลขที่ หรือ UserID</label>
            <div class="flex gap-2">
                <input type="text" id="permCheckInput" placeholder="เช่น 998/123..." class="flex-1 px-4 py-2 rounded-lg border border-slate-600 bg-slate-900 text-sm outline-none text-white">
                <button onclick="checkPermissionManual()" class="px-6 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg shadow-sm">ตรวจสอบ</button>
            </div>
            <div id="permResult" class="mt-4 hidden p-4 rounded-xl border text-sm shadow-inner transition-all border-slate-600"></div>
        </div>

        <div id="adminAuthContainer" class="hidden w-full flex flex-col items-center justify-center py-8">
            <div class="glass-panel p-8 rounded-3xl text-center max-w-sm w-full border-slate-700">
                <h2 class="text-xl font-bold text-white mb-2">ตั้งค่าผู้ดูแลระบบ</h2>
                <button onclick="unlockAdminTools()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-bold transition-all flex items-center justify-center gap-2 click-scale">
                    <i data-lucide="key" class="w-5 h-5"></i>
                    กรอกรหัสผ่าน (PIN)
                </button>
            </div>
        </div>

        <div id="adminTools" class="hidden w-full grid grid-cols-1 sm:grid-cols-2 gap-4">
             <button onclick="document.getElementById('csvInput').click()" class="glass-panel p-5 flex flex-col items-center justify-center gap-2 hover:border-indigo-400 rounded-2xl text-center click-scale border-slate-700">
                <div class="bg-indigo-900/50 p-3 rounded-full text-indigo-400"><i data-lucide="upload-cloud" class="w-8 h-8"></i></div>
                <div><h3 class="font-bold text-slate-200">นำเข้า CSV</h3><p class="text-xs text-slate-500">Import Data</p></div>
            </button>
            <input type="file" id="csvInput" accept=".csv" class="hidden" onchange="handleImport(this)">
            <button onclick="handleExport()" class="glass-panel p-5 flex flex-col items-center justify-center gap-2 hover:border-emerald-400 rounded-2xl text-center click-scale border-slate-700">
                <div class="bg-emerald-900/50 p-3 rounded-full text-emerald-400"><i data-lucide="download-cloud" class="w-8 h-8"></i></div>
                <div><h3 class="font-bold text-slate-200">ส่งออก CSV</h3><p class="text-xs text-slate-500">Export Data</p></div>
            </button>
            <button onclick="promptUpdateAllExpiryDates()" class="glass-panel p-5 flex flex-col items-center justify-center gap-2 hover:border-amber-400 rounded-2xl text-center click-scale border-slate-700">
                <div class="bg-amber-900/50 p-3 rounded-full text-amber-400"><i data-lucide="calendar-clock" class="w-8 h-8"></i></div>
                <div><h3 class="font-bold text-slate-200">ต่ออายุทั้งหมด</h3><p class="text-xs text-slate-500">Update Expiry</p></div>
            </button>
            <button onclick="updateAllActiveCars(false)" class="glass-panel p-5 flex flex-col items-center justify-center gap-2 hover:border-indigo-400 rounded-2xl text-center click-scale border-slate-700">
                <div class="bg-indigo-900/50 p-3 rounded-full text-indigo-400"><i data-lucide="refresh-ccw" class="w-8 h-8"></i></div>
                <div><h3 class="font-bold text-slate-200">อัปเดตสถานะ (Sync)</h3><p class="text-xs text-slate-500">ส่งคำสั่งเข้ากล้องทั้งหมด</p></div>
            </button>
            <button onclick="handleAutoBlockDebtors(false)" class="glass-panel p-5 flex flex-col items-center justify-center gap-2 hover:border-amber-400 rounded-2xl text-center click-scale border-slate-700">
                <div class="bg-amber-900/50 p-3 rounded-full text-amber-400"><i data-lucide="shield-alert" class="w-8 h-8"></i></div>
                <div><h3 class="font-bold text-slate-200">สั่งบล็อกลูกหนี้</h3><p class="text-xs text-slate-500">ทำงานทันที (ค้าง 3 งวด)</p></div>
            </button>
            <button onclick="handleAutoUnlockDebtors(false)" class="glass-panel p-5 flex flex-col items-center justify-center gap-2 hover:border-blue-400 rounded-2xl text-center click-scale border-slate-700">
                <div class="bg-blue-900/50 p-3 rounded-full text-blue-400"><i data-lucide="unlock" class="w-8 h-8"></i></div>
                <div><h3 class="font-bold text-slate-200">สั่งปลดบล็อกลูกหนี้</h3><p class="text-xs text-slate-500">ทำงานทันที</p></div>
            </button>
        </div>

        <div class="sticky top-16 z-30 -mx-4 sm:-mx-6 px-4 sm:px-6 py-3 bg-[#0f172a]/95 backdrop-blur-md border-b border-slate-800 transition-all duration-300">
            <div class="flex p-1 bg-slate-800 rounded-xl w-full overflow-x-auto no-scrollbar border border-slate-700">
                <button onclick="switchView('active')" id="tabActive" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold shadow-sm bg-slate-700 text-white whitespace-nowrap">รายการปัจจุบัน</button>
                <button onclick="switchView('members')" id="tabMembers" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap">สมาชิก</button>
                <button onclick="switchView('house_stats')" id="tabHouseStats" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap">ตรวจสอบจำนวนรถ</button>
                <button onclick="switchView('permission_check')" id="tabPermissionCheck" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap">เช็คสิทธิ์</button>
                <button onclick="switchView('visitor_history')" id="tabVisitorHistory" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap">ประวัติผู้มาติดต่อ</button>
                <button onclick="switchView('deleted')" id="tabDeleted" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap">ประวัติที่ถูกลบ</button>
                <button onclick="switchView('pending_requests')" id="tabPendingRequests" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap relative">คำขอ <span id="pendingBadge" class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] px-1.5 rounded-full hidden">0</span></button>
                <button onclick="switchView('all_registrations')" id="tabAllRegistrations" class="flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap">ฐานข้อมูล (ทั้งหมด)</button>
            </div>
        </div>

        <div id="carList" class="grid grid-cols-1 gap-4"></div>
    </div>

    <div id="fabContainer" class="fixed bottom-8 right-6 z-40 transition-all duration-300">
        <button onclick="openModal()" class="flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-indigo-600 to-purple-600 text-white rounded-2xl shadow-lg hover:-translate-y-1 transition-all click-scale">
            <i data-lucide="plus" class="w-8 h-8"></i>
        </button>
    </div>

    <!-- Modals -->
    <div id="carModal" class="fixed inset-0 z-50 hidden transition-opacity duration-300" role="dialog">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
            <div class="relative rounded-3xl bg-slate-850 shadow-2xl w-full max-w-lg border border-slate-700">
                <div class="bg-slate-800 px-6 py-5 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-white" id="modalTitle">ลงทะเบียนรถ</h3>
                    <button onclick="closeModal()" class="text-slate-400 p-2 rounded-full hover:bg-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="px-6 py-6 space-y-6">
                    <form id="modalForm">
                        <input type="hidden" id="editId">
                        <input type="hidden" id="originalDeletedId">
                        <div class="grid grid-cols-2 gap-3 mb-5">
                            <input type="text" id="plateNumber" required class="plate-box w-full py-3 text-center text-2xl uppercase" placeholder="1กข9999">
                            <input type="text" id="provinceInput" class="w-full py-3 px-4 rounded-xl border bg-slate-700 border-slate-600 text-center text-white outline-none focus:border-indigo-500" placeholder="ระบุจังหวัด">
                        </div>
                        <div class="grid grid-cols-2 gap-5 mb-5">
                            <select id="carTypeInput" class="w-full rounded-xl border py-3 px-4 bg-slate-700 border-slate-600 text-sm text-white outline-none">
                                <option value="car">🚗 รถยนต์ (ซิงค์)</option>
                                <option value="motorcycle">🏍️ มอไซค์ (ไม่ซิงค์)</option>
                            </select>
                            <select id="listTypeInput" class="w-full rounded-xl border py-3 px-4 bg-slate-700 border-slate-600 text-sm text-white outline-none">
                                <option value="allowlist">✅ อนุญาต</option>
                                <option value="blocklist">⛔ ระงับ</option>
                            </select>
                        </div>
                        <div class="mb-5">
                            <input type="text" id="houseNumber" class="w-full rounded-xl border py-3 px-4 bg-slate-700 border-slate-600 text-sm text-white outline-none focus:border-indigo-500" placeholder="บ้านเลขที่">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="date" id="startDateInput" class="w-full rounded-xl border py-2 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none">
                            <input type="date" id="endDateInput" class="w-full rounded-xl border py-2 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none">
                        </div>
                    </form>
                </div>
                <div class="bg-slate-800 px-6 py-4 flex justify-end gap-3 border-t border-slate-700">
                    <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl font-semibold text-slate-300 hover:bg-slate-700">ยกเลิก</button>
                    <button onclick="saveData()" id="modalSaveBtn" class="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold click-scale hover:bg-indigo-700">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Reg Modal -->
    <div id="regModal" class="fixed inset-0 z-50 hidden transition-opacity duration-300" role="dialog">
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeRegModal()"></div>
        <div class="fixed inset-0 z-10 overflow-y-auto flex items-center justify-center p-4">
            <div class="relative rounded-3xl bg-slate-850 shadow-2xl w-full max-w-lg border border-slate-700">
                <div class="bg-slate-800 px-6 py-5 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="text-lg font-bold text-white">แก้ไขข้อมูลคำขอลงทะเบียน</h3>
                    <button onclick="closeRegModal()" class="text-slate-400 p-2 rounded-full hover:bg-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="px-6 py-6 space-y-4 max-h-[70vh] overflow-y-auto">
                    <input type="hidden" id="regEditId">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="regPlateInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm uppercase text-white outline-none" placeholder="ทะเบียน">
                        <input type="text" id="regProvinceInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none" placeholder="จังหวัด">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="regHouseInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none" placeholder="บ้านเลขที่">
                        <input type="text" id="regPhoneInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none" placeholder="เบอร์โทร">
                    </div>
                    <input type="text" id="regFullnameInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none" placeholder="ชื่อ-สกุล">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="regCarTypeInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none"><option value="รถยนต์">รถยนต์</option><option value="รถจักรยานยนต์">มอเตอร์ไซค์</option></select>
                        <select id="regStatusInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none"><option value="pending">รอพิจารณา</option><option value="renewal_pending">รอพิจารณา (ต่ออายุ)</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ปฏิเสธแล้ว</option></select>
                    </div>
                    <textarea id="regNoteInput" class="w-full rounded-xl border py-2.5 px-3 bg-slate-700 border-slate-600 text-sm text-white outline-none" placeholder="หมายเหตุ"></textarea>
                </div>
                <div class="bg-slate-800 px-6 py-4 flex justify-end gap-3 border-t border-slate-700">
                    <button onclick="closeRegModal()" class="px-5 py-2.5 rounded-xl font-semibold text-slate-300 hover:bg-slate-700">ยกเลิก</button>
                    <button onclick="saveRegData()" class="px-6 py-2.5 rounded-xl bg-fuchsia-600 text-white font-bold click-scale hover:bg-fuchsia-700">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

            isLoaded = { active: false, members: false, pending_requests: false, all_registrations: false, deleted: false, visitor_history: false };
            if (currentView === 'members') fetchMembers();

            tabs.forEach(t => { if(t) t.className = "flex-shrink-0 flex-1 px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-slate-200 whitespace-nowrap" });

            else if (view === 'house_stats') { updateDashboardStyle('from-emerald-600', 'to-teal-700', 'ตรวจสอบจำนวนรถ', 'บ้านรถเกิน 1 คัน', false); document.getElementById('fabContainer').classList.add('translate-y-24', 'opacity-0'); fetchCars(); }

            else if (view === 'members') { updateDashboardStyle('from-pink-500', 'to-rose-500', 'รายชื่อสมาชิก', 'จัดการโหมดตรวจสอบสิทธิ์', false); document.getElementById('fabContainer').classList.add('translate-y-24', 'opacity-0'); searchContainer.classList.remove('hidden'); fetchMembers(); }
            else if (view === 'pending_requests') { updateDashboardStyle('from-violet-500', 'to-fuchsia-600', 'คำขอลงทะเบียน', 'พิจารณาอนุมัติรถ', false); document.getElementById('fabContainer').classList.add('translate-y-24', 'opacity-0'); fetchPendingRequests(); }

        }

        function updateDashboardStyle(fClass, tClass, title, subtitle, showStats) {
            dashboardCard.className = `relative overflow-hidden rounded-3xl bg-gradient-to-br p-6 sm:p-8 text-white shadow-2xl transition-all duration-500 ${fClass} ${tClass}`;
            dashboardTitle.textContent = title; dashboardSubtitle.textContent = subtitle;
            if (showStats) statsContainer.classList.remove('hidden'); else statsContainer.classList.add('hidden');
        }

        async function unlockAdminTools() {
            const { value: pin } = await Swal.fire({ title: 'ยืนยันรหัสผ่าน', input: 'password', showCancelButton: true, confirmButtonText: 'ตกลง', background: '#1e293b', color: '#fff' });
            if (pin === '9999') { adminAuthContainer.classList.add('hidden'); adminTools.classList.remove('hidden'); Swal.fire({ icon: 'success', title: 'ปลดล็อกสำเร็จ', showConfirmButton: false, timer: 1000, background: '#1e293b', color: '#fff' }); }

        async function fetchCars() {
            if ((currentView === 'active' || currentView === 'house_stats') && isLoaded.active) return (currentView === 'house_stats') ? renderHouseStats(allCarsData) : handleSearch();
            if (currentView === 'deleted' && isLoaded.deleted) return handleSearch();
            if (currentView === 'visitor_history' && isLoaded.visitor_history) return handleSearch();

            try {
                let q;
                if (currentView === 'active' || currentView === 'house_stats') q = supabaseClient.from('allowed_cars').select('id, plate_number, province, house_number, list_type, start_date, end_date, status').neq('status', 'pending_delete').order('created_at', { ascending: false }).limit(300);
                else if (currentView === 'visitor_history') q = supabaseClient.from('visitor_history').select('*').order('archived_at', { ascending: false }).limit(200);
                else if (currentView === 'deleted') q = supabaseClient.from('deleted_cars').select('*').order('deleted_at', { ascending: false }).limit(200);
                else return;

                const { data, error } = await q; if (error) throw error; allCarsData = data;
                
                if (currentView === 'active' || currentView === 'house_stats') isLoaded.active = true;
                if (currentView === 'deleted') isLoaded.deleted = true;
                if (currentView === 'visitor_history') isLoaded.visitor_history = true;

                if (currentView === 'house_stats') renderHouseStats(data); else handleSearch();

                    supabaseClient.from('allowed_cars').select('id', { count: 'exact', head: true }).neq('status', 'pending_delete').ilike('province', '%(มอไซค์)%'),

                document.getElementById('statSynced').textContent = s.count ?? '-'; document.getElementById('statCars').textContent = c.count ?? '-'; document.getElementById('statMoto').textContent = m.count ?? '-'; document.getElementById('statDeleted').textContent = d.count ?? '-'; document.getElementById('statBlocked').textContent = b.count ?? '-';
            } catch (err) { }

        // 🟢 อัปเดต UI ตรวจสอบจำนวนรถ
        function renderHouseStats(data) {
            const houses = {};
            data.forEach(c => { const h = c.house_number?.trim() || 'ไม่ระบุ'; if(!houses[h]) houses[h]=[]; houses[h].push(c); });

                                <div class="font-bold text-slate-800 dark:text-slate-200">${c.plate_number}</div>
                                <div class="text-[10px] text-slate-500">${provStr}</div>
                            </div>
                        </div>
                        <span class="text-xs text-slate-500 dark:text-slate-400 font-mono">${formatDate(c.end_date)}</span>
                    </div>`;
                }).join('');
                
                const div = document.createElement('div'); 
                div.className = "bg-slate-800 rounded-2xl p-5 shadow-sm slide-up border border-slate-700 border-l-4 border-l-emerald-500";
                div.style.animationDelay = `${Math.min(i*50, 500)}ms`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4">

                        </div>

                            ${cs.length} คัน
                        </div>

                carList.appendChild(div);
            });
        }

        function handleSearch() {
            if (currentView === 'house_stats' || currentView === 'permission_check') return;
            const q = document.getElementById('searchInput').value.toLowerCase().trim(); let f;
            if (currentView === 'members') { f = q ? allCarsData.filter(m => (m.fullname||'').toLowerCase().includes(q) || (m.house_no||'').toLowerCase().includes(q)) : allCarsData; renderMembers(f); }
            else if (currentView === 'all_registrations') { f = q ? allRegistrationsData.filter(r => (r.plate_number||'').toLowerCase().includes(q) || (r.house_number||'').toLowerCase().includes(q) || (r.fullname||'').toLowerCase().includes(q)) : allRegistrationsData; renderAllRegistrationsList(f); }
            else { f = q ? allCarsData.filter(c => (c.plate_number||'').toLowerCase().includes(q) || (c.house_number||'').toLowerCase().includes(q)) : allCarsData; renderList(f); }
        }

        function renderList(cars) {
            totalCountEl.textContent = cars.length;
            if (currentView === 'active') { allowCountEl.textContent = cars.filter(c => c.list_type !== 'blocklist').length; blockCountEl.textContent = cars.length - parseInt(allowCountEl.textContent); }
            carList.innerHTML = '';
            
            if (!cars.length) return carList.innerHTML += `<div class="text-center py-20 text-slate-400">ไม่พบข้อมูล</div>`;

            cars.forEach((c, i) => {
                const isBlock = c.list_type === 'blocklist'; const isMoto = c.province && c.province.includes('(มอไซค์)');
                const iconStr = isMoto ? '🏍️' : '🚗'; const displayProv = isMoto ? c.province.replace(' (มอไซค์)', '').trim() : (c.province || 'กทม');
                const safe = JSON.stringify(c).replace(/"/g, '&quot;'); const type = isBlock ? "BLOCKLIST" : "ALLOWED";
                const style = isBlock ? "bg-rose-500/20 text-rose-400 border-rose-500/30" : "bg-indigo-500/20 text-indigo-400 border-indigo-500/30";
                const date = currentView === 'active' ? `${formatDate(c.start_date)} - ${formatDate(c.end_date)}` : `${formatDate(c.deleted_at || c.start_date)}`;
                
                let btns = '';
                if(currentView==='active') btns = `<button onclick='handleEdit(${safe})' class="flex-1 p-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg transition-colors"><i data-lucide="pencil" class="w-4 h-4 mx-auto"></i></button><button onclick="handleDelete(${c.id})" class="flex-1 p-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-lg transition-colors"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></button>`;
                else if (currentView === 'deleted') btns = `<button onclick='handleRestoreModal(${safe})' class="flex-1 p-2 bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/20 text-emerald-400 rounded-lg font-bold text-xs transition-colors">กู้คืน</button><button onclick="handlePermanentDelete(${c.id})" class="flex-1 p-2 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 text-rose-400 rounded-lg font-bold text-xs transition-colors">ลบถาวร</button>`;
                else btns = `<button onclick='handleRestoreModal(${safe})' class="flex-1 w-full p-2 bg-emerald-500/10 border border-emerald-500/20 hover:bg-emerald-500/20 text-emerald-400 rounded-lg font-bold text-xs transition-colors">นำกลับมาใช้</button>`;

                const div = document.createElement('div'); 
                div.className = `bg-slate-800 rounded-2xl p-4 shadow-sm slide-up border-l-4 border-y border-r border-slate-700 ${isBlock?'border-l-rose-500':'border-l-indigo-500'}`; 
                div.style.animationDelay = `${Math.min(i*50,500)}ms`;
                div.innerHTML = `
                    <div class="flex flex-col sm:flex-row gap-4 items-center">
                        <div class="plate-box w-28 h-14 flex flex-col justify-center items-center shadow-sm relative text-slate-900 border-2 border-slate-300">
                            <span class="text-xl font-bold leading-none tracking-tight">${c.plate_number}</span>
                            <span class="text-[9px] leading-none mt-1 text-slate-600">${displayProv}</span>
                        </div>
                        <div class="flex-1 w-full text-center sm:text-left">
                            <div class="font-bold text-slate-200">${!isMoto ? iconStr : ''} บ้าน ${c.house_number||'-'} <span class="text-[9px] px-1.5 rounded border ${style} ml-1">${type}</span></div>
                            <div class="text-xs text-slate-400 mt-1.5"><i data-lucide="calendar" class="w-3 h-3 inline mb-0.5"></i> ${date}</div>
                        </div>
                        <div class="flex gap-2 w-full sm:w-auto">${btns}</div>
                    </div>`;
                carList.appendChild(div);
            });
            lucide.createIcons();
        }

        async function fetchPendingRequests() {
            if (isLoaded.pending_requests) return currentView === 'pending_requests' && renderPendingRequests(pendingRequestsData);
            try {
                const { data, error } = await supabaseClient.from('car_registrations').select('*').in('status', ['pending', 'renewal_pending']).order('created_at', { ascending: false }).limit(100); 
                if (error) throw error; pendingRequestsData = data; isLoaded.pending_requests = true;
                if(data.length > 0) { pendingBadge.textContent = data.length; pendingBadge.classList.remove('hidden'); } else pendingBadge.classList.add('hidden');

        // 🟢 อัปเดต UI คำขอลงทะเบียน และเพิ่มปุ่มดูรูป
        function renderPendingRequests(reqs) {
            totalCountEl.textContent = reqs.length; carList.innerHTML = '';
            if (reqs.length === 0) return carList.innerHTML = `<div class="text-center py-20 text-slate-400">ไม่มีคำขอลงทะเบียนใหม่</div>`;
            
            reqs.forEach((r, i) => {
                const safe = JSON.stringify(r).replace(/"/g, '&quot;'); 
                const isRenew = r.status === 'renewal_pending';
                const badgeColor = isRenew ? 'bg-amber-500/20 text-amber-400' : 'bg-fuchsia-500/20 text-fuchsia-400';
                const badgeText = isRenew ? 'ขอต่ออายุ (ใหม่)' : 'รอพิจารณา (ใหม่)';

                const imgBtn = r.image_url 
                    ? `<button onclick="viewCarImage('${r.image_url}')" class="w-full bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 py-2.5 rounded-xl text-sm font-bold border border-sky-500/20 transition-all mt-2 mb-3"><i data-lucide="image" class="w-4 h-4 inline-block mb-0.5"></i> ดูรูปรถที่แนบมา</button>`
                    : '';

                const div = document.createElement('div'); 
                div.className = `bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-700 mb-4 slide-up border-l-4 ${isRenew?'border-l-amber-500':'border-l-fuchsia-500'}`; 
                div.style.animationDelay = `${Math.min(i*50,500)}ms`;
                div.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between items-start mb-3">
                            <div class="bg-white text-slate-900 px-3 py-1.5 rounded-lg font-bold font-mono shadow-sm text-base">
                                ${r.plate_number}<br><span class="text-[9px] font-normal text-slate-500">${r.province || ''}</span>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${badgeColor}">${badgeText}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-sm mt-1 mb-2 text-slate-400">
                            <div><span class="text-xs">🏠 บ้าน:</span> <span class="text-slate-200 font-medium">${r.house_number || '-'}</span></div>
                            <div><span class="text-xs">👤 ชื่อ:</span> <span class="text-slate-200 font-medium">${r.fullname || '-'}</span></div>
                            <div><span class="text-xs">🚗 ชนิด:</span> <span class="text-slate-200 font-medium">${r.car_type || '-'}</span></div>
                            <div><span class="text-xs">📱 โทร:</span> <span class="text-blue-400 font-medium">${r.phone || '-'}</span></div>
                        </div>
                        ${r.renewal_note ? `<div class="bg-amber-900/30 border border-amber-700/50 rounded-lg px-3 py-2 text-xs text-amber-300">📝 หมายเหตุ: <b>${r.renewal_note}</b></div>` : ''}
                        ${imgBtn}
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button onclick='approveRegistration(${safe})' class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-sm font-bold transition-all"><i data-lucide="check-circle" class="w-4 h-4 inline-block mb-0.5"></i> อนุมัติ</button>
                            <button onclick="rejectRegistration('${r.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 py-2 rounded-xl text-sm font-bold border border-rose-500/20 transition-all">ไม่อนุมัติ</button>
                            <button onclick='handleEditRegistration(${safe})' class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-xl text-sm font-bold transition-all"><i data-lucide="edit-2" class="w-4 h-4 inline-block mb-0.5"></i> แก้ไข</button>
                            <button onclick="handleDeleteRegistrationRecord('${r.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 py-2 rounded-xl text-sm font-bold border border-rose-500/20 transition-all"><i data-lucide="trash-2" class="w-4 h-4 inline-block mb-0.5"></i> ลบ</button>
                        </div>
                    </div>`;
                carList.appendChild(div);
            });
            lucide.createIcons();
        }

        async function approveRegistration(r) {
            const d = getThaiDate(); d.setFullYear(d.getFullYear() + 1); const end = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            let sStat = 'pending', fProv = r.province; const isMoto = r.car_type === 'รถจักรยานยนต์';
            if (isMoto) { sStat = 'ignore_sync'; fProv = r.province.includes('(มอไซค์)') ? r.province : r.province + ' (มอไซค์)'; }
            const { data: ext } = await supabaseClient.from('allowed_cars').select('id, start_date, end_date').eq('plate_number', r.plate_number).eq('house_number', r.house_number).maybeSingle();
            
            const { value: v } = await Swal.fire({ title: 'อนุมัติ?', html: `<input type="date" id="swal-start" value="${ext?.start_date || getThaiYMD()}" class="swal2-input bg-slate-800 text-white border-slate-600"><input type="date" id="swal-end" value="${ext?.end_date || end}" class="swal2-input bg-slate-800 text-white border-slate-600">`, showCancelButton: true, background: '#1e293b', color: '#fff', preConfirm: () => ({ s: document.getElementById('swal-start').value, e: document.getElementById('swal-end').value }) });
            if (!v) return; Swal.fire({ title: 'กำลังบันทึก...', background: '#1e293b', color: '#fff', didOpen: () => Swal.showLoading() });

            try {
                let aId = ext?.id || null;
                if (ext) { await supabaseClient.from('allowed_cars').update({ province: fProv, list_type: 'allowlist', start_date: v.s, end_date: v.e, status: isMoto ? 'ignore_sync' : 'pending_update' }).eq('id', ext.id); aId = ext.id; } 
                else { const { data: n } = await supabaseClient.from('allowed_cars').insert([{ plate_number: r.plate_number, province: fProv, house_number: r.house_number, list_type: 'allowlist', start_date: v.s, end_date: v.e, status: sStat }]).select().maybeSingle(); aId = n?.id || null; }
                await supabaseClient.from('car_registrations').update({ status: 'approved', start_date: v.s, end_date: v.e, allowed_car_id: aId ? String(aId) : null, renewal_note: null }).eq('id', r.id);
                Swal.fire({ icon: 'success', title: 'สำเร็จ!', background: '#1e293b', color: '#fff' }); refreshCurrentView();
            } catch(e) { Swal.fire({title: 'Error', text: e.message, icon: 'error', background: '#1e293b', color: '#fff'}); }
        }

        async function rejectRegistration(id) {
            const { value: c } = await Swal.fire({ title: 'ปฏิเสธคำขอ?', icon: 'warning', showCancelButton: true, background: '#1e293b', color: '#fff' });
            if(c) { await supabaseClient.from('car_registrations').update({ status: 'rejected' }).eq('id', id); refreshCurrentView(); }
        }

        async function fetchAllRegistrations() {
            if (isLoaded.all_registrations) return handleSearch();
            try {
                // 🟢 ดึงข้อมูล image_url มาด้วย เพื่อให้ปุ่มมี url ไปเปิด
                const { data, error } = await supabaseClient.from('car_registrations').select('id, created_at, plate_number, province, house_number, fullname, phone, car_type, status, renewal_note, image_url, line_display_name, line_picture_url').order('created_at', { ascending: false }).limit(300);
                if (error) throw error; allRegistrationsData = data || []; isLoaded.all_registrations = true; handleSearch();
            } catch (err) { carList.innerHTML = `<div class="text-center py-20 text-rose-400">Error: ${err.message}</div>`; }
        }

        // 🟢 อัปเดต UI ฐานข้อมูลรถทั้งหมด เพิ่มปุ่มดูรูปรถ
        function renderAllRegistrationsList(list) {
            totalCountEl.textContent = list.length; carList.innerHTML = '';
            if (!list.length) return carList.innerHTML = `<div class="text-center py-20 text-slate-400">ไม่พบข้อมูล</div>`;

            const statusMap = {
                pending:         { label: 'รอพิจารณา (ใหม่)', badge: 'bg-fuchsia-500/20 text-fuchsia-400', border: 'border-l-fuchsia-500' },
                renewal_pending: { label: 'รอพิจารณา (ต่ออายุ)', badge: 'bg-amber-500/20 text-amber-400', border: 'border-l-amber-500' },
                approved:        { label: '✅ อนุมัติแล้ว', badge: 'bg-emerald-500/20 text-emerald-400', border: 'border-l-emerald-500' },
                rejected:        { label: '❌ ปฏิเสธแล้ว', badge: 'bg-rose-500/20 text-rose-400', border: 'border-l-rose-500' }
            };

            list.forEach((req, i) => {
                const safe = JSON.stringify(req).replace(/"/g, '&quot;');
                const st = statusMap[req.status] || { label: req.status || '-', badge: 'bg-slate-700 text-slate-300', border: 'border-l-slate-500' };

                const imgBtn = req.image_url 
                    ? `<button onclick="viewCarImage('${req.image_url}')" class="w-full bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 py-2.5 rounded-xl text-sm font-bold border border-sky-500/20 transition-all mt-2 mb-3"><i data-lucide="image" class="w-4 h-4 inline-block mb-0.5"></i> ดูรูปรถที่แนบมา</button>`
                    : '';

                const div = document.createElement('div');
                div.className = `bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-700 mb-4 slide-up border-l-4 ${st.border}`;
                div.style.animationDelay = `${Math.min(i*50,500)}ms`;
                
                div.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between items-start mb-3">
                            <div class="bg-white text-slate-900 px-3 py-1.5 rounded-lg font-bold font-mono shadow-sm text-base">
                                ${req.plate_number}<br><span class="text-[9px] font-normal text-slate-500">${req.province || ''}</span>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${st.badge}">${st.label}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-sm mt-1 mb-2 text-slate-400">
                            <div><span class="text-xs">🏠 บ้าน:</span> <span class="text-slate-200 font-medium">${req.house_number || '-'}</span></div>
                            <div><span class="text-xs">👤 ชื่อ:</span> <span class="text-slate-200 font-medium">${req.fullname || '-'}</span></div>
                            <div><span class="text-xs">🚗 ชนิด:</span> <span class="text-slate-200 font-medium">${req.car_type || '-'}</span></div>
                            <div><span class="text-xs">📱 โทร:</span> <span class="text-blue-400 font-medium">${req.phone || '-'}</span></div>
                        </div>
                        ${imgBtn}
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <button onclick='handleEditRegistration(${safe})' class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-xl text-sm font-bold transition-all"><i data-lucide="edit-2" class="w-4 h-4 inline-block mb-0.5"></i> แก้ไข</button>
                            <button onclick="handleDeleteRegistrationRecord('${req.id}')" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 py-2.5 rounded-xl text-sm font-bold border border-rose-500/20 transition-all"><i data-lucide="trash-2" class="w-4 h-4 inline-block mb-0.5"></i> ลบ</button>
                        </div>
                    </div>
                `;
                carList.appendChild(div);
            });
            lucide.createIcons();
        }

        window.handleEditRegistration = (data) => {
            regEditIdInput.value = data.id; regPlateInput.value = data.plate_number || ''; regProvinceInput.value = data.province || ''; regHouseInput.value = data.house_number || ''; regPhoneInput.value = data.phone || ''; regFullnameInput.value = data.fullname || ''; regCarTypeInput.value = data.car_type === 'รถจักรยานยนต์' ? 'รถจักรยานยนต์' : 'รถยนต์'; regStatusInput.value = data.status || 'pending'; regNoteInput.value = data.renewal_note || ''; regModal.classList.remove('hidden');
        };

        function closeRegModal() { regModal.classList.add('hidden'); }
        async function saveRegData() {
            try { await supabaseClient.from('car_registrations').update({ plate_number: regPlateInput.value.trim().toUpperCase(), province: regProvinceInput.value.trim(), house_number: regHouseInput.value.trim(), phone: regPhoneInput.value.trim(), fullname: regFullnameInput.value.trim(), car_type: regCarTypeInput.value, status: regStatusInput.value, renewal_note: regNoteInput.value.trim() || null }).eq('id', regEditIdInput.value); closeRegModal(); Swal.fire({title: 'สำเร็จ', text: 'บันทึกข้อมูลเรียบร้อย', icon: 'success', background: '#1e293b', color: '#fff'}); refreshCurrentView(); } catch (e) {}
        }
        window.handleDeleteRegistrationRecord = async (id) => {
            const { value: p } = await Swal.fire({ title: 'ยืนยันลบข้อมูล?', input: 'password', showCancelButton: true, background: '#1e293b', color: '#fff' });
            if (p === '9999') { await supabaseClient.from('car_registrations').delete().eq('id', id); refreshCurrentView(); }
        };

        async function fetchMembers() {
             if (isLoaded.members) return handleSearch();
             try { const { data } = await supabaseClient.from('userhome').select('uid, fullname, line_name, house_no, check_mode').order('created_at', { ascending: false }).limit(500); allCarsData = data; isLoaded.members = true; handleSearch(); } catch (err) {}
        }

        function renderMembers(members) {
            totalCountEl.textContent = members.length; carList.innerHTML = '';
            if (members.length === 0) return carList.innerHTML += `<div class="text-center py-20 text-slate-400">ไม่พบสมาชิก</div>`;
            members.forEach((m, i) => {
                const isMan = m.check_mode === 'เมนวน'; const div = document.createElement('div'); div.className = `bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-sm slide-up border-l-4 ${isMan ? 'border-l-indigo-500' : 'border-l-slate-600'}`; div.style.animationDelay = `${Math.min(i * 50, 500)}ms`;
                div.innerHTML = `<div class="flex items-center justify-between gap-3"><div class="min-w-0"><h3 class="font-bold text-sm text-slate-200 truncate">${m.fullname || 'ไม่ระบุชื่อ'}</h3><div class="mt-1"><span class="bg-slate-700 px-2 py-0.5 rounded text-[10px] font-bold text-slate-300">🏠 ${m.house_no || '-'}</span></div></div><div><label class="inline-flex items-center cursor-pointer"><input type="checkbox" class="sr-only peer toggle-checkbox" onchange="toggleMemberMode('${m.uid}', this.checked ? 'เมนวน' : 'ออโต้')" ${isMan ? 'checked' : ''}><div class="relative w-11 h-6 bg-slate-600 rounded-full peer peer-checked:bg-indigo-600 after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:after:translate-x-full"></div></label></div></div>`;
                carList.appendChild(div);
            });
        }
        async function toggleMemberMode(uid, newMode) { try { await supabaseClient.from('userhome').update({ check_mode: newMode }).eq('uid', uid); refreshCurrentView(); } catch (e) { } }

        function openModal(isEdit=false, data=null, isRestore=false) {
            modalForm.reset(); editIdInput.value=''; originalDeletedIdInput.value=''; listTypeInput.value='allowlist'; setDefaultDates(); carTypeInput.value = 'car';
            if(isEdit) { const isMoto = data.province && data.province.includes('(มอไซค์)'); carTypeInput.value = isMoto ? 'motorcycle' : 'car'; plateInput.value=data.plate_number; provinceInput.value = isMoto ? data.province.replace(' (มอไซค์)', '').trim() : (data.province||''); houseInput.value=data.house_number||''; listTypeInput.value=data.list_type||'allowlist'; startDateInput.value=data.start_date; endDateInput.value=data.end_date; editIdInput.value=isRestore?'':data.id; originalDeletedIdInput.value=isRestore?data.id:''; }
            carModal.classList.remove('hidden');
        }
        function closeModal() { carModal.classList.add('hidden'); }
        function formatDate(d) { return d ? new Date(d).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'2-digit'}) : '-'; }
        
        async function saveData() {
            const plate = plateInput.value.trim().toUpperCase(); if(!plate) return;
            let fProv = provinceInput.value.trim(); let fStat = 'pending';
            if(carTypeInput.value === 'motorcycle') { if(!fProv.includes('(มอไซค์)')) fProv += ' (มอไซค์)'; fStat = 'ignore_sync'; }
            const p = { plate_number: plate, province: fProv, house_number: houseInput.value.trim(), list_type: listTypeInput.value, start_date: startDateInput.value, end_date: endDateInput.value };
            try {
                if (p.list_type === 'blocklist') { const {value:pin} = await Swal.fire({title:'ยืนยันระงับ', input:'password', showCancelButton:true, background: '#1e293b', color: '#fff'}); if(pin!=='9999') return; await supabaseClient.from('deleted_cars').insert([p]); if(editIdInput.value) await supabaseClient.from('allowed_cars').update({status:'pending_delete'}).eq('id', editIdInput.value); else await supabaseClient.from('allowed_cars').insert([{...p, status:'pending_delete'}]); } 
                else { if(editIdInput.value) await supabaseClient.from('allowed_cars').update({...p, status: (carTypeInput.value === 'motorcycle' ? 'ignore_sync' : 'pending_update')}).eq('id', editIdInput.value); else await supabaseClient.from('allowed_cars').insert([{...p, status: fStat}]); }
                if(originalDeletedIdInput.value && currentView === 'deleted') await supabaseClient.from('deleted_cars').delete().eq('id', originalDeletedIdInput.value);
                closeModal(); Swal.fire({title: 'สำเร็จ', text: 'บันทึกเรียบร้อย', icon: 'success', background: '#1e293b', color: '#fff'}); refreshCurrentView();
            } catch (err) { }
        }

        window.handleEdit = (d) => openModal(true, d, false);
        window.handleRestoreModal = (d) => openModal(true, d, true);
        window.handleDelete = async (id) => { const {value:pin} = await Swal.fire({title:'ยืนยันลบ', input:'password', showCancelButton:true, background: '#1e293b', color: '#fff'}); if(pin==='9999') { try { const {data} = await supabaseClient.from('allowed_cars').select('*').eq('id', id).single(); if(data) await supabaseClient.from('deleted_cars').insert([{...data}]); await supabaseClient.from('allowed_cars').update({status:'pending_delete'}).eq('id', id); refreshCurrentView(); } catch (err) {} } };
        window.handlePermanentDelete = async (id) => { const {value:pin} = await Swal.fire({ title: 'ยืนยันลบถาวร?', input: 'password', showCancelButton: true, background: '#1e293b', color: '#fff' }); if(pin === '9999') { try { await supabaseClient.from('deleted_cars').delete().eq('id', id); refreshCurrentView(); } catch(err) { } } };

        dashboardStatsGrid.classList.remove('hidden'); loadDashboardStats(); fetchCars(); fetchPendingRequests();
    </script>
</body>
</html>
