<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visitor Pass - Goldenland Serene</title>
    
    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #06b6d4;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        .card {
            background: var(--glass-bg);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            position: relative;
        }

        /* Profile Section */
        .profile-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #334155;
        }

        /* Form Elements */
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #64748b; }
        
        input {
            width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 1.1rem; text-align: center; font-family: 'Kanit', sans-serif;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: var(--primary); }

        .btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: 'Kanit', sans-serif; transition: 0.3s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-line { background: #06c755; color: white; margin-top: 10px; }
        .btn-save { background: #0ea5e9; color: white; margin-top: 10px; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Ticket UI */
        .ticket-wrapper {
            background: white; border: 1px solid #e2e8f0; border-radius: 16px;
            padding: 20px; margin-top: 20px; display: none;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <!-- ส่วนแสดงโปรไฟล์ LINE -->
    <div id="liff-loading">
        <i class="fa-solid fa-circle-notch fa-spin"></i> กำลังเชื่อมต่อ LINE...
    </div>
    
    <div id="user-profile" class="hidden profile-area">
        <img id="userPicture" src="https://via.placeholder.com/80" class="profile-img" crossorigin="anonymous">
        <div class="profile-name">สวัสดี, <span id="userName">User</span></div>
    </div>

    <!-- ฟอร์มสร้างรหัส -->
    <div id="setup-form" class="hidden">
        <div class="input-group">
            <label><i class="fa-solid fa-house"></i> บ้านเลขที่ผู้ติดต่อ</label>
            <input type="text" id="houseNumber" placeholder="เช่น 99/88">
        </div>
        
        <button class="btn btn-primary" onclick="generatePass()" id="genBtn">
            <i class="fa-solid fa-qrcode"></i> สร้าง QR Code
        </button>
    </div>

    <!-- ผลลัพธ์ QR Code -->
    <div id="pass-info" class="ticket-wrapper">
        <div id="capture-area" style="background:white; padding:10px; border-radius:10px;">
            <h3 style="margin:0; color:var(--primary);">VISITOR PASS</h3>
            <div style="font-size:0.8rem; color:#94a3b8;">Requested by: <span id="displayRequester"></span></div>
            <div id="qrcode" style="margin:15px 0; display:flex; justify-content:center;"></div>
            <div style="font-size:1.5rem; font-weight:bold; color:#334155;" id="displayHouse"></div>
            <div style="font-size:0.9rem; color:#64748b;" id="expDate"></div>
        </div>

        <button class="btn btn-save" onclick="sendImageToChat()">
            <i class="fa-solid fa-paper-plane"></i> ส่งรูปบัตรเข้าแชท LINE
        </button>
        <button class="btn btn-line" onclick="shareToLine()">
            <i class="fa-brands fa-line"></i> ส่งข้อความให้เพื่อน
        </button>
        <button class="btn" style="background:transparent; color:#94a3b8; margin-top:5px;" onclick="location.reload()">
            สร้างใหม่
        </button>
    </div>
</div>

<script>
    // --- Config ---
    const LIFF_ID = "2000143615-rk76Q732"; // **อย่าลืมใส่ LIFF ID ของพี่**
    const SUPABASE_URL = 'https://zmdywddraaeegzkvpwsw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_v6Srw8MV1VE-K3A8alvqHQ_T_O26qVQ';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    let lineProfile = null;
    let generatedPass = "";

    // --- 1. เริ่มต้นระบบ LIFF ---
    async function main() {
        try {
            await liff.init({ liffId: LIFF_ID });
            
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            lineProfile = await liff.getProfile();
            
            document.getElementById('liff-loading').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            document.getElementById('setup-form').classList.remove('hidden');
            
            // เพิ่ม timestamp เพื่อเลี่ยง cache และ crossorigin
            document.getElementById('userPicture').src = lineProfile.pictureUrl + "?" + new Date().getTime(); 
            document.getElementById('userName').innerText = lineProfile.displayName;

        } catch (err) {
            console.error(err);
            document.getElementById('liff-loading').innerHTML = `<span style="color:red">กรุณาเปิดผ่าน LINE</span>`;
        }
    }
    main();

    // --- 2. สร้างรหัส ---
    async function generatePass() {
        const house = document.getElementById('houseNumber').value.trim();
        if (!house) return Swal.fire('แจ้งเตือน', 'กรุณาระบุบ้านเลขที่', 'warning');

        const btn = document.getElementById('genBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังสร้าง...';

        try {
            let isUnique = false;
            let code = "";

            while (!isUnique) {
                code = Math.floor(100000 + Math.random() * 900000).toString();
                const { data: active } = await supabaseClient.from('access_tokens').select('id').eq('token_code', code).maybeSingle();
                const { data: deleted } = await supabaseClient.from('access_delete').select('id').eq('token_code', code).maybeSingle();
                if (!active && !deleted) isUnique = true;
            }

            const exp = new Date();
            exp.setHours(exp.getHours() + 24);

            const { error } = await supabaseClient.from('access_tokens').insert([{
                token_code: code,
                house_number: house,
                status: 'active',
                type: 'visitor',
                valid_until: exp.toISOString(),
                use_count: 0,
                requester_line_id: lineProfile?.userId || 'unknown',
                requester_name: lineProfile?.displayName || 'Guest',
                requester_picture: lineProfile?.pictureUrl || ''
            }]);

            if (error) throw error;

            generatedPass = code;
            showQR(code, house, exp);
            triggerConfetti();

        } catch (error) {
            Swal.fire('Error', error.message, 'error');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-qrcode"></i> สร้าง QR Code';
        }
    }

    function showQR(code, house, expDate) {
        document.getElementById('setup-form').classList.add('hidden');
        document.getElementById('pass-info').style.display = 'block';
        
        document.getElementById('displayHouse').innerText = house;
        document.getElementById('displayRequester').innerText = lineProfile?.displayName;
        
        const dateOptions = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        document.getElementById('expDate').innerText = "หมดอายุ: " + expDate.toLocaleDateString('th-TH', dateOptions);

        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = "";
        new QRCode(qrContainer, { text: code, width: 180, height: 180 });
    }

    // Helper Function: แปลง DataURL เป็น Blob
    function dataURLtoBlob(dataurl) {
        var arr = dataurl.split(','), mime = arr[0].match(/:(.*?);/)[1],
            bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
        while(n--){
            u8arr[n] = bstr.charCodeAt(n);
        }
        return new Blob([u8arr], {type:mime});
    }

    // --- 3. อัปโหลดรูปและส่งเข้าแชท LINE (แก้ปัญหา Android) ---
    async function sendImageToChat() {
        if (!liff.isInClient()) {
            return Swal.fire('แจ้งเตือน', 'ฟีเจอร์นี้ใช้งานได้เฉพาะในแอป LINE เท่านั้น', 'warning');
        }

        const element = document.getElementById('capture-area');
        
        Swal.fire({
            title: 'กำลังสร้างรูปภาพ...',
            text: 'กรุณารอสักครู่ ระบบกำลังส่งรูปเข้าห้องแชท',
            allowOutsideClick: false,
            didOpen: () => { Swal.showLoading() }
        });

        try {
            // 1. สร้างรูปภาพจาก HTML
            const canvas = await html2canvas(element, { scale: 2, useCORS: true });
            const blob = dataURLtoBlob(canvas.toDataURL("image/png"));
            const fileName = `pass-${generatedPass}-${Date.now()}.png`;

            // 2. อัปโหลดไป Supabase Storage (ต้องสร้าง Bucket ชื่อ 'visitor-passes' และเปิด Public)
            const { data, error } = await supabaseClient.storage
                .from('visitor-passes')
                .upload(fileName, blob, { contentType: 'image/png', upsert: true });

            if (error) throw new Error('Upload Failed: ' + error.message);

            // 3. ขอ Public URL
            const { data: publicUrlData } = supabaseClient.storage
                .from('visitor-passes')
                .getPublicUrl(fileName);
            
            const imageUrl = publicUrlData.publicUrl;

            // 4. ส่งรูปเข้าห้องแชท LINE
            if (liff.getContext().type !== "none") {
                // กรณีเปิดจากห้องแชท (Rich Menu)
                await liff.sendMessages([{
                    type: "image",
                    originalContentUrl: imageUrl,
                    previewImageUrl: imageUrl
                }]);
                Swal.fire({ icon: 'success', title: 'ส่งเรียบร้อย', text: 'รูปบัตรผ่านถูกส่งเข้าแชทแล้วครับ', timer: 2000 });
            } else {
                // กรณีเปิดจาก Link ภายนอก -> ใช้ ShareTargetPicker
                await liff.shareTargetPicker([{
                    type: "image",
                    originalContentUrl: imageUrl,
                    previewImageUrl: imageUrl
                }]);
            }
            
            Swal.close();

        } catch (err) {
            Swal.close();
            console.error(err);
            
            // กรณีส่งไม่ผ่านจริงๆ ให้แสดงปุ่มเปิด Browser
            Swal.fire({
                icon: 'error',
                title: 'ส่งอัตโนมัติไม่สำเร็จ',
                text: 'ระบบจะพาคุณไปดาวน์โหลดผ่าน Browser แทน',
                showCancelButton: true,
                confirmButtonText: 'เปิด Browser',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    liff.openWindow({ url: window.location.href, external: true });
                }
            });
        }
    }

    // ฟังก์ชันแชร์ข้อความ (Text) ปกติ
    function shareToLine() {
        if (liff.isInClient()) {
            const msg = `🏠 บัตรผ่านเข้าหมู่บ้าน\n📍 บ้านเลขที่: ${document.getElementById('displayHouse').innerText}\n🔑 รหัสผ่าน: ${generatedPass}\n(ใช้สแกน QR Code ที่ป้อมยาม)`;
            liff.shareTargetPicker([{ type: 'text', text: msg }]);
        } else {
            alert("กรุณาเปิดใน LINE เพื่อใช้งานฟีเจอร์นี้");
        }
    }

    function triggerConfetti() {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
    }
</script>
</body>
</html>
