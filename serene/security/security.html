<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ป้องกันการจำ Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ลงเวลาปฏิบัติงาน รปภ.</title>
    
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- โหลด SweetAlert2 สำหรับ Popup -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- โหลด Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Card Container -->
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-xl overflow-hidden relative">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-700 to-blue-500 h-32 relative flex justify-center">
            <h1 class="text-white text-xl font-semibold mt-6">บันทึกเวลาทำงาน</h1>
            <div class="absolute -bottom-10 w-20 h-20 bg-white rounded-full p-1 shadow-md">
                <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="w-full h-full rounded-full object-cover">
            </div>
        </div>

        <!-- Form Content -->
        <div class="pt-14 pb-8 px-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">👤 ชื่อ - นามสกุล</label>
                <input type="text" id="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="ระบุชื่อ นามสกุล">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">📱 เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="08XXXXXXXX" maxlength="10">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">⏱️ กะทำงาน</label>
                <select id="shift" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800 appearance-none">
                    <option value="กะเช้า (07:00 - 19:00)">☀️ กะเช้า (07:00 - 19:00)</option>
                    <option value="กะดึก (19:00 - 07:00)">🌙 กะดึก (19:00 - 07:00)</option>
                </select>
            </div>

            <button id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-2 mt-4">
                <span>ส่งข้อมูลลงกลุ่ม LINE</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
            
            <p class="text-xs text-center text-slate-400 mt-4">ระบบจะจำชื่อและเบอร์โทรไว้ใช้ครั้งถัดไป</p>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // 1. ตั้งค่าการเชื่อมต่อ (ใส่ค่าของคุณเรียบร้อยแล้ว)
        // ---------------------------------------------------------
        const LIFF_ID = "2009449342-CkyoZ0f9"; 
        
        // --- ฐานข้อมูล Supabase ---
        const SUPABASE_URL = "https://olwonvxplwlmqquzivjm.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sd29udnhwbHdsbXFxdXppdmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTM3OTYsImV4cCI6MjA5MzM2OTc5Nn0.hRhguKwikODZcpt9b0t43Th0-M8Yvv9fB6UNEOvYq4Y"; 
        
        // --- การแจ้งเตือน Telegram ---
        const TELEGRAM_BOT_TOKEN = "8064168284:AAFDzyATjQ0fJhsCNQRDulL1FlpU3CykFAs"; 
        const TELEGRAM_CHAT_ID = "7585120244"; 

        // ตัวแปรเก็บข้อมูลโปรไฟล์ LINE
        let userProfilePic = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"; 
        let lineUserId = ""; 

        // ---------------------------------------------------------
        // 2. ฟังก์ชันช่วยจัดการ Local Storage แบบปลอดภัย
        // ---------------------------------------------------------
        function getStorage(key) {
            try { return localStorage.getItem(key); } catch(e) { return null; }
        }
        function setStorage(key, value) {
            try { localStorage.setItem(key, value); } catch(e) {}
        }

        // ---------------------------------------------------------
        // 3. เริ่มทำงานตอนเปิดหน้าเว็บ
        // ---------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = getStorage('guardName');
            const savedPhone = getStorage('guardPhone');
            const savedShift = getStorage('guardShift');

            if (savedName) document.getElementById('name').value = savedName;
            if (savedPhone) document.getElementById('phone').value = savedPhone;
            if (savedShift) document.getElementById('shift').value = savedShift;

            document.getElementById('submitBtn').addEventListener('click', submitAndShare);
        });

        // ---------------------------------------------------------
        // 4. เริ่มต้นระบบ LIFF และดึงข้อมูล LINE Profile
        // ---------------------------------------------------------
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId || ""; // ดึง LINE UID
                    if(profile.pictureUrl) {
                        userProfilePic = profile.pictureUrl; // ดึงรูปโปรไฟล์ LINE
                        document.getElementById('profileImage').src = userProfilePic; 
                    }
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Init Error:', err);
            }
        }
        initializeLiff(); 

        // ---------------------------------------------------------
        // 5. ส่งแจ้งเตือนไปยัง Telegram Direct API
        // ---------------------------------------------------------
        async function sendToTelegram(name, phone, shift, dateStr, timeStr, location, picUrl) {
            const message = `🚨 *บันทึกเวลาปฏิบัติงาน*\n\n📍 *จุดประจำการ:* ${location}\n👤 *ชื่อ:* ${name}\n📱 *เบอร์โทร:* ${phone}\n⏱️ *กะทำงาน:* ${shift}\n📅 *วันที่:* ${dateStr}\n⏰ *เวลา:* ${timeStr}`;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;
            const payload = {
                chat_id: TELEGRAM_CHAT_ID,
                photo: picUrl,
                caption: message,
                parse_mode: "Markdown"
            };

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (e) {
                console.error("Telegram Error:", e);
            }
        }

        // ---------------------------------------------------------
        // 6. ฟังก์ชันหลักเมื่อกดปุ่มบันทึก
        // ---------------------------------------------------------
        async function submitAndShare() {
            const nameInput = document.getElementById('name').value.trim();
            const phoneInput = document.getElementById('phone').value.trim();
            const shiftInput = document.getElementById('shift').value;
            
            if (!nameInput || !phoneInput) {
                Swal.fire({
                    icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณากรอกชื่อและเบอร์โทรศัพท์', confirmButtonColor: '#2563eb'
                });
                return;
            }

            setStorage('guardName', nameInput);
            setStorage('guardPhone', phoneInput);
            setStorage('guardShift', shiftInput);

            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + " น.";
            const locationName = "ป้อม โกลเด้นแลนด์ ซีรีน";

            const btn = document.getElementById('submitBtn');
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = `<span class="animate-pulse">กำลังบันทึก...</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-75');

            try {
                // [ขั้นตอน 1] บันทึกข้อมูลลง Supabase (รวม LINE UID และ รูปโปรไฟล์)
                await fetch(`${SUPABASE_URL}/rest/v1/security_logs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        line_uid: lineUserId,
                        profile_pic_url: userProfilePic,
                        name: nameInput,
                        phone: phoneInput,
                        shift: shiftInput,
                        date_str: dateStr,
                        time_str: timeStr,
                        location: locationName
                    })
                });

                // [ขั้นตอน 2] ส่งแจ้งเตือน Telegram (เบื้องหลัง)
                sendToTelegram(nameInput, phoneInput, shiftInput, dateStr, timeStr, locationName, userProfilePic);

                // [ขั้นตอน 3] สร้าง LINE Flex Message
                const flexMessage = {
                    "type": "flex",
                    "altText": `ลงเวลา: ${nameInput} (${locationName})`,
                    "contents": {
                      "type": "bubble",
                      "size": "mega",
                      "header": {
                        "type": "box", "layout": "vertical", "backgroundColor": "#1e3a8a", "paddingAll": "20px",
                        "contents": [
                          { "type": "text", "text": "SECURITY CHECK-IN", "color": "#93c5fd", "weight": "bold", "size": "xs" },
                          { "type": "text", "text": "บันทึกเวลาปฏิบัติงาน", "color": "#ffffff", "weight": "bold", "size": "xl", "margin": "sm" }
                        ]
                      },
                      "hero": {
                        "type": "image", "url": userProfilePic, "size": "full", "aspectRatio": "1:1", "aspectMode": "cover"
                      },
                      "body": {
                        "type": "box", "layout": "vertical",
                        "contents": [
                          {
                            "type": "box", "layout": "horizontal", "backgroundColor": "#fef3c7", "cornerRadius": "md", "paddingAll": "10px",
                            "contents": [
                              { "type": "text", "text": "📍", "size": "md", "flex": 0 },
                              { "type": "text", "text": `ประจำจุด: ${locationName}`, "weight": "bold", "color": "#b45309", "size": "sm", "wrap": true, "margin": "sm" }
                            ]
                          },
                          { "type": "separator", "margin": "lg" },
                          {
                            "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm",
                            "contents": [
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "ชื่อ:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": nameInput, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3, "wrap": true } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "กะ:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": shiftInput, "color": "#16a34a", "size": "sm", "weight": "bold", "flex": 3 } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "วันที่:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": dateStr, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3 } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "เวลา:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": timeStr, "color": "#dc2626", "size": "md", "weight": "bold", "flex": 3 } ] }
                            ]
                          }
                        ]
                      }
                    }
                };

                // [ขั้นตอน 4] เปิดหน้าต่าง Share Target Picker ให้เลือกลงกลุ่ม LINE
                if (liff.isApiAvailable('shareTargetPicker')) {
                    await liff.shareTargetPicker([flexMessage]);
                    Swal.fire({ icon: 'success', title: 'สำเร็จ!', text: 'บันทึกและส่งข้อมูลเรียบร้อยแล้ว', showConfirmButton: false, timer: 2000 })
                        .then(() => { liff.closeWindow(); });
                } else {
                    Swal.fire({ icon: 'error', title: 'เปิดผ่าน LINE เท่านั้น', text: 'กรุณาเปิดลิงก์นี้ในแอป LINE เพื่อใช้งานฟังก์ชันแชร์ลงกลุ่ม' });
                }

            } catch (error) {
                console.error("Main Error:", error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่', 'error');
            } finally {
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
