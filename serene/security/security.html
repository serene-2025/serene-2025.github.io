<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- ป้องกันการจำ Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ลงเวลาปฏิบัติงาน รปภ.</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { display: none; }
        
        /* ลูกเล่นพื้นหลังเคลื่อนไหวส่วน Header */
        .animate-gradient {
            background-size: 300% 300%;
            animation: gradientBG 5s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ลูกเล่นการเด้งโผล่ขึ้นมาของ Card */
        .fade-in-up {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden relative fade-in-up">
        
        <!-- Header (มีลูกเล่น Gradient เคลื่อนไหว) -->
        <div class="animate-gradient bg-gradient-to-r from-blue-800 via-blue-500 to-indigo-700 h-40 relative flex flex-col items-center justify-center rounded-b-[2rem] shadow-sm">
            <h1 class="text-white text-2xl font-bold tracking-wide drop-shadow-md">SECURITY CHECK-IN</h1>
            <p class="text-blue-100 text-sm mt-1">ระบบบันทึกเวลาปฏิบัติงาน</p>
            
            <!-- รูปโปรไฟล์ตกแต่งสวยงาม -->
            <div class="absolute -bottom-12 w-24 h-24 bg-white rounded-full p-1.5 shadow-lg border-4 border-white">
                <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="w-full h-full rounded-full object-cover">
            </div>
        </div>

        <div class="pt-16 pb-2 px-6 flex flex-col items-center justify-center">
            <p class="text-slate-500 text-sm">ยินดีต้อนรับ</p>
            <h2 id="lineDisplayNameText" class="text-lg font-bold text-slate-800">กำลังโหลดข้อมูล...</h2>
        </div>

        <div class="pb-8 px-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">👤 ชื่อ - นามสกุล (สำหรับรายงาน)</label>
                <input type="text" id="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="ระบุชื่อ นามสกุล">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">📱 เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="08XXXXXXXX" maxlength="10">
            </div>

            <!-- กะทำงาน (ตั้งค่าให้อัตโนมัติและล็อคไว้ไม่ให้แก้) -->
            <div class="relative">
                <label class="block text-sm font-medium text-slate-700 mb-1">⏱️ กะทำงาน (อัตโนมัติ)</label>
                <input type="text" id="shift" readonly class="w-full px-4 py-3 bg-blue-50/50 border border-blue-100 rounded-xl text-blue-800 font-semibold focus:outline-none cursor-not-allowed">
                <span class="absolute right-4 top-9 text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-md">Auto</span>
            </div>

            <button id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 active:scale-95 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-blue-500/30 transition-all flex justify-center items-center gap-2 mt-6">
                <span>บันทึกและแชร์ข้อมูล</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const LIFF_ID = "2009449342-CkyoZ0f9"; 
        
        const SUPABASE_URL = "https://olwonvxplwlmqquzivjm.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sd29udnhwbHdsbXFxdXppdmptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTM3OTYsImV4cCI6MjA5MzM2OTc5Nn0.hRhguKwikODZcpt9b0t43Th0-M8Yvv9fB6UNEOvYq4Y"; 
        
        const TELEGRAM_BOT_TOKEN = "8064168284:AAFDzyATjQ0fJhsCNQRDulL1FlpU3CykFAs"; 
        const TELEGRAM_CHAT_ID = "7585120244"; 

        let userProfilePic = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"; 
        let lineUserId = ""; 
        let lineDisplayName = "ไม่ทราบชื่อ LINE"; // ตัวแปรเก็บชื่อ LINE

        function calculateShiftAuto() {
            const currentHour = new Date().getHours();
            const shiftInput = document.getElementById('shift');
            
            // ตั้งแต่ 05:00 น. ถึง 16:59 น. -> กะเช้า
            if (currentHour >= 5 && currentHour < 17) {
                shiftInput.value = "☀️ กะเช้า (07:00 - 19:00)";
            } 
            // นอกนั้น (17:00 น. ถึง 04:59 น. ของอีกวัน) -> กะดึก
            else {
                shiftInput.value = "🌙 กะดึก (19:00 - 07:00)";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('guardName');
            const savedPhone = localStorage.getItem('guardPhone');

            if (savedName) document.getElementById('name').value = savedName;
            if (savedPhone) document.getElementById('phone').value = savedPhone;

            calculateShiftAuto(); // เรียกใช้คำนวณกะอัตโนมัติ
            document.getElementById('submitBtn').addEventListener('click', submitAndShare);
            
            initializeLiff(); // โหลด LIFF
        });

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    lineUserId = profile.userId || "";
                    
                    // อัปเดตชื่อและรูป LINE บนหน้าเว็บ
                    if(profile.displayName) {
                        lineDisplayName = profile.displayName;
                        document.getElementById('lineDisplayNameText').innerText = lineDisplayName;
                    }
                    if(profile.pictureUrl) {
                        userProfilePic = profile.pictureUrl;
                        document.getElementById('profileImage').src = userProfilePic; 
                    }
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Init Error:', err);
                document.getElementById('lineDisplayNameText').innerText = "ใช้งานผ่านเว็บเบราว์เซอร์";
            }
        }

        async function sendToTelegram(name, phone, shift, dateStr, timeStr, location, picUrl, lineName) {
            const message = `🚨 *บันทึกเวลาปฏิบัติงาน*\n\n📍 *จุดประจำการ:* ${location}\n👤 *ชื่อ-สกุล:* ${name}\n📲 *บัญชี LINE:* ${lineName}\n📱 *เบอร์โทร:* ${phone}\n⏱️ *กะทำงาน:* ${shift}\n📅 *วันที่:* ${dateStr}\n⏰ *เวลา:* ${timeStr}`;
            
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;
            const payload = {
                chat_id: TELEGRAM_CHAT_ID,
                photo: picUrl,
                caption: message,
                parse_mode: "Markdown"
            };

            try {
                await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            } catch (e) {
                console.error("Telegram Error:", e);
            }
        }

        async function submitAndShare() {
            const nameInput = document.getElementById('name').value.trim();
            const phoneInput = document.getElementById('phone').value.trim();
            const shiftInput = document.getElementById('shift').value;
            
            if (!nameInput || !phoneInput) {
                Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณากรอกชื่อและเบอร์โทรศัพท์', confirmButtonColor: '#2563eb' });
                return;
            }

            localStorage.setItem('guardName', nameInput);
            localStorage.setItem('guardPhone', phoneInput);

            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + " น.";
            const locationName = "ป้อม โกลเด้นแลนด์ ซีรีน";

            const btn = document.getElementById('submitBtn');
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = `<span class="animate-pulse">กำลังบันทึกและส่งข้อมูล...</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-75');

            try {
                // 1. บันทึกลง Supabase (เพิ่ม line_display_name)
                const supabaseResponse = await fetch(`${SUPABASE_URL}/rest/v1/security_logs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        line_uid: lineUserId,
                        line_display_name: lineDisplayName, // ส่งชื่อ LINE ลงฐานข้อมูล
                        profile_pic_url: userProfilePic,
                        name: nameInput,
                        phone: phoneInput,
                        shift: shiftInput,
                        date_str: dateStr,
                        time_str: timeStr,
                        location: locationName
                    })
                });

                if (!supabaseResponse.ok) throw new Error("Supabase Error");

                // 2. ส่ง Telegram
                sendToTelegram(nameInput, phoneInput, shiftInput, dateStr, timeStr, locationName, userProfilePic, lineDisplayName);

                // 3. Flex Message
                const flexMessage = {
                    "type": "flex",
                    "altText": `ลงเวลา: ${nameInput} (${locationName})`,
                    "contents": {
                      "type": "bubble",
                      "size": "mega",
                      "header": {
                        "type": "box", "layout": "vertical", "backgroundColor": "#1e40af", "paddingAll": "20px",
                        "contents": [
                          { "type": "text", "text": "SECURITY CHECK-IN", "color": "#93c5fd", "weight": "bold", "size": "xs" },
                          { "type": "text", "text": "บันทึกเวลาปฏิบัติงาน", "color": "#ffffff", "weight": "bold", "size": "xl", "margin": "sm" }
                        ]
                      },
                      "hero": { "type": "image", "url": userProfilePic, "size": "full", "aspectRatio": "1:1", "aspectMode": "cover" },
                      "body": {
                        "type": "box", "layout": "vertical",
                        "contents": [
                          {
                            "type": "box", "layout": "horizontal", "backgroundColor": "#fef3c7", "cornerRadius": "md", "paddingAll": "10px",
                            "contents": [
                              { "type": "text", "text": "📍", "size": "md", "flex": 0 },
                              { "type": "text", "text": `ประจำจุด: ${locationName}`, "weight": "bold", "color": "#b45309", "size": "sm", "wrap": true, "margin": "sm" }
                            ]
                          },
                          { "type": "separator", "margin": "lg" },
                          {
                            "type": "box", "layout": "vertical", "margin": "lg", "spacing": "sm",
                            "contents": [
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "ชื่อ:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": nameInput, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3, "wrap": true } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "LINE:", "color": "#aaaaaa", "size": "xs", "flex": 1 }, { "type": "text", "text": lineDisplayName, "color": "#64748b", "size": "xs", "flex": 3, "wrap": true } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "กะ:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": shiftInput, "color": "#16a34a", "size": "sm", "weight": "bold", "flex": 3 } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "วันที่:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": dateStr, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3 } ] },
                              { "type": "box", "layout": "horizontal", "contents": [ { "type": "text", "text": "เวลา:", "color": "#aaaaaa", "size": "sm", "flex": 1 }, { "type": "text", "text": timeStr, "color": "#dc2626", "size": "md", "weight": "bold", "flex": 3 } ] }
                            ]
                          }
                        ]
                      }
                    }
                };

                // 4. Share Target Picker
                if (liff.isApiAvailable('shareTargetPicker')) {
                    await liff.shareTargetPicker([flexMessage]);
                    Swal.fire({ icon: 'success', title: 'สำเร็จ!', text: 'บันทึกและส่งข้อมูลเรียบร้อยแล้ว', showConfirmButton: false, timer: 2000 })
                        .then(() => { liff.closeWindow(); });
                } else {
                    Swal.fire({ icon: 'error', title: 'เปิดผ่าน LINE เท่านั้น', text: 'กรุณาเปิดลิงก์นี้ในแอป LINE เพื่อใช้งานฟังก์ชันแชร์ลงกลุ่ม' });
                }

            } catch (error) {
                console.error("Main Error:", error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่', 'error');
            } finally {
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
