<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงเวลาปฏิบัติงาน รปภ.</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- โหลด SweetAlert2 สำหรับ Popup สวยๆ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- โหลด Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Card Container (พอดีกับหน้าจอมือถือ) -->
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-xl overflow-hidden relative">
        
        <!-- Header (ส่วนหัวสีน้ำเงิน) -->
        <div class="bg-gradient-to-r from-blue-700 to-blue-500 h-32 relative flex justify-center">
            <h1 class="text-white text-xl font-semibold mt-6">บันทึกเวลาทำงาน</h1>
            <!-- รูปโปรไฟล์จะมาทับตรงเส้นขอบพอดี -->
            <div class="absolute -bottom-10 w-20 h-20 bg-white rounded-full p-1 shadow-md">
                <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="w-full h-full rounded-full object-cover">
            </div>
        </div>

        <!-- Form Content -->
        <div class="pt-14 pb-8 px-6 space-y-5">
            
            <!-- ชื่อ-นามสกุล -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">👤 ชื่อ - นามสกุล</label>
                <input type="text" id="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="ระบุชื่อ นามสกุล">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">📱 เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="08XXXXXXXX" maxlength="10">
            </div>

            <!-- กะทำงาน -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">⏱️ กะทำงาน</label>
                <select id="shift" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800 appearance-none">
                    <option value="กะเช้า (07:00 - 19:00)">☀️ กะเช้า (07:00 - 19:00)</option>
                    <option value="กะดึก (19:00 - 07:00)">🌙 กะดึก (19:00 - 07:00)</option>
                </select>
            </div>

            <!-- ปุ่ม Submit -->
            <button onclick="submitAndShare()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-2 mt-4">
                <span>ส่งข้อมูลลงกลุ่ม LINE</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
            
            <p class="text-xs text-center text-slate-400 mt-4">ระบบจะจำชื่อและเบอร์โทรไว้ใช้ครั้งถัดไป</p>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // 1. ตั้งค่าการเชื่อมต่อ (แก้ไขตรงนี้)
        // ---------------------------------------------------------
        const LIFF_ID = "2009436870-zFhPouYI"; // ตัวอย่าง: "1234567890-Abcdefgh"
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxJr1J3g1ePgJOtsP8OA7MCqDC8i6-fWhv6jIzWKIoEe2_o9wFhAip01bMbs24r_7Se0w/exec"; // URL จาก Google Apps Script

        let userProfilePic = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"; // รูป Default

        // ---------------------------------------------------------
        // 2. เมื่อหน้าเว็บโหลดเสร็จ ให้ดึงข้อมูลเก่ามาแสดง
        // ---------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('guardName');
            const savedPhone = localStorage.getItem('guardPhone');
            const savedShift = localStorage.getItem('guardShift');

            if (savedName) document.getElementById('name').value = savedName;
            if (savedPhone) document.getElementById('phone').value = savedPhone;
            if (savedShift) document.getElementById('shift').value = savedShift;
        });

        // ---------------------------------------------------------
        // 3. เริ่มต้นระบบ LIFF และดึงรูปโปรไฟล์ LINE
        // ---------------------------------------------------------
        async function initializeLiff() {
            try {
                // 4.1 ส่งข้อมูลไปบันทึกที่ Google Sheets และแจ้ง Telegram
                // หมายเหตุ: หากยังไม่มี GAS_URL ฟังก์ชันนี้จะข้ามไปไม่แจ้ง Error ร้ายแรงในหน้าแอป
                if (GAS_URL !== "YOUR_GOOGLE_APPS_SCRIPT_URL") {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors', // เพื่อแก้ปัญหาเรื่อง CORS ชั่วคราวเมื่อยิงไปที่ GAS
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        // *** เพิ่ม profilePicUrl: userProfilePic ตรงนี้ ***
                        body: JSON.stringify({ 
                            name: nameInput, 
                            phone: phoneInput, 
                            shift: shiftInput, 
                            datetime: datetimeStr,
                            profilePicUrl: userProfilePic 
                        })
                    });
                }

                // 4.2 สร้าง Flex Message Template สำหรับแชร์
                const flexMessage = {
                    "type": "flex",
                    "altText": `ลงเวลาทำงาน: ${nameInput}`,
                    "contents": {
                      "type": "bubble",
                      "header": {
                        "type": "box",
                        "layout": "vertical",
                        "backgroundColor": "#1d4ed8",
                        "contents": [
                          {
                            "type": "text",
                            "text": "⏱️ บันทึกเวลาปฏิบัติงาน",
                            "color": "#ffffff",
                            "weight": "bold",
                            "size": "lg"
                          }
                        ]
                      },
                      "hero": {
                        "type": "image",
                        "url": userProfilePic, // รูปโปรไฟล์ LINE รปภ.
                        "size": "full",
                        "aspectRatio": "1:1",
                        "aspectMode": "cover"
                      },
                      "body": {
                        "type": "box",
                        "layout": "vertical",
                        "spacing": "md",
                        "contents": [
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              { "type": "text", "text": "ชื่อ:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                              { "type": "text", "text": nameInput, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3, "wrap": true }
                            ]
                          },
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              { "type": "text", "text": "เบอร์:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                              { "type": "text", "text": phoneInput, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3 }
                            ]
                          },
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              { "type": "text", "text": "กะ:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                              { "type": "text", "text": shiftInput, "color": "#16a34a", "size": "sm", "weight": "bold", "flex": 3 }
                            ]
                          },
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "contents": [
                              { "type": "text", "text": "เวลา:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                              { "type": "text", "text": datetimeStr, "color": "#dc2626", "size": "sm", "weight": "bold", "flex": 3 }
                            ]
                          }
                        ]
                      }
                    }
                };

                // 4.3 เรียก Share Target Picker
                if (liff.isApiAvailable('shareTargetPicker')) {
                    await liff.shareTargetPicker([flexMessage]);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ!',
                        text: 'บันทึกและส่งข้อมูลเรียบร้อยแล้ว',
                        showConfirmButton: false,
                        timer: 2000
                    }).then(() => {
                        liff.closeWindow(); // ปิดหน้าต่าง LIFF อัตโนมัติหลังส่งเสร็จ
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'แชร์ไม่ได้',
                        text: 'คุณต้องเปิดเว็บนี้ผ่าน LINE เท่านั้น เพื่อใช้ฟีเจอร์ส่งเข้ากลุ่ม'
                    });
                }

            } catch (error) {
                console.error("Error:", error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถทำรายการได้ กรุณาลองใหม่', 'error');
            } finally {
                // คืนค่าปุ่มกลับมาเหมือนเดิม
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
