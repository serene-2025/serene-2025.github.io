<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงเวลาปฏิบัติงาน รปภ.</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- โหลด SweetAlert2 สำหรับ Popup สวยๆ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- โหลด Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Card Container (พอดีกับหน้าจอมือถือ) -->
    <div class="bg-white w-full max-w-sm rounded-3xl shadow-xl overflow-hidden relative">
        
        <!-- Header (ส่วนหัวสีน้ำเงิน) -->
        <div class="bg-gradient-to-r from-blue-700 to-blue-500 h-32 relative flex justify-center">
            <h1 class="text-white text-xl font-semibold mt-6">บันทึกเวลาทำงาน</h1>
            <!-- รูปโปรไฟล์จะมาทับตรงเส้นขอบพอดี -->
            <div class="absolute -bottom-10 w-20 h-20 bg-white rounded-full p-1 shadow-md">
                <img id="profileImage" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="w-full h-full rounded-full object-cover">
            </div>
        </div>

        <!-- Form Content -->
        <div class="pt-14 pb-8 px-6 space-y-5">
            
            <!-- ชื่อ-นามสกุล -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">👤 ชื่อ - นามสกุล</label>
                <input type="text" id="name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="ระบุชื่อ นามสกุล">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">📱 เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800" placeholder="08XXXXXXXX" maxlength="10">
            </div>

            <!-- กะทำงาน -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">⏱️ กะทำงาน</label>
                <select id="shift" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-slate-800 appearance-none">
                    <option value="กะเช้า (07:00 - 19:00)">☀️ กะเช้า (07:00 - 19:00)</option>
                    <option value="กะดึก (19:00 - 07:00)">🌙 กะดึก (19:00 - 07:00)</option>
                </select>
            </div>

            <!-- ปุ่ม Submit -->
            <button onclick="submitAndShare()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-95 text-white py-3.5 rounded-xl font-semibold shadow-lg shadow-blue-200 transition-all flex justify-center items-center gap-2 mt-4">
                <span>ส่งข้อมูลลงกลุ่ม LINE</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
            
            <p class="text-xs text-center text-slate-400 mt-4">ระบบจะจำชื่อและเบอร์โทรไว้ใช้ครั้งถัดไป</p>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // 1. ตั้งค่าการเชื่อมต่อ
        // ---------------------------------------------------------
        const LIFF_ID = "2009449342-CkyoZ0f9"; 
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxJr1J3g1ePgJOtsP8OA7MCqDC8i6-fWhv6jIzWKIoEe2_o9wFhAip01bMbs24r_7Se0w/exec";

        let userProfilePic = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png"; // รูป Default

        // ---------------------------------------------------------
        // 2. เมื่อหน้าเว็บโหลดเสร็จ ให้ดึงข้อมูลเก่ามาแสดง
        // ---------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('guardName');
            const savedPhone = localStorage.getItem('guardPhone');
            const savedShift = localStorage.getItem('guardShift');

            if (savedName) document.getElementById('name').value = savedName;
            if (savedPhone) document.getElementById('phone').value = savedPhone;
            if (savedShift) document.getElementById('shift').value = savedShift;
        });

        // ---------------------------------------------------------
        // 3. เริ่มต้นระบบ LIFF และดึงรูปโปรไฟล์ LINE
        // ---------------------------------------------------------
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    if(profile.pictureUrl) {
                        userProfilePic = profile.pictureUrl;
                        document.getElementById('profileImage').src = userProfilePic; 
                    }
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error('LIFF Init Error:', err);
                Swal.fire({
                    icon: 'error',
                    title: 'การเชื่อมต่อ LINE มีปัญหา',
                    text: 'กรุณาตรวจสอบว่าเปิดผ่านแอป LINE และตั้งค่า Endpoint URL ถูกต้อง'
                });
            }
        }
        
        // เรียกใช้งานทันทีเมื่อเปิดหน้าเว็บ
        initializeLiff(); 

        // ---------------------------------------------------------
        // 4. ฟังก์ชันเมื่อกดปุ่ม "ส่งข้อมูลลงกลุ่ม LINE"
        // ---------------------------------------------------------
        async function submitAndShare() {
            const nameInput = document.getElementById('name').value.trim();
            const phoneInput = document.getElementById('phone').value.trim();
            const shiftInput = document.getElementById('shift').value;
            
            // ตรวจสอบความถูกต้อง
            if (!nameInput || !phoneInput) {
                Swal.fire({
                    icon: 'warning',
                    title: 'ข้อมูลไม่ครบ',
                    text: 'กรุณากรอกชื่อและเบอร์โทรศัพท์ให้เรียบร้อยครับ',
                    confirmButtonColor: '#2563eb'
                });
                return;
            }

            // บันทึกค่าลง Local Storage
            localStorage.setItem('guardName', nameInput);
            localStorage.setItem('guardPhone', phoneInput);
            localStorage.setItem('guardShift', shiftInput);

            // ดึงเวลาปัจจุบัน และแยกวันที่กับเวลาออกจากกัน
            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', { 
                year: 'numeric', month: 'long', day: 'numeric' 
            });
            const timeStr = now.toLocaleTimeString('th-TH', { 
                hour: '2-digit', minute: '2-digit' 
            }) + " น.";
            
            // กำหนดจุดประจำการ
            const locationName = "ป้อม โกลเด้นแลนด์ ซีรีน";

            // เปลี่ยนสถานะปุ่ม
            const btn = document.getElementById('submitBtn');
            const originalBtnContent = btn.innerHTML;
            btn.innerHTML = `<span class="animate-pulse">กำลังประมวลผล...</span>`;
            btn.disabled = true;
            btn.classList.add('opacity-75');

            try {
                // 4.1 ส่งข้อมูลไปบันทึกที่ Google Sheets (GAS)
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        name: nameInput, 
                        phone: phoneInput, 
                        shift: shiftInput, 
                        date: dateStr,
                        time: timeStr,
                        location: locationName,
                        profilePicUrl: userProfilePic 
                    })
                });

                // 4.2 สร้าง Flex Message Template โฉมใหม่
                const flexMessage = {
                    "type": "flex",
                    "altText": `ลงเวลา: ${nameInput} (${locationName})`,
                    "contents": {
                      "type": "bubble",
                      "size": "mega",
                      "header": {
                        "type": "box",
                        "layout": "vertical",
                        "backgroundColor": "#1e3a8a", 
                        "paddingAll": "20px",
                        "contents": [
                          {
                            "type": "text",
                            "text": "SECURITY CHECK-IN",
                            "color": "#93c5fd",
                            "weight": "bold",
                            "size": "xs"
                          },
                          {
                            "type": "text",
                            "text": "บันทึกเวลาปฏิบัติงาน",
                            "color": "#ffffff",
                            "weight": "bold",
                            "size": "xl",
                            "margin": "sm"
                          }
                        ]
                      },
                      "hero": {
                        "type": "image",
                        "url": userProfilePic,
                        "size": "full",
                        "aspectRatio": "1:1",
                        "aspectMode": "cover"
                      },
                      "body": {
                        "type": "box",
                        "layout": "vertical",
                        "contents": [
                          {
                            "type": "box",
                            "layout": "horizontal",
                            "backgroundColor": "#fef3c7", 
                            "cornerRadius": "md",
                            "paddingAll": "10px",
                            "contents": [
                              { "type": "text", "text": "📍", "size": "md", "flex": 0 },
                              { "type": "text", "text": `ประจำจุด: ${locationName}`, "weight": "bold", "color": "#b45309", "size": "sm", "wrap": true, "margin": "sm" }
                            ]
                          },
                          { "type": "separator", "margin": "lg" },
                          {
                            "type": "box",
                            "layout": "vertical",
                            "margin": "lg",
                            "spacing": "sm",
                            "contents": [
                              {
                                "type": "box",
                                "layout": "horizontal",
                                "contents": [
                                  { "type": "text", "text": "ชื่อ:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                                  { "type": "text", "text": nameInput, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3, "wrap": true }
                                ]
                              },
                              {
                                "type": "box",
                                "layout": "horizontal",
                                "contents": [
                                  { "type": "text", "text": "กะ:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                                  { "type": "text", "text": shiftInput, "color": "#16a34a", "size": "sm", "weight": "bold", "flex": 3 }
                                ]
                              },
                              {
                                "type": "box",
                                "layout": "horizontal",
                                "contents": [
                                  { "type": "text", "text": "วันที่:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                                  { "type": "text", "text": dateStr, "color": "#333333", "size": "sm", "weight": "bold", "flex": 3 }
                                ]
                              },
                              {
                                "type": "box",
                                "layout": "horizontal",
                                "contents": [
                                  { "type": "text", "text": "เวลา:", "color": "#aaaaaa", "size": "sm", "flex": 1 },
                                  { "type": "text", "text": timeStr, "color": "#dc2626", "size": "md", "weight": "bold", "flex": 3 }
                                ]
                              }
                            ]
                          }
                        ]
                      }
                    }
                };

                // 4.3 เรียกใช้งาน Share Target Picker
                if (liff.isApiAvailable('shareTargetPicker')) {
                    await liff.shareTargetPicker([flexMessage]);
                    
                    Swal.fire({
                        icon: 'success',
                        title: 'สำเร็จ!',
                        text: 'บันทึกและส่งข้อมูลเรียบร้อยแล้ว',
                        showConfirmButton: false,
                        timer: 2000
                    }).then(() => {
                        liff.closeWindow(); 
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'แชร์ไม่ได้',
                        text: 'คุณต้องเปิดเว็บนี้ผ่าน LINE เท่านั้น เพื่อใช้ฟีเจอร์ส่งเข้ากลุ่ม'
                    });
                }

            } catch (error) {
                console.error("Error:", error);
                Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถทำรายการได้ กรุณาลองใหม่', 'error');
            } finally {
                // คืนค่าปุ่มกลับมาเหมือนเดิม
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
